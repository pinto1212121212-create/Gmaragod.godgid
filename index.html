<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>זבחים — אנימציה לכל המסכת</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;700;900&family=Heebo:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1410;
    --ink-2: #221a14;
    --parchment: #f4ead5;
    --parchment-soft: #e8dcc0;
    --parchment-dim: #b8a888;
    --gold: #e8b76d;
    --gold-bright: #f5d39a;
    --gold-deep: #8a6638;
    --gold-shadow: #5a4220;
    --crimson: #c14a5a;
    --crimson-glow: #e87080;
    --sage: #88b27a;
    --sage-glow: #a5cc97;
    --sky: #7fb3d5;
    --sky-glow: #a5cce0;
    --warm: #e89a6d;
    --flame: #ff9844;
    --rashi: #c89568;
    --tosafot: #8fa9c4;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    background: var(--ink);
    color: var(--parchment);
    font-family: 'Heebo', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  body {
    background:
      radial-gradient(ellipse at 50% 0%, rgba(232,183,109,0.1) 0%, transparent 60%),
      linear-gradient(180deg, #1a1410 0%, #221a14 60%, #1a1410 100%);
    min-height: 100vh;
  }

  .app {
    max-width: 720px;
    margin: 0 auto;
    padding: 12px 16px 110px;
  }

  /* ===== Header with navigator ===== */
  header {
    text-align: center;
    padding: 8px 0 14px;
    border-bottom: 1px solid rgba(232,183,109,0.18);
    margin-bottom: 16px;
  }

  .masechet-name {
    font-size: 13px;
    color: var(--gold);
    letter-spacing: 0.2em;
    font-weight: 700;
  }

  .daf-nav {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 10px;
    align-items: center;
    margin-top: 10px;
  }

  .nav-arrow {
    background: rgba(232,183,109,0.15);
    border: 1px solid var(--gold);
    color: var(--gold-bright);
    width: 38px;
    height: 38px;
    border-radius: 50%;
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s, transform 0.15s;
  }
  .nav-arrow:active { transform: scale(0.92); }
  .nav-arrow:disabled { opacity: 0.3; }

  .daf-display {
    text-align: center;
    cursor: pointer;
  }
  .daf-display:active { opacity: 0.7; }

  .daf-display h1 {
    font-family: 'Frank Ruhl Libre', serif;
    font-weight: 900;
    font-size: clamp(18px, 5vw, 22px);
    color: var(--parchment);
  }

  .daf-display .perek-name {
    font-size: 11px;
    color: var(--parchment-dim);
    margin-top: 2px;
  }

  /* ===== Action bar (Translation/Rashi/Tosafot) ===== */
  .action-bar {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    margin-bottom: 16px;
  }

  .action-btn {
    padding: 12px 8px;
    border-radius: 10px;
    border: 1.5px solid;
    background: rgba(20,16,10,0.5);
    color: var(--parchment);
    font-family: 'Heebo', sans-serif;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    transition: background 0.2s, transform 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .action-btn:active { transform: scale(0.97); }

  .action-btn.trans {
    border-color: var(--gold);
    color: var(--gold-bright);
  }
  .action-btn.trans:hover { background: rgba(232,183,109,0.15); }

  .action-btn.rashi {
    border-color: var(--rashi);
    color: var(--rashi);
  }
  .action-btn.rashi:hover { background: rgba(200,149,104,0.15); }

  .action-btn.tos {
    border-color: var(--tosafot);
    color: var(--tosafot);
  }
  .action-btn.tos:hover { background: rgba(143,169,196,0.15); }

  .action-btn .count {
    background: rgba(0,0,0,0.3);
    padding: 2px 7px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 700;
  }

  .action-btn.disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  /* ===== Translation modal styling ===== */
  .modal.trans { border-top-color: var(--gold); }
  .modal.trans .modal-title { color: var(--gold-bright); }

  .trans-section-header {
    font-weight: 700;
    font-size: 15px;
    color: var(--gold);
    margin: 18px 0 10px;
    padding: 8px 12px;
    background: rgba(232,183,109,0.1);
    border-radius: 6px;
    text-align: center;
    letter-spacing: 0.02em;
  }

  .trans-section-header:first-child { margin-top: 0; }

  .trans-entry {
    margin-bottom: 12px;
    background: rgba(20,16,10,0.6);
    border-radius: 10px;
    padding: 12px 14px;
    border-right: 2px solid var(--gold-deep);
  }

  .trans-aram {
    font-family: 'Frank Ruhl Libre', serif;
    font-size: 17px;
    line-height: 1.85;
    color: var(--gold-bright);
    margin-bottom: 10px;
    padding-bottom: 10px;
    border-bottom: 1px dashed rgba(232,183,109,0.3);
  }

  .trans-heb {
    font-size: 14.5px;
    line-height: 1.75;
    color: var(--parchment-soft);
  }
  .trans-heb strong { color: var(--gold-bright); }

  .trans-summary {
    font-style: italic;
    font-size: 14px;
    color: var(--parchment-dim);
    padding: 10px 14px;
    background: rgba(232,183,109,0.04);
    border-radius: 8px;
    margin-bottom: 12px;
    border-right: 2px dashed var(--gold-deep);
    line-height: 1.65;
  }

  .trans-note {
    margin-top: 16px;
    padding: 10px 14px;
    background: rgba(127,179,213,0.06);
    border: 1px dashed var(--sky);
    border-radius: 8px;
    font-size: 12.5px;
    color: var(--parchment-dim);
    line-height: 1.6;
  }
  .trans-note strong { color: var(--sky-glow); }

  /* ===== Stage ===== */
  .stage { position: relative; min-height: 60vh; }
  .scene { display: none; }
  .scene.active {
    display: block;
    animation: gentleFade 0.3s ease-out both;
  }
  @keyframes gentleFade { from { opacity: 0; } to { opacity: 1; } }

  .scene-tag {
    display: inline-block;
    background: var(--gold-deep);
    color: var(--parchment);
    font-size: 12px;
    font-weight: 700;
    padding: 4px 12px;
    border-radius: 12px;
    margin-bottom: 12px;
  }
  .scene-tag.q { background: var(--crimson); }
  .scene-tag.a { background: var(--sage); color: var(--ink); }
  .scene-tag.surprise { background: var(--flame); color: var(--ink); }

  .scene-title {
    font-family: 'Heebo', sans-serif;
    font-weight: 900;
    font-size: clamp(20px, 5.4vw, 26px);
    color: var(--gold-bright);
    margin-bottom: 12px;
    line-height: 1.25;
  }
  .scene-title .accent { color: var(--parchment); }
  .scene-title .flame-c { color: var(--flame); }
  .scene-title .water-c { color: var(--sky-glow); }

  .story {
    font-size: 16px;
    line-height: 1.8;
    color: var(--parchment-soft);
    margin-bottom: 12px;
  }
  .story p { margin-bottom: 11px; }
  .story strong { color: var(--gold-bright); font-weight: 700; }
  .story em { color: var(--parchment); background: rgba(232,183,109,0.1); padding: 0 4px; border-radius: 3px; font-style: normal; }

  .pic {
    margin: 14px 0;
    padding: 14px 10px;
    background: radial-gradient(ellipse at center, rgba(232,183,109,0.08), transparent 75%);
    border-radius: 12px;
    text-align: center;
  }
  .pic svg { max-width: 100%; height: auto; }
  .pic-caption {
    font-size: 12px;
    color: var(--gold);
    margin-top: 6px;
    font-weight: 500;
  }

  .bubble {
    background: rgba(232,183,109,0.1);
    border: 2px solid var(--gold);
    border-radius: 14px;
    padding: 12px 14px;
    margin: 12px 0;
    font-size: 15px;
    line-height: 1.7;
    color: var(--parchment);
  }
  .bubble.question { border-color: var(--crimson); background: rgba(193,74,90,0.08); }
  .bubble.answer { border-color: var(--sage); background: rgba(136,178,122,0.08); }
  .bubble.surprise { border-color: var(--flame); background: rgba(255,152,68,0.1); }

  .bubble-label {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 10px;
    margin-bottom: 6px;
    background: var(--gold);
    color: var(--ink);
  }
  .bubble.question .bubble-label { background: var(--crimson); color: var(--parchment); }
  .bubble.answer .bubble-label { background: var(--sage); color: var(--ink); }
  .bubble.surprise .bubble-label { background: var(--flame); color: var(--ink); }

  .keyidea {
    background: linear-gradient(135deg, rgba(232,183,109,0.12), rgba(232,183,109,0.04));
    border: 2px dashed var(--gold);
    border-radius: 12px;
    padding: 12px 14px;
    margin: 12px 0;
    text-align: center;
  }
  .keyidea-label {
    font-size: 12px;
    color: var(--gold-bright);
    font-weight: 700;
    letter-spacing: 0.1em;
    margin-bottom: 6px;
  }
  .keyidea p { font-size: 15px; line-height: 1.6; color: var(--parchment); }
  .keyidea strong { color: var(--gold-bright); }

  /* List items */
  .m-item {
    display: grid;
    grid-template-columns: 28px 32px 1fr;
    gap: 10px;
    align-items: center;
    padding: 10px 12px;
    background: rgba(20,16,10,0.4);
    border-right: 2px solid var(--gold);
    border-radius: 4px;
    margin-bottom: 6px;
  }
  .m-item .m-num { font-size: 13px; color: var(--gold); text-align: center; font-weight: 700; }
  .m-item svg { width: 28px; height: 28px; color: var(--gold); }
  .m-name { font-weight: 700; font-size: 15px; color: var(--parchment); }
  .m-note { font-size: 11.5px; color: var(--parchment-dim); margin-top: 2px; }

  .vs-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin: 12px 0;
  }
  .vs-card { padding: 10px; border-radius: 10px; text-align: center; }
  .vs-card.a { background: rgba(232,183,109,0.1); border: 1.5px solid var(--gold); }
  .vs-card.b { background: rgba(127,179,213,0.1); border: 1.5px solid var(--sky); }
  .vs-card .emoji { font-size: 26px; margin-bottom: 4px; }
  .vs-card h5 { font-size: 14px; font-weight: 700; margin-bottom: 3px; }
  .vs-card.a h5 { color: var(--gold-bright); }
  .vs-card.b h5 { color: var(--sky-glow); }
  .vs-card p { font-size: 12.5px; color: var(--parchment-soft); line-height: 1.5; }

  .sage-quote {
    background: rgba(20,16,10,0.5);
    border-left: 3px solid var(--gold-bright);
    border-radius: 4px;
    padding: 10px 12px;
    margin: 10px 0;
  }
  .sage-quote .sage-name { font-weight: 700; color: var(--gold-bright); font-size: 13px; margin-bottom: 4px; }
  .sage-quote p { font-size: 14px; line-height: 1.6; color: var(--parchment); }

  /* ===== Empty state for stubs ===== */
  .stub {
    text-align: center;
    padding: 50px 20px;
  }
  .stub-icon { font-size: 56px; margin-bottom: 14px; opacity: 0.5; }
  .stub h3 {
    font-family: 'Heebo', sans-serif;
    font-weight: 700;
    font-size: 22px;
    color: var(--gold-bright);
    margin-bottom: 8px;
  }
  .stub p {
    color: var(--parchment-dim);
    font-size: 15px;
    line-height: 1.6;
    max-width: 360px;
    margin: 0 auto 20px;
  }
  .stub .stub-perek {
    background: rgba(232,183,109,0.08);
    border: 1px solid rgba(232,183,109,0.25);
    padding: 12px 16px;
    border-radius: 8px;
    display: inline-block;
    margin-top: 10px;
  }
  .stub .stub-perek-label {
    font-size: 11px;
    color: var(--gold);
    letter-spacing: 0.2em;
    margin-bottom: 4px;
  }
  .stub .stub-perek-name {
    font-size: 16px;
    color: var(--parchment);
    font-weight: 700;
  }

  /* ===== Modal ===== */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 50;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
  }
  .modal-overlay.open {
    opacity: 1;
    pointer-events: auto;
  }

  .modal {
    position: fixed;
    bottom: 0;
    right: 0;
    left: 0;
    max-height: 90vh;
    background: var(--ink-2);
    border-top: 2px solid;
    border-radius: 18px 18px 0 0;
    z-index: 51;
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.2, 0.7, 0.2, 1);
    display: flex;
    flex-direction: column;
  }
  .modal.open { transform: translateY(0); }
  .modal.rashi { border-top-color: var(--rashi); }
  .modal.tos { border-top-color: var(--tosafot); }

  .modal-handle {
    width: 40px;
    height: 4px;
    background: rgba(232,183,109,0.4);
    border-radius: 2px;
    margin: 10px auto 0;
  }

  .modal-header {
    padding: 12px 18px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid rgba(232,183,109,0.15);
  }
  .modal-title {
    font-family: 'Heebo', sans-serif;
    font-weight: 900;
    font-size: 20px;
  }
  .modal.rashi .modal-title { color: var(--rashi); }
  .modal.tos .modal-title { color: var(--tosafot); }

  .modal-close {
    background: rgba(232,183,109,0.15);
    border: none;
    color: var(--parchment);
    width: 32px;
    height: 32px;
    border-radius: 50%;
    font-size: 16px;
    cursor: pointer;
  }
  .modal-close:active { transform: scale(0.92); }

  .modal-content {
    overflow-y: auto;
    padding: 16px 18px 24px;
    flex: 1;
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
  }

  .meforesh-entry {
    padding: 12px 14px;
    background: rgba(20,16,10,0.5);
    border-radius: 10px;
    margin-bottom: 10px;
  }
  .modal.rashi .meforesh-entry { border-right: 3px solid var(--rashi); }
  .modal.tos .meforesh-entry { border-right: 3px solid var(--tosafot); }

  .meforesh-dh {
    display: inline-block;
    font-weight: 700;
    font-size: 14px;
    padding: 3px 10px;
    border-radius: 6px;
    margin-bottom: 8px;
  }
  .modal.rashi .meforesh-dh { background: var(--rashi); color: var(--ink); }
  .modal.tos .meforesh-dh { background: var(--tosafot); color: var(--ink); }

  .meforesh-content {
    font-size: 14.5px;
    line-height: 1.7;
    color: var(--parchment-soft);
  }
  .meforesh-content p { margin-bottom: 10px; }
  .meforesh-content p:last-child { margin-bottom: 0; }
  .meforesh-content strong { color: var(--gold-bright); }
  .meforesh-content em { color: var(--parchment); background: rgba(232,183,109,0.08); padding: 0 3px; border-radius: 2px; font-style: normal; }

  .modal-empty {
    text-align: center;
    padding: 30px 20px;
    color: var(--parchment-dim);
  }
  .modal-empty .e-icon { font-size: 36px; margin-bottom: 10px; opacity: 0.5; }

  /* ===== Daf picker modal ===== */
  .picker-modal {
    position: fixed;
    inset: 0;
    background: var(--ink-2);
    z-index: 60;
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.2, 0.7, 0.2, 1);
    display: flex;
    flex-direction: column;
  }
  .picker-modal.open { transform: translateY(0); }

  .picker-header {
    padding: 14px 18px;
    border-bottom: 1px solid rgba(232,183,109,0.15);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .picker-title {
    font-weight: 700;
    font-size: 17px;
    color: var(--gold-bright);
  }

  .picker-content {
    overflow-y: auto;
    padding: 14px 18px 24px;
    flex: 1;
  }

  .perek-section {
    margin-bottom: 16px;
  }

  .perek-header {
    font-weight: 700;
    font-size: 14px;
    color: var(--gold);
    margin-bottom: 8px;
    padding: 0 4px;
  }

  .daf-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(58px, 1fr));
    gap: 6px;
  }

  .daf-btn {
    padding: 10px 4px;
    background: rgba(20,16,10,0.5);
    border: 1px solid rgba(232,183,109,0.2);
    border-radius: 6px;
    color: var(--parchment);
    font-family: 'Heebo', sans-serif;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    text-align: center;
    transition: background 0.2s;
  }
  .daf-btn:active { transform: scale(0.95); }
  .daf-btn.current {
    background: var(--gold);
    color: var(--ink);
    border-color: var(--gold);
  }
  .daf-btn.has-content::after {
    content: "•";
    display: block;
    color: var(--sage-glow);
    font-size: 11px;
    margin-top: -2px;
  }

  /* ===== Bottom navigation ===== */
  .nav {
    position: fixed;
    bottom: 0;
    right: 0;
    left: 0;
    background: linear-gradient(180deg, transparent, var(--ink) 40%);
    padding: 22px 18px 18px;
    z-index: 10;
  }

  .nav-inner {
    max-width: 720px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 12px;
    align-items: center;
  }

  .nav-btn {
    background: var(--gold);
    color: var(--ink);
    border: none;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    font-size: 20px;
    cursor: pointer;
    transition: background 0.2s, transform 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    box-shadow: 0 4px 14px rgba(0,0,0,0.4);
  }
  .nav-btn:active { transform: scale(0.92); }
  .nav-btn:disabled { opacity: 0.3; }

  .progress {
    display: flex;
    gap: 5px;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
  }
  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: rgba(232,183,109,0.3);
    transition: background 0.25s, width 0.25s, border-radius 0.25s;
    cursor: pointer;
  }
  .dot.active {
    background: var(--gold);
    width: 20px;
    border-radius: 4px;
  }

  .scene-counter {
    text-align: center;
    font-size: 11px;
    color: var(--parchment-dim);
    margin-top: 10px;
  }

  /* ===== Tabs ===== */
  .tabs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin-top: 12px;
    padding: 4px;
    background: rgba(20,16,10,0.5);
    border-radius: 12px;
    border: 1px solid rgba(232,183,109,0.18);
  }

  .tab {
    padding: 10px 8px;
    background: transparent;
    border: none;
    color: var(--parchment-dim);
    font-family: 'Heebo', sans-serif;
    font-weight: 700;
    font-size: 14px;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.25s, color 0.25s;
  }
  .tab:active { transform: scale(0.97); }
  .tab.active {
    background: var(--gold-deep);
    color: var(--parchment);
  }

  /* Hide masechet-only sections when in tutorial mode */
  body.tutorial-mode .masechet-only { display: none; }

  /* ===== Tutorial: terms (clickable Aramaic) ===== */
  .term {
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 5px;
    transition: background 0.2s;
    border-bottom: 2px dotted;
    display: inline-block;
  }
  .term.statement { background: rgba(232,183,109,0.15); border-color: var(--gold); color: var(--gold-bright); }
  .term.question { background: rgba(193,74,90,0.15); border-color: var(--crimson); color: var(--crimson-glow); }
  .term.answer { background: rgba(136,178,122,0.15); border-color: var(--sage); color: var(--sage-glow); }
  .term.source { background: rgba(127,179,213,0.15); border-color: var(--sky); color: var(--sky-glow); }
  .term.distinction { background: rgba(176,143,196,0.15); border-color: #b08fc4; color: #b08fc4; }
  .term.conclusion { background: rgba(232,154,109,0.15); border-color: var(--warm); color: var(--warm); }
  .term:active { transform: scale(0.95); }

  let p = perakim[0];
  for (const perek of perakim) {
    if (perek.start < daf || (perek.start === daf && perek.startAmud === 'a' && amud === 'a') || (perek.start === daf && perek.startAmud === amud)) {
      p = perek;
    } else {
      break;
    }
  }
  return p;
}

// =======================================================
// AMUDIM DATA - generate stubs, then override
// =======================================================
const amudim = {};

// Generate stubs for all 238 amudim (daf 2 to 120, both sides)
for (let d = 2; d <= 120; d++) {
  for (const a of ['a', 'b']) {
    if (d === 120 && a === 'b') continue; // Zevachim ends at 120b - we'll include it
    const ref = `${d}${a}`;
    amudim[ref] = {
      daf: d,
      amud: a,
      scenes: [],
      rashi: [],
      tosafot: []
    };

amudim['120b'] = { daf: 120, amud: 'b', scenes: [], rashi: [], tosafot: [] };

// =======================================================

// =======================================================
amudim['42b'].scenes = [

    title: 'מה זה <span class="accent">פיגול</span>?',

// Add a simple topic line for each daf based on its perek
function addPerekContext() {
  for (const ref in amudim) {
    const a = amudim[ref];
    if (a.scenes.length > 0) continue; // skip if has content

    const perek = getPerekFor(a.daf, a.amud);
    a.scenes = [{
      tag: `פרק ${perek.num}`,
      title: `דף ${heb(a.daf)} ע״${a.amud === 'a' ? 'א' : 'ב'} — <span class="accent">${perek.name}</span>`,
      html: `
        <div class="stub">
          <div class="stub-icon">📜</div>
          <h3>תוכן עוד לא נכתב</h3>
          <p>זהו תשתית מוכנה. ניתן להוסיף סצנות אנימציה, רש״י ותוספות לדף הזה.</p>
          <div class="stub-perek">
            <div class="stub-perek-label">הפרק שבו דף זה</div>
            <div class="stub-perek-name">פרק ${perek.num} — ${perek.name}</div>
          </div>
        </div>
      `
    }];
  }
}

function heb(n) {
  const ones = ['', 'א', 'ב', 'ג', 'ד', 'ה', 'ו', 'ז', 'ח', 'ט'];
  const tens = ['', 'י', 'כ', 'ל', 'מ', 'נ', 'ס', 'ע', 'פ', 'צ'];
  const hundreds = ['', 'ק', 'ק״ק'];

  if (n < 10) return ones[n];
  if (n === 15) return 'ט״ו';
  if (n === 16) return 'ט״ז';
  if (n < 100) {
    const t = Math.floor(n / 10);
    const o = n % 10;
    if (o === 0) return tens[t];
    return tens[t] + '״' + ones[o];
  }
  // 100+
  const h = Math.floor(n / 100);
  const rest = n % 100;
  if (rest === 0) return hundreds[h];
  if (rest < 10) return hundreds[h] + '״' + ones[rest];
  const t = Math.floor(rest / 10);
  const o = rest % 10;
  if (o === 0) return hundreds[h] + tens[t];
  return hundreds[h] + tens[t] + ones[o];
}

// =======================================================
// STATE & RENDERING
// =======================================================
const state = {
  tab: 'masechet',
  ref: '42b',
  sceneIdx: 0,
  modal: null
};

function getAllRefs() {
  return Object.keys(amudim).sort((a, b) => {
    const da = parseInt(a);
    const db = parseInt(b);
    if (da !== db) return da - db;
    return a.endsWith('a') ? -1 : 1;
  });
}

const allRefs = getAllRefs();

function getCurrentIdx() { return allRefs.indexOf(state.ref); }

function goToRef(ref) {
  if (!amudim[ref]) return;
  state.ref = ref;
  state.sceneIdx = 0;
  renderAll();
  window.scrollTo(0, 0);
}

function renderHeader() {
  const amud = amudim[state.ref];
  const perek = getPerekFor(amud.daf, amud.amud);
  document.getElementById('dafTitle').textContent =
    `דף ${heb(amud.daf)} ע״${amud.amud === 'a' ? 'א' : 'ב'}`;
  document.getElementById('perekName').textContent =
    `פרק ${perek.num} — ${perek.name}`;

  const idx = getCurrentIdx();
  document.getElementById('prevDafBtn').disabled = idx === 0;
  document.getElementById('nextDafBtn').disabled = idx === allRefs.length - 1;
}

function renderActionBar() {
  const amud = amudim[state.ref];
  document.getElementById('rashiCount').textContent = amud.rashi.length;
  document.getElementById('tosCount').textContent = amud.tosafot.length;
  document.getElementById('rashiBtn').classList.toggle('disabled', amud.rashi.length === 0);
  document.getElementById('tosBtn').classList.toggle('disabled', amud.tosafot.length === 0);
}

function renderScenes() {
  const stage = document.getElementById('stage');
  const scenes = state.tab === 'masechet' ? amudim[state.ref].scenes : tutorialScenes;

  stage.innerHTML = '';
  scenes.forEach((scene, i) => {
    const div = document.createElement('section');
    div.className = 'scene' + (i === state.sceneIdx ? ' active' : '');
    div.innerHTML = `
      <div class="scene-tag ${scene.tagClass || ''}">${scene.tag}</div>
      <h2 class="scene-title">${scene.title}</h2>
      ${scene.html}
    `;
    stage.appendChild(div);
  });

  renderProgress();
}

function renderProgress() {
  const scenes = state.tab === 'masechet' ? amudim[state.ref].scenes : tutorialScenes;
  const progressEl = document.getElementById('progress');
  const counterEl = document.getElementById('counter');

  progressEl.innerHTML = '';
  for (let i = 0; i < scenes.length; i++) {
    const dot = document.createElement('div');
    dot.className = 'dot' + (i === state.sceneIdx ? ' active' : '');
    dot.addEventListener('click', () => {
      state.sceneIdx = i;
      renderScenes();
    });
    progressEl.appendChild(dot);
  }

  counterEl.textContent = scenes.length > 1
    ? `${state.sceneIdx + 1} / ${scenes.length}`
    : '';

  document.getElementById('prevSceneBtn').disabled = state.sceneIdx === 0;
  document.getElementById('nextSceneBtn').disabled = state.sceneIdx === scenes.length - 1;
}

function renderAll() {
  if (state.tab === 'masechet') {
    renderHeader();
    renderActionBar();
  }
  renderScenes();
}

function switchTab(tab) {
  if (state.tab === tab) return;
  state.tab = tab;
  state.sceneIdx = 0;
  document.body.classList.toggle('tutorial-mode', tab === 'tutorial');
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', t.dataset.tab === tab);
  });
  renderAll();
  window.scrollTo(0, 0);
}

function changeScene(delta) {
  const scenes = state.tab === 'masechet' ? amudim[state.ref].scenes : tutorialScenes;
  const newIdx = state.sceneIdx + delta;
  if (newIdx < 0 || newIdx >= scenes.length) return;
  state.sceneIdx = newIdx;
  renderScenes();
}

// =======================================================
// MODAL
// =======================================================
function openModal(type) {
  const amud = amudim[state.ref];
  const entries = type === 'rashi' ? amud.rashi : amud.tosafot;
  if (entries.length === 0) return;

  state.modal = type;
  const modal = document.getElementById(type === 'rashi' ? 'rashiModal' : 'tosModal');
  const content = document.getElementById(type === 'rashi' ? 'rashiContent' : 'tosContent');

  content.innerHTML = '';
  entries.forEach(e => {
    const div = document.createElement('div');
    div.className = 'meforesh-entry';
    div.innerHTML = `
      <div class="meforesh-dh">${e.dh}</div>
      <div class="meforesh-content">${e.content}</div>
    `;
    content.appendChild(div);
  });

  document.getElementById('modalOverlay').classList.add('open');
  modal.classList.add('open');
}

function openTranslation() {
  const amud = amudim[state.ref];
  const trans = amud.translation || [];
  const content = document.getElementById('transContent');

  if (trans.length === 0) {
    content.innerHTML = `
      <div class="modal-empty">
        <div class="e-icon">📭</div>
        <p style="color: var(--parchment-dim); font-size: 14px;">תרגום עדיין לא נוסף לדף זה.<br>התשתית מוכנה — ניתן להוסיף תרגום בקובץ.</p>
      </div>
    `;
  } else {
    let html = '';
    trans.forEach(entry => {
      if (entry.type === 'section') {
        html += `<div class="trans-section-header">${entry.title}</div>`;
      } else if (entry.type === 'quote') {
        html += `
          <div class="trans-entry">
            <div class="trans-aram">${entry.aramaic}</div>
            <div class="trans-heb">${entry.translation}</div>
          </div>
        `;
      } else if (entry.type === 'summary') {
        html += `<div class="trans-summary">${entry.text}</div>`;
      } else if (entry.type === 'note') {
        html += `<div class="trans-note">${entry.text}</div>`;
      }
    });
    content.innerHTML = html;
  }

  state.modal = 'trans';
  document.getElementById('modalOverlay').classList.add('open');
  document.getElementById('transModal').classList.add('open');
}

function closeModal() {
  state.modal = null;
  document.getElementById('modalOverlay').classList.remove('open');
  document.getElementById('rashiModal').classList.remove('open');
  document.getElementById('tosModal').classList.remove('open');
  document.getElementById('termModal').classList.remove('open');
  document.getElementById('transModal').classList.remove('open');
  document.getElementById('pickerModal').classList.remove('open');
}

// =======================================================
// DAF PICKER
// =======================================================
function openPicker() {
  const content = document.getElementById('pickerContent');
  content.innerHTML = '';

  perakim.forEach(perek => {
    const section = document.createElement('div');
    section.className = 'perek-section';

    const header = document.createElement('div');
    header.className = 'perek-header';
    header.textContent = `פרק ${perek.num} — ${perek.name}`;
    section.appendChild(header);

    const grid = document.createElement('div');
    grid.className = 'daf-grid';

    // Find range of dapim in this perek
    const perekIdx = perakim.indexOf(perek);
    const nextPerek = perakim[perekIdx + 1];
    const endDaf = nextPerek ? nextPerek.start : 121;
    const endAmud = nextPerek ? nextPerek.startAmud : 'b';

    // Iterate through dapim
    for (let d = perek.start; d < endDaf || (d === endDaf && nextPerek && nextPerek.startAmud === 'b'); d++) {
      const startA = (d === perek.start) ? perek.startAmud : 'a';
      const amudOpts = startA === 'b' ? ['b'] : ['a', 'b'];
      for (const a of amudOpts) {
        if (d === endDaf && nextPerek && a === nextPerek.startAmud) break;
        if (d === 120 && a === 'b') {} // include 120b
        const ref = `${d}${a}`;
        if (!amudim[ref]) continue;
        const btn = document.createElement('button');
        btn.className = 'daf-btn';
        if (ref === state.ref) btn.classList.add('current');
        if (amudim[ref].scenes.length > 0 && amudim[ref].scenes[0].tag !== `פרק ${getPerekFor(d, a).num}`) {
          btn.classList.add('has-content');
        }
        // Show daf number with side
        btn.textContent = `${heb(d)}${a === 'a' ? '.' : ':'}`;
        btn.addEventListener('click', () => {
          goToRef(ref);
          closeModal();
        });
        grid.appendChild(btn);
      }
    }

    section.appendChild(grid);
    content.appendChild(section);
  });

  document.getElementById('modalOverlay').classList.add('open');
  document.getElementById('pickerModal').classList.add('open');
}

// =======================================================
// EVENT BINDINGS
// =======================================================
document.getElementById('prevDafBtn').addEventListener('click', () => {
  const idx = getCurrentIdx();
  if (idx > 0) goToRef(allRefs[idx - 1]);
});
document.getElementById('nextDafBtn').addEventListener('click', () => {
  const idx = getCurrentIdx();
  if (idx < allRefs.length - 1) goToRef(allRefs[idx + 1]);
});
document.getElementById('dafDisplay').addEventListener('click', openPicker);

// Tab switching
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => switchTab(tab.dataset.tab));
});

// Term modal for clickable Aramaic words in tutorial
document.addEventListener('click', (e) => {
  const term = e.target.closest('.term');
  if (term && term.dataset.term) {
    openTerm(term.dataset.term);
  }
});

function openTerm(key) {
  const t = terms[key];
  if (!t) return;
  const fnColors = {
    statement: { bg: 'rgba(232,183,109,0.2)', color: 'var(--gold-bright)' },
    question: { bg: 'rgba(193,74,90,0.2)', color: 'var(--crimson-glow)' },
    answer: { bg: 'rgba(136,178,122,0.2)', color: 'var(--sage-glow)' },
    source: { bg: 'rgba(127,179,213,0.2)', color: 'var(--sky-glow)' },
    distinction: { bg: 'rgba(176,143,196,0.2)', color: '#b08fc4' },
    conclusion: { bg: 'rgba(232,154,109,0.2)', color: 'var(--warm)' }
  };
  const c = fnColors[t.fn];

  document.getElementById('termContent').innerHTML = `
    <div class="modal-aram-big">${t.aram}</div>
    <div class="modal-pron">${t.pron}</div>
    <div class="modal-fn-badge" style="background: ${c.bg}; color: ${c.color};">${t.fnLabel}</div>
    <div class="modal-mean-text">${t.mean}</div>
    <div class="modal-use">${t.use}</div>
  `;

  state.modal = 'term';
  document.getElementById('modalOverlay').classList.add('open');
  document.getElementById('termModal').classList.add('open');
}

document.getElementById('prevSceneBtn').addEventListener('click', () => changeScene(-1));
document.getElementById('nextSceneBtn').addEventListener('click', () => changeScene(1));

document.getElementById('rashiBtn').addEventListener('click', () => openModal('rashi'));
document.getElementById('tosBtn').addEventListener('click', () => openModal('tos'));
document.getElementById('transBtn').addEventListener('click', () => openTranslation());

document.getElementById('modalOverlay').addEventListener('click', closeModal);
document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', closeModal));

document.addEventListener('keydown', (e) => {
  if (state.modal) {
    if (e.key === 'Escape') closeModal();
    return;
  }
  if (e.key === 'ArrowLeft') changeScene(1);
  if (e.key === 'ArrowRight') changeScene(-1);
});

// Touch swipe for scenes
let touchStartX = 0, touchStartY = 0, touchStartT = 0;
document.addEventListener('touchstart', (e) => {
  if (e.touches.length !== 1) return;
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
  touchStartT = Date.now();
}, { passive: true });

document.addEventListener('touchend', (e) => {
  if (state.modal) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  const dt = Date.now() - touchStartT;
  if (Math.abs(dx) > 80 && Math.abs(dx) > Math.abs(dy) * 2 && dt < 600) {
    if (dx > 0) changeScene(-1);
    else changeScene(1);
  }
}, { passive: true });

// URL hash for deep linking
function readHash() {
  const h = window.location.hash.slice(1);
  if (h === 'tutorial') {
    switchTab('tutorial');
    return;
  }
  if (h && amudim[h]) {
    state.tab = 'masechet';
    state.ref = h;
    renderAll();
  }
}
window.addEventListener('hashchange', readHash);
readHash();

// Initial render
renderAll();
</script>

</body>
