<script>if ('serviceWorker' in navigator && location.protocol === 'https:') { const had = !!navigator.serviceWorker.controller; window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').then(r => r.update()).catch(() => {}));
  // גרסה חדשה של האתר נכנסה לפעולה: טוענים מחדש פעם אחת, כדי שיראו אותה מיד
  navigator.serviceWorker.addEventListener('controllerchange', () => { try { if (had && !sessionStorage.getItem('gemara:swrl')) { sessionStorage.setItem('gemara:swrl', '1'); location.reload(); } } catch (e) {} }); }</script>

<script>
// גרסה חדשה באתר? הדפדפן שומר עותק ישן עד 10 דקות. משווים את העותק השמור לגרסה בשרת, ואם שונה — טוענים מחדש (פעם אחת)
(async () => { try {
  const u = location.pathname, k = 'gemara:rl:' + u;
  const [a, b] = await Promise.all([fetch(u, { cache: 'force-cache' }), fetch(u, { method: 'HEAD', cache: 'no-store' })]);
  const ea = a.headers.get('etag') || a.headers.get('last-modified'), eb = b.headers.get('etag') || b.headers.get('last-modified');
  if (ea && eb && ea !== eb && !sessionStorage.getItem(k)) { sessionStorage.setItem(k, '1'); location.reload(); }
  else sessionStorage.removeItem(k);
} catch (e) {} })();
</script>

<script>
// ===== לימוד מילים — כל המילים והביטויים מ״מילה במילה״, המילון והמונחים (מחושב מראש ב־data/<מסכת>/words.js) =====
// התקדמות: localStorage 'gemara:words' = { מילה: {b: תיבה 0..5, d: מתי לחזור (ms), r: נכון, w: טעות} } — שיטת לייטנר
const $ = id => document.getElementById(id);
const AMN = { '2a': 'ב׳ ע״א', '2b': 'ב׳ ע״ב', '3a': 'ג׳ ע״א', '3b': 'ג׳ ע״ב', '4a': 'ד׳ ע״א', '4b': 'ד׳ ע״ב', '5a': 'ה׳ ע״א', '5b': 'ה׳ ע״ב', '6a': 'ו׳ ע״א', '6b': 'ו׳ ע״ב', '7a': 'ז׳ ע״א', '7b': 'ז׳ ע״ב', '8a': 'ח׳ ע״א', '8b': 'ח׳ ע״ב', '9a': 'ט׳ ע״א', '9b': 'ט׳ ע״ב', '10a': 'י׳ ע״א', '10b': 'י׳ ע״ב', '11a': 'י״א ע״א', '11b': 'י״א ע״ב', '12a': 'י״ב ע״א' };
const REFS = Object.keys(AMN);
const clean = s => String(s || '').replace(/<[^>]+>/g, '').replace(/[֑-ׇ״"׳'.,:;!?()\[\]]/g, '').replace(/\s+/g, ' ').trim();
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// --- המאגר: מחושב מראש ע״י .claude/tools/build.py (data/<מסכת>/words.js → WORDS), כך שלא טוענים את כל הדפים ---
const ALL = WORDS.map(o => ({ id: o.id || clean(o.w), w: o.w, m: o.m, type: o.t || 'w', refs: o.r.filter(r => AMN[r]), keys: o.k }));

// --- התקדמות ---
let P = {}; try { P = JSON.parse(localStorage.getItem('gemara:words') || '{}') || {}; } catch (e) {}
const save = () => { try { localStorage.setItem('gemara:words', JSON.stringify(P)); } catch (e) {} };
const DAY = 864e5, IV = [0, 0.02, 1, 3, 7, 16];   // ימים עד חזרה לפי תיבה (תיבה 1 ≈ חצי שעה)
const box = x => (P[x.id] && P[x.id].b) || 0;
const stat = x => !P[x.id] ? 'n' : box(x) >= 3 ? 'k' : 'l';
function mark(x, ok) {
  const p = P[x.id] || (P[x.id] = { b: 0, r: 0, w: 0 });
  if (ok) { p.b = Math.min(5, p.b + 1); p.r++; } else { p.b = 1; p.w++; }
  p.d = Date.now() + IV[p.b] * DAY; save(); stats();
}

// --- מסננים ---
let fRef = 'all', fType = 'w'; try { const s = JSON.parse(localStorage.getItem('gemara:wfilt') || '{}'); if (s.r) fRef = s.r; if (s.t) fType = s.t; } catch (e) {}
{ const r = new URLSearchParams(location.search).get('ref'); if (r && AMN[r]) fRef = r; }   // מדף הלימוד: taanit → words.html?ref=4b
const TYPES = [['w', 'מילים'], ['ph', 'ביטויים'], ['term', 'מונחי גמרא'], ['all', 'הכל']];
function pool() { return ALL.filter(x => (fRef === 'all' || x.refs.includes(fRef)) && (fType === 'all' || x.type === fType)); }
function chips() {
  const cnt = r => ALL.filter(x => (r === 'all' || x.refs.includes(r)) && (fType === 'all' || x.type === fType)).length;
  $('fRef').innerHTML = [['all', 'כל הדפים'], ...REFS.map(r => [r, AMN[r]])].map(([r, n]) => `<button type="button" class="ch${r === fRef ? ' on' : ''}" data-r="${r}">${n} <small>${cnt(r)}</small></button>`).join('');
  $('fType').innerHTML = TYPES.map(([t, n]) => `<button type="button" class="ch${t === fType ? ' on' : ''}" data-t="${t}">${n}</button>`).join('');
}
function setFilt(r, t) { if (r) fRef = r; if (t) fType = t; try { localStorage.setItem('gemara:wfilt', JSON.stringify({ r: fRef, t: fType })); } catch (e) {} chips(); stats(); render(); }
$('fRef').onclick = e => { const b = e.target.closest('[data-r]'); if (b) setFilt(b.dataset.r); };
$('fType').onclick = e => { const b = e.target.closest('[data-t]'); if (b) setFilt(null, b.dataset.t); };

function stats() {
  const pl = pool(), k = pl.filter(x => stat(x) === 'k').length, l = pl.filter(x => stat(x) === 'l').length;
  $('nK').textContent = k; $('nL').textContent = l; $('nN').textContent = pl.length - k - l;
  $('bK').style.width = (pl.length ? k / pl.length * 100 : 0) + '%'; $('bL').style.width = (pl.length ? l / pl.length * 100 : 0) + '%';
}
const where = x => x.refs.map(r => { const k = x.keys.find(k => k.startsWith(r + ':')); return `<a href="taanit.html#${k ? k.split(':').slice(0, 3).join('-') : r}">${AMN[r]}</a>`; }).join('');
function example(x) {
  const k = x.keys.find(k => TX.PUNCT && TX.PUNCT[k]);
  if (!k) {   // הדף של המילה עוד לא נטען: טוענים ברקע ומציירים שוב את הכרטיס
    const r = (x.keys[0] || '').split(':')[0]; if (r && masHas(r) && !PACKS.has(r)) loadPack(r).then(ok => { if (ok && typeof fc === 'function' && deck[di] === x) fc(); });
    return '';
  }
  let t = esc(clean(TX.PUNCT[k]) ? TX.PUNCT[k].replace(/<[^>]+>/g, '') : '');
  const re = new RegExp('(' + x.w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/\s+/g, '[\\s\\u0591-\\u05C7״"׳,.:;!?—-]*') + ')');
  t = t.replace(re, '<mark>$1</mark>');
  return `<div class="ex"><small>בגמרא · ${AMN[k.split(':')[0]]}</small>${t}</div>`;
}
const lvl = x => `<span class="lvl" aria-label="רמה ${box(x)} מתוך 5">${[1, 2, 3, 4, 5].map(i => `<i class="${i <= box(x) ? 'on' : ''}"></i>`).join('')}</span>`;
const TYN = { w: 'מילה', ph: 'ביטוי', term: 'מונח' };

// --- כרטיסיות ---
let deck = [], di = 0, sess = { ok: 0, no: 0 };
function buildDeck(shuffle) {
  const now = Date.now(), pl = pool();
  const due = pl.filter(x => P[x.id] && (P[x.id].d || 0) <= now && box(x) < 5).sort((a, b) => box(a) - box(b));
  const fresh = pl.filter(x => !P[x.id]);
  const rest = pl.filter(x => P[x.id] && (P[x.id].d || 0) > now).sort((a, b) => (P[a.id].d || 0) - (P[b.id].d || 0));
  let d = [...due, ...fresh.slice(0, Math.max(5, 20 - due.length))];
  if (!d.length) d = rest.slice(0, 20);
  if (shuffle) d.sort(() => Math.random() - .5);
  deck = d.slice(0, 20); di = 0; sess = { ok: 0, no: 0 };
}
function fc() {
  const box_ = $('fcBox');
  if (!pool().length) { box_.innerHTML = '<div class="empty">אין מילים במסנן הזה</div>'; $('fcInfo').textContent = ''; return; }
  if (di >= deck.length) {
    $('fcInfo').textContent = '';
    box_.innerHTML = `<div class="done"><div class="big vip-eyebrow">סבב הושלם</div><h2>סיימת סבב!</h2><p>ידעת ${sess.ok} · לחזרה ${sess.no}</p>
      <button class="btn pri" type="button" id="fcMore">עוד סבב</button><br><br><button class="btn sec" type="button" id="fcQuiz">למבחן על המילים</button></div>`;
    $('fcMore').onclick = () => { buildDeck(); fc(); }; $('fcQuiz').onclick = () => tab('qz');
    return;
  }
  const x = deck[di];
  $('fcInfo').textContent = `כרטיס ${di + 1} מתוך ${deck.length}`;
  box_.innerHTML = `<div class="card" id="card" role="button" tabindex="0" aria-label="הקשה להפוך את הכרטיס">
    <div class="card-in">
      <div class="face front">${lvl(x)}<span class="ty">${TYN[x.type]}</span><div class="aw${x.type !== 'w' ? ' ph' : ''}">${esc(x.w)}</div><div class="hint">הקשה להפוך · מה הפירוש?</div>
        ${canSpeak ? '<button type="button" class="speak-btn say" id="sayW" aria-label="השמע את המילה">🔊</button>' : ''}</div>
      <div class="face back">${lvl(x)}<div class="bw">${esc(x.w)}</div><div class="mean">${esc(x.m)}</div>${example(x)}<div class="where">${where(x)}</div></div>
    </div></div>
    <div class="acts"><button class="btn no" type="button" id="fcNo">✗ לא ידעתי</button><button class="btn ok" type="button" id="fcOk">✓ ידעתי</button></div>`;
  const card = $('card'); card.onclick = e => { if (e.target.closest('a,button')) return; card.classList.toggle('flip'); };
  card.onkeydown = e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); card.classList.toggle('flip'); } };
  const sw = $('sayW'); if (sw) sw.onclick = e => { e.stopPropagation(); speak(x.w, sw); };
  $('fcOk').onclick = () => { mark(x, true); sess.ok++; di++; fc(); };
  $('fcNo').onclick = () => { mark(x, false); sess.no++; deck.push(x); di++; fc(); };
}
$('fcShuffle').onclick = () => { buildDeck(true); fc(); };

// --- מבחן ---
let QZ = null, qDir = 'a2h', qLen = 10;
try { const s = JSON.parse(localStorage.getItem('gemara:wquiz') || '{}'); if (s.d) qDir = s.d; if (s.n) qLen = s.n; } catch (e) {}
function qzSetup() {
  const n = pool().length;
  $('qzBox').innerHTML = `<div class="qset">
    <h3>מבחן על ${n} מילים</h3>
    <div class="fl">כיוון</div><div class="row">
      <button class="ch${qDir === 'a2h' ? ' on' : ''}" data-d="a2h" type="button">ארמית ← עברית</button>
      <button class="ch${qDir === 'h2a' ? ' on' : ''}" data-d="h2a" type="button">עברית ← ארמית</button>
      <button class="ch${qDir === 'mix' ? ' on' : ''}" data-d="mix" type="button">מעורב</button></div>
    <div class="fl">כמה שאלות</div><div class="row">${[10, 20, 30].map(k => `<button class="ch${qLen === k ? ' on' : ''}" data-n="${k}" type="button">${k}</button>`).join('')}</div>
    <button class="btn pri" type="button" id="qzGo" ${n < 4 ? 'disabled' : ''}>▶ התחל מבחן</button>
    ${n < 4 ? '<p class="cnt">צריך לפחות 4 מילים במסנן</p>' : '<p class="cnt">המבחן מתחיל מהמילים שקשות לך יותר.</p>'}</div>`;
  $('qzBox').querySelectorAll('[data-d]').forEach(b => b.onclick = () => { qDir = b.dataset.d; persistQ(); qzSetup(); });
  $('qzBox').querySelectorAll('[data-n]').forEach(b => b.onclick = () => { qLen = +b.dataset.n; persistQ(); qzSetup(); });
  const go = $('qzGo'); if (go) go.onclick = () => qzStart();
}
function persistQ() { try { localStorage.setItem('gemara:wquiz', JSON.stringify({ d: qDir, n: qLen })); } catch (e) {} }
function qzStart(only) {
  const pl = pool();
  let items = only || [...pl].sort((a, b) => (box(a) - box(b)) || (((P[b.id] || {}).w || 0) - ((P[a.id] || {}).w || 0)) || (Math.random() - .5)).slice(0, Math.min(qLen, pl.length)).sort(() => Math.random() - .5);
  QZ = { items, i: 0, ok: 0, wrong: [] }; qzQ();
}
function qzQ() {
  const z = QZ; if (z.i >= z.items.length) return qzEnd();
  const x = z.items[z.i], dir = qDir === 'mix' ? (Math.random() < .5 ? 'a2h' : 'h2a') : qDir;
  const pl = pool().length >= 4 ? pool() : ALL;
  const val = y => dir === 'a2h' ? y.m : y.w;
  const others = pl.filter(y => y !== x && clean(val(y)) !== clean(val(x)) && y.type === x.type);
  const src = others.length >= 3 ? others : pl.filter(y => y !== x && clean(val(y)) !== clean(val(x)));
  const opts = [x]; while (opts.length < 4 && opts.length <= src.length) { const y = src[Math.floor(Math.random() * src.length)]; if (!opts.includes(y) && !opts.some(o => clean(val(o)) === clean(val(y)))) opts.push(y); }
  opts.sort(() => Math.random() - .5);
  $('qzBox').innerHTML = `<div class="qhead"><span>שאלה ${z.i + 1} מתוך ${z.items.length}</span><span>✓ ${z.ok}</span></div>
    <div class="qbar"><i style="width:${z.i / z.items.length * 100}%"></i></div>
    <div class="qq">${dir === 'a2h' ? `<small>מה פירוש</small><div class="aw">${esc(x.w)}</div>` : `<small>איך אומרים בגמרא</small><div class="mq">${esc(x.m)}</div>`}</div>
    <div class="opts">${opts.map((o, j) => `<button type="button" class="opt${dir === 'h2a' ? ' daf' : ''}" data-j="${j}"><span class="k">${'אבגד'[j]}</span>${esc(val(o))}</button>`).join('')}</div>
    <div class="fb" id="fb" aria-live="polite"></div><button class="btn pri" type="button" id="qNext" hidden>הבא ◀</button>`;
  $('qzBox').querySelectorAll('.opt').forEach(b => b.onclick = () => {
    const o = opts[+b.dataset.j], ok = o === x;
    $('qzBox').querySelectorAll('.opt').forEach(c => { c.disabled = true; if (opts[+c.dataset.j] === x) c.classList.add('right'); });
    if (!ok) { b.classList.add('wrong'); z.wrong.push(x); } else z.ok++;
    mark(x, ok);
    $('fb').className = 'fb ' + (ok ? 'ok' : 'no');
    $('fb').innerHTML = ok ? '✓ נכון' : `<b>${esc(x.w)}</b> = ${esc(x.m)} · <span style="font-weight:500">${x.refs.map(r => AMN[r]).join(', ')}</span>`;
    const nx = $('qNext'); nx.hidden = false; nx.focus();
    nx.onclick = () => { z.i++; qzQ(); };
    if (ok) setTimeout(() => { if (QZ === z && z.items[z.i] === x) { z.i++; qzQ(); } }, 900);
  });
}
function qzEnd() {
  const z = QZ, p = Math.round(z.ok / z.items.length * 100);
  const msg = p === 100 ? 'מושלם!' : p >= 80 ? 'יפה מאוד!' : p >= 50 ? 'בדרך הנכונה' : 'עוד קצת חזרה';
  $('qzBox').innerHTML = `<div class="score"><div class="ring" style="--p:${p}"><span>${p}%</span></div><h2 style="color:var(--gold-b)">${msg}</h2>
    <p class="cnt">${z.ok} נכונות מתוך ${z.items.length}</p>
    ${z.wrong.length ? `<div class="mist">${z.wrong.map(x => `<div><b>${esc(x.w)}</b> = ${esc(x.m)}</div>`).join('')}</div>
      <button class="btn pri" type="button" id="qRe">שוב רק על הטעויות</button><br><br>` : ''}
    <button class="btn sec" type="button" id="qNew">מבחן חדש</button></div>`;
  const re = $('qRe'); if (re) re.onclick = () => qzStart([...new Set(z.wrong)].sort(() => Math.random() - .5));
  $('qNew').onclick = qzSetup;
}

// --- רשימה ---
function ls() {
  const q = clean($('q').value), pl = pool().filter(x => !q || clean(x.w).includes(q) || clean(x.m).includes(q))
    .sort((a, b) => a.id.localeCompare(b.id, 'he'));
  $('lsCnt').textContent = `${pl.length} ${fType === 'term' ? 'מונחים' : fType === 'ph' ? 'ביטויים' : 'מילים'}`;
  const SN = { k: 'יודע', l: 'לומד', n: 'חדשה' };
  $('lsBox').innerHTML = pl.length ? pl.slice(0, 400).map(x => `<button type="button" class="li" data-id="${esc(x.id)}"><span class="w">${esc(x.w)}</span><span class="m">${esc(x.m)}</span><span class="st ${stat(x)}">${SN[stat(x)]}</span></button>`).join('') : '<div class="empty">לא נמצא</div>';
}
$('q').oninput = ls;
$('lsBox').onclick = e => { const b = e.target.closest('.li'); if (!b) return; const x = W.get(b.dataset.id); if (!x) return;
  deck = [x, ...deck.filter(y => y !== x)]; di = 0; tab('fc'); fc(); setTimeout(() => { const c = $('card'); if (c) c.classList.add('flip'); }, 50); };
$('reset').onclick = () => { if (confirm('לאפס את כל ההתקדמות בלימוד המילים?')) { P = {}; save(); stats(); render(); } };

// --- לשוניות ---
let cur = 'fc'; try { cur = localStorage.getItem('gemara:wtab') || 'fc'; } catch (e) {}
if (/^#(fc|qz|ls)$/.test(location.hash)) cur = location.hash.slice(1);
function tab(t) {
  cur = t; try { localStorage.setItem('gemara:wtab', t); } catch (e) {}
  document.querySelectorAll('.tab').forEach(b => { b.classList.toggle('on', b.dataset.t === t); b.setAttribute('aria-selected', b.dataset.t === t); });
  document.querySelectorAll('.pane').forEach(p => p.classList.toggle('on', p.id === 'p-' + t));
  render();
}
function render() { if (cur === 'fc') { if (!deck.length || deck.some(x => !pool().includes(x))) buildDeck(); fc(); } else if (cur === 'qz') { if (!QZ || QZ.i >= QZ.items.length || QZ.items.some(x => !pool().includes(x))) qzSetup(); } else ls(); }
document.querySelector('.tabs').onclick = e => { const b = e.target.closest('.tab'); if (b) { if (b.dataset.t === 'qz') QZ = null; tab(b.dataset.t); } };
document.addEventListener('keydown', e => {
  if (cur === 'fc' && $('card') && !e.target.closest('input')) {
    if (e.key === 'ArrowLeft') $('fcOk').click(); else if (e.key === 'ArrowRight') $('fcNo').click();
  }
  if (cur === 'qz' && /^[1-4]$/.test(e.key)) { const o = $('qzBox').querySelectorAll('.opt')[+e.key - 1]; if (o && !o.disabled) o.click(); }
});
chips(); stats(); tab(cur);
</script>
</body>
