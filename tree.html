<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<!-- 🔒 אבטחה (כמו ביומן של רינת, בלי סיסמה) -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://pinto1212121212-create.github.io; connect-src 'self'; media-src 'self'; frame-src 'none'; worker-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'; upgrade-insecure-requests">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Permissions-Policy" content="geolocation=(), microphone=(), camera=(), payment=(), usb=()">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>עץ הסוגיה — מסכת תענית</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;700;900&family=Heebo:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
  /* פריסה: מסך מלא — סרגל עליון דק, במה של מפה חיה שגוררים ומגדילים, ולוח פרטים שעולה מלמטה */
  :root {
    --ink: #120e0a; --ink-2: #1d1711; --card: #2a2119;
    --parchment: #f4ead5; --soft: #e2d5ba; --dim: #a8987a;
    --gold: #e8b76d; --gold-b: #f5d39a;
    --q: #ff5d72; --a: #6fd35c; --c: #ffc94d; --m: #5fb2ff; --n: #d7b26e; --k: #b296ff; --x: #ff5d72;
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: var(--ink); color: var(--parchment); font-family: 'Heebo', sans-serif; overflow: hidden; }
  body { display: flex; flex-direction: column; height: 100dvh; }

  .top { flex: 0 0 auto; padding: calc(6px + env(safe-area-inset-top, 0px)) max(10px, env(safe-area-inset-right, 0px)) 6px max(10px, env(safe-area-inset-left, 0px));
    background: linear-gradient(180deg, rgba(18,14,10,0.98), rgba(18,14,10,0.85)); z-index: 5; border-bottom: 1px solid rgba(232,183,109,0.15); }
  .row1 { display: grid; grid-template-columns: 40px 1fr 40px; align-items: center; gap: 6px; }
  .ib { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 18px;
    background: rgba(244,234,213,0.06); border: 1px solid rgba(232,183,109,0.25); color: inherit; text-decoration: none; cursor: pointer; font-family: inherit; }
  .ttl { text-align: center; line-height: 1.1; }
  .ttl small { display: block; font-size: 10.5px; font-weight: 800; letter-spacing: .25em; color: var(--gold); }
  .ttl b { font-family: 'Frank Ruhl Libre', serif; font-size: 22px; font-weight: 900; color: var(--gold-b); }
  .tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-top: 6px; }
  .tab { font-family: inherit; font-size: 13.5px; font-weight: 800; padding: 7px 2px; border-radius: 10px; border: 1px solid rgba(232,183,109,0.3); background: transparent; color: var(--soft); cursor: pointer; }
  .tab.on { background: var(--gold); color: var(--ink); border-color: var(--gold); }

  .stage { position: relative; flex: 1 1 auto; overflow: hidden; touch-action: none; cursor: grab;
    background: radial-gradient(ellipse at 50% 20%, rgba(232,183,109,0.10), transparent 55%), radial-gradient(ellipse at 80% 90%, rgba(95,178,255,0.06), transparent 50%), var(--ink); }
  .stage.drag { cursor: grabbing; }
  svg#map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .stars circle { fill: #f5d39a; }

  .link { fill: none; stroke-width: 3; stroke-linecap: round; opacity: .85; transition: opacity .4s; }
  .link.x { stroke-dasharray: 7 6; }
  .lbl { font-size: 11px; font-weight: 800; paint-order: stroke; stroke: #120e0a; stroke-width: 4px; text-anchor: middle; transition: opacity .4s; }
  .node { cursor: pointer; transition: opacity .45s; }
  .node .body { stroke-width: 2; transition: stroke-width .2s; }
  .node .who { font-size: 13px; font-weight: 900; fill: #fff; text-anchor: middle; }
  .node .txt { font-size: 11.5px; font-weight: 600; fill: #e8dcc2; text-anchor: middle; font-family: 'Frank Ruhl Libre', serif; }
  .node .no { font-size: 10.5px; font-weight: 900; text-anchor: middle; fill: #120e0a; }
  .node .ico { font-size: 16px; text-anchor: middle; }
  .node.sel .body { stroke-width: 4; }
  .node.sel .halo { opacity: 1; animation: pulse 1.6s ease-in-out infinite; }
  .halo { opacity: 0; transition: opacity .3s; transform-box: fill-box; transform-origin: center; }
  @keyframes pulse { 0%,100% { transform: scale(1); opacity: .9; } 50% { transform: scale(1.12); opacity: .35; } }
  .root .disc { filter: url(#glow); }
  .root .rt { font-family: 'Frank Ruhl Libre', serif; font-size: 26px; font-weight: 900; fill: #120e0a; text-anchor: middle; }
  .root .rs { font-size: 11px; font-weight: 800; fill: #120e0a; text-anchor: middle; letter-spacing: .08em; }
  .dim { opacity: .14; }
  .pending { opacity: 0; }
  .spark { fill: #fff; filter: url(#glow); }

  /* פס ״איפה אנחנו״: דף, סוגיה, על מה מדברים, המסלול לשלב הנבחר, ותמונה קטנה של הדף עם המקום מסומן */
  .where { position: absolute; top: 0; left: 0; right: 0; z-index: 5; display: flex; gap: 9px; align-items: center;
    padding: 7px max(10px, env(safe-area-inset-right, 0px)) 7px max(10px, env(safe-area-inset-left, 0px));
    background: rgba(18,14,10,0.93); backdrop-filter: blur(6px); border-bottom: 1px solid rgba(232,183,109,0.25); }
  .wh-th { position: relative; flex: 0 0 40px; height: 71px; border-radius: 4px; overflow: hidden; background: #efe9dc; display: block; box-shadow: 0 2px 8px rgba(0,0,0,.5); }
  .wh-th img { width: 100%; height: 100%; display: block; }
  .wh-th i { position: absolute; border: 1.5px solid #ff5d72; background: rgba(255,93,114,0.35); border-radius: 2px; animation: whp 1.6s ease-in-out infinite; }
  @keyframes whp { 50% { background: rgba(255,93,114,0.12); } }
  .wh-tx { flex: 1; min-width: 0; }
  .wh-l1 { font-size: 11.5px; font-weight: 800; color: var(--gold); }
  .wh-l1 b { color: var(--gold-b); }
  .wh-l2 { font-size: 14.5px; font-weight: 800; color: var(--parchment); line-height: 1.3; margin: 1px 0; }
  .wh-l3 { font-size: 11.5px; color: var(--soft); line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .wh-l3 .cur { color: var(--gold-b); font-weight: 800; }
  .hud { position: absolute; left: max(10px, env(safe-area-inset-left, 0px)); top: 104px; display: flex; flex-direction: column; gap: 6px; z-index: 3; }
  .hud .ib { background: rgba(29,23,17,0.85); backdrop-filter: blur(6px); }
  .legend { position: absolute; right: max(10px, env(safe-area-inset-right, 0px)); top: 104px; z-index: 3; display: flex; flex-direction: column; gap: 4px;
    font-size: 11px; font-weight: 800; background: rgba(29,23,17,0.78); backdrop-filter: blur(6px); border-radius: 12px; padding: 7px 9px; border: 1px solid rgba(232,183,109,0.15); }
  .legend span { display: flex; align-items: center; gap: 6px; }
  .legend i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); display: inline-block; }
  .legend.hide { display: none; }

  .story { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); z-index: 4; display: flex; gap: 6px; align-items: center;
    background: rgba(29,23,17,0.9); backdrop-filter: blur(8px); border: 1px solid rgba(232,183,109,0.35); border-radius: 30px; padding: 6px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  .story button { font-family: inherit; border: 0; cursor: pointer; border-radius: 22px; font-weight: 900; }
  .story .play { background: linear-gradient(135deg, var(--gold), var(--gold-b)); color: var(--ink); font-size: 15px; padding: 10px 18px; white-space: nowrap; }
  .story .sk { background: rgba(244,234,213,0.08); color: var(--parchment); width: 40px; height: 40px; font-size: 16px; }
  .story .prog { font-size: 12px; font-weight: 800; color: var(--soft); min-width: 48px; text-align: center; font-variant-numeric: tabular-nums; direction: ltr; }

  .hint { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 2; pointer-events: none; text-align: center;
    font-size: 14px; font-weight: 700; color: var(--soft); background: rgba(29,23,17,0.85); padding: 10px 16px; border-radius: 14px; transition: opacity .6s; }

  /* לוח הפרטים */
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 6; max-height: 68%; overflow: auto; background: rgba(29,23,17,0.97);
    border-top: 2px solid var(--rc, var(--gold)); border-radius: 20px 20px 0 0; box-shadow: 0 -14px 40px rgba(0,0,0,0.6);
    padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
    transform: translateY(105%); transition: transform .4s cubic-bezier(.2,.8,.2,1); }
  .sheet.open { transform: none; }
  .grab { width: 44px; height: 5px; border-radius: 3px; background: rgba(244,234,213,0.25); margin: 0 auto 8px; }
  /* תריס בשלושה גבהים: פס (peek) · חצי (half) · מלא (full). גוררים את הידית — החלונית עוקבת אחרי האצבע ונעצרת בגובה הקרוב */
  .sheet { max-height: none; transition: transform .35s cubic-bezier(.2,.8,.3,1), height .3s cubic-bezier(.2,.8,.3,1); }
  .sheet.s-half { height: 52%; } .sheet.s-full { height: 93%; } .sheet.s-peek { height: 82px; overflow: hidden; }
  .sheet.dragging { transition: none; }
  .sh-grip { margin: -8px -16px 0; padding: 9px 16px 6px; cursor: grab; touch-action: none; }
  .sh-grip .grab { margin: 0 auto; width: 52px; height: 6px; background: rgba(244,234,213,0.4); }
  .sheet.s-peek > :not(.sh-grip):not(.sh-head) { visibility: hidden; }
  .sheet.s-peek .sh-head .sh-no { display: none; }
  .sh-sz { margin-inline-start: auto; font: 800 12px/1 'Heebo', sans-serif; padding: 7px 10px; border-radius: 14px; border: 1px solid rgba(232,183,109,0.45);
    background: rgba(232,183,109,0.12); color: var(--gold-b); cursor: pointer; }
  .sheet.s-half .sh-pin .sh-img { max-height: 92px; }
  .sheet.s-full .sh-pin .sh-img { max-height: 170px; }
  /* כשהחלונית פתוחה — פס ״איפה אנחנו״ מתכווץ לשורה אחת, כדי שיישאר מקום לעץ */
  .stage.has-sheet .where .wh-l2, .stage.has-sheet .where .wh-l3 { display: none; }
  .stage.has-sheet .where .wh-th { height: 36px; flex-basis: 20px; }
  .stage.has-sheet .hud { top: 58px; } .stage.has-sheet .legend { top: 58px; }
  .sh-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .sh-role { font-size: 12px; font-weight: 900; color: var(--ink); background: var(--rc); border-radius: 12px; padding: 2px 10px; }
  .sh-who { font-size: 15px; font-weight: 900; }
  .sh-no { font-size: 12px; color: var(--dim); font-weight: 700; }
  .sh-x { margin-right: auto; border: 0; background: transparent; color: var(--dim); font-size: 20px; cursor: pointer; }
  .sh-rel { margin-top: 6px; font-size: 12.5px; font-weight: 800; color: var(--rc); }
  .sh-text { font-family: 'Frank Ruhl Libre', serif; font-size: 20px; line-height: 1.6; margin: 6px 0 8px; }
  .sh-exp { font-size: 15px; line-height: 1.65; background: rgba(244,234,213,0.06); border-right: 3px solid var(--rc); border-radius: 10px; padding: 8px 11px; }
  .sh-exp b { color: var(--rc); }
  /* סרגל כלים בחלונית: כל מה שיש בדף ההסבר — בתכלס, הקשר, הגמרא, מילה במילה, הצילום, מונחים */
  .sh-pin { position: sticky; top: -8px; z-index: 3; margin: 8px -16px 8px; padding: 6px 16px 0; background: rgba(29,23,17,0.99); box-shadow: 0 8px 14px -10px rgba(0,0,0,.8); }
  .sh-pin .sh-img { margin-top: 0; max-height: 128px; box-shadow: 0 0 0 1px rgba(232,183,109,0.35); }
  .sh-tabs { display: flex; gap: 5px; overflow-x: auto; scrollbar-width: none; margin: 6px -4px 0; padding: 7px 4px;
    background: rgba(29,23,17,0.98); border-bottom: 1px solid rgba(232,183,109,0.25); }
  .sh-tabs::-webkit-scrollbar { display: none; }
  .sh-tab { flex: 0 0 auto; font: 800 12.5px/1 'Heebo', sans-serif; padding: 7px 10px; border-radius: 16px; cursor: pointer;
    border: 1px solid rgba(232,183,109,0.35); background: rgba(244,234,213,0.05); color: var(--soft); }
  .sh-tab.on { background: var(--gold); color: var(--ink); border-color: var(--gold); }
  .sh-tab:disabled { opacity: .35; }
  .sh-pane { display: none; } .sh-pane.on { display: block; animation: shp .25s ease-out; }
  @keyframes shp { from { opacity: 0; transform: translateY(4px); } }
  .sh-tk2 { margin-top: 8px; font-size: 14.5px; line-height: 1.65; color: var(--soft); }
  .sh-ctxp p { margin: 0 0 8px; font-size: 15px; line-height: 1.8; color: var(--soft); }
  .g-punct { font-family: 'Frank Ruhl Libre', serif; font-size: 18px; line-height: 1.9; color: #2a2119; background: #efe6d2; border-radius: 10px; padding: 9px 12px; margin-bottom: 8px; }
  .g-punct q { quotes: none; color: #1d4f8c; font-weight: 700; }
  .wbw { display: flex; flex-wrap: wrap; gap: 5px 7px; padding: 8px 9px 7px; border-radius: 10px; margin-bottom: 8px;
    background: rgba(244,234,213,0.06); border: 1px dashed rgba(232,183,109,0.28); direction: rtl; }
  .ww { display: inline-flex; flex-direction: column; align-items: center; text-align: center; max-width: 100%; padding: 2px 6px 3px; border-radius: 7px; background: rgba(20,16,10,0.35); }
  .ww b { font-family: 'Frank Ruhl Libre', serif; font-size: 16px; font-weight: 700; color: var(--gold-b); line-height: 1.3; }
  .ww i { font-style: normal; font-size: 11.5px; color: var(--soft); line-height: 1.35; }
  .wg { display: inline-flex; flex-direction: column; max-width: 100%; border-radius: 8px; border: 1px solid rgba(232,183,109,0.3); background: rgba(20,16,10,0.25); padding: 3px 3px 4px; }
  .wg-words { display: flex; flex-wrap: wrap; gap: 3px; } .wg .ww { background: transparent; padding: 1px 4px; }
  .wg-mean { font-size: 11.5px; color: #8fdc7e; text-align: center; padding: 2px 4px 0; }
  .sh-terms div { display: flex; gap: 8px; padding: 6px 0; border-bottom: 1px dashed rgba(244,234,213,0.12); font-size: 14px; }
  .sh-terms b { color: var(--gold-b); font-family: 'Frank Ruhl Libre', serif; font-size: 16px; flex: 0 0 auto; }
  .sh-none { color: var(--dim); font-size: 13.5px; padding: 6px 0; }
  /* ההסבר הארוך: כל ההקשר — איפה אנחנו, מה נשאל ולמה */
  .sh-ctx { margin-top: 8px; background: rgba(244,234,213,0.04); border: 1px solid rgba(232,183,109,0.25); border-radius: 10px; padding: 7px 11px; }
  .sh-ctx summary { cursor: pointer; font-size: 13.5px; font-weight: 800; color: var(--gold-b); list-style: none; }
  .sh-ctx summary::-webkit-details-marker { display: none; }
  .sh-ctx summary::after { content: ' ▾'; } .sh-ctx[open] summary::after { content: ' ▴'; }
  .sh-ctx p { margin: 6px 0 0; font-size: 14.5px; line-height: 1.75; color: var(--soft); }
  .sh-kids { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
  .sh-kids .kh { font-size: 12px; font-weight: 800; color: var(--gold); }
  .kid { display: flex; gap: 8px; align-items: center; text-align: right; font-family: inherit; color: inherit; cursor: pointer; background: rgba(244,234,213,0.05);
    border: 1px solid rgba(244,234,213,0.08); border-right: 3px solid var(--kc); border-radius: 10px; padding: 7px 10px; font-size: 14px; }
  .kid b { color: var(--kc); white-space: nowrap; font-size: 12.5px; }
  .sh-img { margin-top: 10px; border-radius: 10px; overflow: hidden; background: #efe9dc; }
  .sh-img img { display: block; width: 100%; height: auto; }
  .sh-acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .sh-acts a, .sh-acts button { display: block; text-align: center; font-family: inherit; font-size: 14px; font-weight: 800; padding: 11px; border-radius: 12px; text-decoration: none; cursor: pointer; }
  .pri { background: var(--gold); color: var(--ink); border: 0; }
  .sec { background: transparent; color: var(--gold-b); border: 1.5px solid rgba(232,183,109,0.45); }

  .stage.has-sheet .story { opacity: 0; pointer-events: none; }
  .story { transition: opacity .3s; }
  .sh-nav { display: grid; grid-template-columns: 1fr 1.2fr 1fr; gap: 6px; margin-top: 10px; }
  .sh-nav button { font-family: inherit; font-weight: 900; font-size: 14px; border-radius: 12px; padding: 10px 4px; cursor: pointer; border: 0; }
  .sh-nav .sk { background: rgba(244,234,213,0.08); color: var(--parchment); }
  .sh-nav .sk:disabled { opacity: .35; cursor: default; }
  .sh-nav .play { background: linear-gradient(135deg, var(--gold), var(--gold-b)); color: var(--ink); }

  .sh-img { max-height: 210px; overflow-y: auto; position: relative; }
  .sh-imgw { position: relative; }
  .mk { position: absolute; border-radius: 3px; pointer-events: none; mix-blend-mode: multiply;
    background: color-mix(in srgb, var(--rc) 55%, transparent); box-shadow: 0 0 0 1.5px var(--rc); animation: mkIn .5s ease-out both; }
  @keyframes mkIn { from { opacity: 0; transform: scaleX(.6); } to { opacity: 1; transform: none; } }
  :focus-visible { outline: 2px solid var(--gold-b); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { .node.sel .halo { animation: none; } .sheet { transition: none; } }
</style>
</head>
<body>
<div class="top">
  <div class="row1">
    <a class="ib" href="index.html" aria-label="דף הבית">🏠</a>
    <div class="ttl"><small>מסכת תענית</small><b>🌳 עץ הסוגיה</b></div>
    <a class="ib" id="backLink" href="taanit.html" aria-label="חזרה להסבר">📖</a>
  </div>
  <div class="tabs" id="tabs"></div>
</div>

<div class="stage" id="stage">
  <svg id="map" aria-label="מפת הסוגיה">
    <defs>
      <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <radialGradient id="rootG" cx="50%" cy="40%" r="60%"><stop offset="0%" stop-color="#fff3d0"/><stop offset="60%" stop-color="#f5d39a"/><stop offset="100%" stop-color="#c98f3c"/></radialGradient>
    </defs>
    <g class="stars" id="stars"></g>
    <g id="world"><g id="links"></g><g id="labels"></g><g id="nodes"></g><g id="fx"></g></g>
  </svg>
  <div class="where" id="where"></div>
  <div class="hud">
    <button class="ib" id="zIn" aria-label="הגדל">+</button>
    <button class="ib" id="zOut" aria-label="הקטן">−</button>
    <button class="ib" id="zFit" aria-label="כל העץ">⤢</button>
    <button class="ib" id="lgBtn" aria-label="מקרא">🎨</button>
  </div>
  <div class="legend hide" id="legend">
    <span><i style="--c:var(--m)"></i>משנה / מקור</span>
    <span><i style="--c:var(--q)"></i>שאלה / דחייה</span>
    <span><i style="--c:var(--a)"></i>תירוץ</span>
    <span><i style="--c:var(--c)"></i>מסקנה</span>
    <span><i style="--c:var(--n)"></i>סיפור / ראיה</span>
  </div>
  <div class="hint" id="hint">גוררים · צובטים להגדלה · מקישים על צומת</div>
  <div class="story" id="story">
    <button class="sk" id="sPrev" aria-label="הקודם">▶</button>
    <button class="play" id="sPlay">▶ סיפור הסוגיה</button>
    <span class="prog" id="sProg"></span>
    <button class="sk" id="sNext" aria-label="הבא">◀</button>
  </div>
  <div class="sheet" id="sheet" aria-live="polite"></div>
</div>

<script src="tree-data.js"></script>
<script src="daf-marks.js"></script>
<script src="context-data.js"></script>
<script>
const ROLE = { m: ['📜', 'משנה / מקור'], q: ['❓', 'שאלה'], x: ['⚡', 'דחייה'], a: ['✅', 'תירוץ'], c: ['📌', 'מסקנה'], n: ['📖', 'סיפור / ראיה'], k: ['💡', 'הסבר'] };
const COL = { m: '#5fb2ff', q: '#ff5d72', x: '#ff5d72', a: '#6fd35c', c: '#ffc94d', n: '#d7b26e', k: '#b296ff' };
const ORD = ['ראשון', 'שני', 'שלישי', 'רביעי', 'חמישי', 'שישי'], ORDF = ['ראשונה', 'שנייה', 'שלישית', 'רביעית', 'חמישית', 'שישית'];
const RN = { a: ['תירוץ', 0], q: ['קושיה', 1], x: ['דחייה', 1], c: ['מסקנה', 1], n: ['ראיה', 1], m: ['מקור', 0], k: ['הסבר', 0] };
function relText(p, c) {
  if (c === 'c') return 'ולכן'; if (c === 'x') return 'נדחה';
  if (p === 'q' && c === 'a') return 'תירוץ'; if (c === 'q') return 'קושיה';
  if (c === 'n') return 'ראיה'; if (c === 'a') return 'תשובה'; return '';
}
const BASE = location.hostname.endsWith('github.io') || location.protocol === 'file:' || location.hostname === 'localhost'
  ? '' : 'https://pinto1212121212-create.github.io/Gmaragod.godgid/';
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
const el = (t, a = {}, p) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); if (p) p.appendChild(e); return e; };


// ===== סימון המילים המדויקות של הצומת על צילום הדף =====
const norm = t => t.replace(/<[^>]+>/g, '').replace(/[״"׳'.,:;!?()\[\]—–…⟵·]/g, ' ').replace(/\s+/g, ' ').trim();
// איזה שלב בקטע הוא הצומת הזה? לפי חפיפת מילים
function beatOf(ref, n) {
  if (n.sp) return n.sp;   // טווח מילים מפורש לצומת (כשכמה צמתים באותו שלב: שאלה ותשובה נפרדות)
  const spans = (typeof BEAT_SPAN !== 'undefined' && BEAT_SPAN[ref] && BEAT_SPAN[ref][n.s]) || null;
  if (!spans) return null;
  const nw = new Set(norm(n.t).split(' ').filter(w => w.length > 1));
  let best = null, bestScore = 0;
  for (const bi in spans) {
    const bw = norm(BEAT_WORDS[`${ref}:${n.s}:${bi}`] || '').split(' ');
    let sc = 0; for (const w of bw) if (nw.has(w)) sc++;
    const r = sc / Math.max(3, Math.min(nw.size, bw.length));
    if (r > bestScore) { bestScore = r; best = bi; }
  }
  return bestScore >= 0.25 ? spans[best] : null;
}
function slotsOf(crop) {
  const out = [];
  (DAF_LINES[crop] || []).forEach((ln, li) => {
    const [y0, y1, xl, xr, t0, t1, gaps] = ln;
    const bs = [xr, ...gaps.filter(g => g > xl + 0.01 && g < xr - 0.01).sort((a, b) => b - a), xl];
    for (let i = 0; i < bs.length - 1; i++) out.push([li, bs[i], bs[i + 1]]);
  });
  return out;
}
function marksHTML(ref, n) {
  const span = beatOf(ref, n); if (!span) return '';
  const crop = `${ref}-${n.s}`, lines = DAF_LINES[crop]; if (!lines) return '';
  const sl = slotsOf(crop), rows = [];
  let cur = null;
  for (let i = span[0]; i <= span[1] && i < sl.length; i++) {
    const [li, xa, xb] = sl[i];
    if (!cur || cur.li !== li) { cur && rows.push(cur); cur = { li, xs: xa, xe: xb }; } else cur.xe = xb;
  }
  cur && rows.push(cur);
  return rows.map(c => { const [y0, y1, xl, xr, t0, t1] = lines[c.li]; const pad = (t1 - t0) * 0.06;
    const top = Math.max(y0, t0 - pad), h = Math.min(y1, t1 + pad) - top;
    return `<i class="mk" style="top:${top * 100}%;height:${h * 100}%;left:${c.xe * 100 - 0.3}%;width:${(c.xs - c.xe) * 100 + 0.6}%"></i>`; }).join('');
}

// ===== מצב =====
const st = { ref: '4b', sel: null, sec: null };
try { const s = JSON.parse(localStorage.getItem('gemara:tree2') || 'null'); if (s && TREE[s.ref]) st.ref = s.ref; } catch (e) {}
const hm = location.hash.slice(1).match(/^(\d+[ab])(?:-(\d+))?$/);
if (hm && TREE[hm[1]]) { st.ref = hm[1]; if (hm[2] != null) st.sec = +hm[2]; }

// ===== פריסה: כל צומת רוחב קבוע, הורה מעל מרכז ילדיו; ימין-לשמאל =====
const NW = 136, NH = 62, GX = 16, GY = 112, RG = 70;
let flat = [], root = null;
function build(ref) {
  flat = [];
  const T = TREE[ref];
  root = { r: 'root', w: T.title, t: T.sum, k: T.roots, depth: 0 };
  let seq = 0;
  const prep = (n, d, parent, ord) => {
    n.depth = d; n.parent = parent; n.ord = ord;
    if (n.r !== 'root') { n.seq = ++seq; flat.push(n); }
    const kids = n.k || [], tot = {}, cur = {};
    kids.forEach(k => tot[k.r] = (tot[k.r] || 0) + 1);
    kids.forEach(k => { cur[k.r] = (cur[k.r] || 0) + 1; prep(k, d + 1, n, tot[k.r] > 1 ? cur[k.r] - 1 : -1); });
  };
  prep(root, 0, null, -1);
  // כל ענף ראשי (כל סוגיה בדף) נפרס לרוחב, והענפים הראשיים נערמים זה מתחת לזה — מתאים למסך טלפון לאורך
  let yOff = 0;
  for (const top of root.k) {
    let x = 0;
    const lay = n => {
      const kids = n.k || [];
      if (!kids.length) { n.x = x; x += NW + GX; }
      else { kids.forEach(lay); n.x = (kids[0].x + kids[kids.length - 1].x) / 2; }
      n.y = yOff + (n.depth - 1) * GY;
    };
    lay(top);
    const sub = []; const col = n => { sub.push(n); (n.k || []).forEach(col); }; col(top);
    sub.forEach(n => n.x = top.x - n.x);       // ראשון בימין, ומרכז הענף בציר 0
    yOff = Math.max(...sub.map(n => n.y)) + GY + RG;
  }
  root.x = 0; root.y = -120;
}
function relLabel(n) {
  const p = n.parent; if (!p || p.r === 'root') return '';
  const base = relText(p.r, n.r);
  if (n.ord < 0) return base;
  const [nm, f] = RN[n.r] || ['', 0];
  return `${nm} ${(f ? ORDF : ORD)[n.ord] || n.ord + 1}`;
}
function short(t, max = 22) { t = t.replace(/[״"]/g, ''); return t.length > max ? t.slice(0, max - 1) + '…' : t; }

// ===== ציור =====
function draw() {
  const L = $('links'), B = $('labels'), N = $('nodes');
  L.innerHTML = B.innerHTML = N.innerHTML = $('fx').innerHTML = '';
  const edge = (p, c) => {
    if (p.r === 'root') { const py = p.y + 46, cy = c.y - NH / 2; return `M ${p.x} ${py} L ${c.x} ${cy}`; }
    const py = p.y + NH / 2, cy = c.y - NH / 2, my = (py + cy) / 2;
    return `M ${p.x} ${py} C ${p.x} ${my} ${c.x} ${my} ${c.x} ${cy}`;
  };
  for (const n of flat) {
    const trunk = n.parent.r === 'root' && root.k.indexOf(n) > 0;   // הסוגיות הבאות: בלי קו שחוצה את הכרטיסים
    const path = el('path', { d: edge(n.parent, n), class: 'link' + (n.r === 'x' ? ' x' : ''), stroke: COL[n.r], style: trunk ? 'display:none' : '' }, L);
    n.linkEl = path;
    const lb = relLabel(n);
    if (lb) { const t = el('text', { x: n.x, y: n.y - NH / 2 - 9, class: 'lbl', fill: COL[n.r] }, B); t.textContent = lb + ' ⟵'; n.lblEl = t; }
  }
  // כותרת לכל סוגיה בדף
  root.k.forEach((top, i) => { const tp = (SUGYA_TOPIC[st.ref] || [])[i]; const t = el('text', { x: 0, y: top.y - NH / 2 - 26, class: 'lbl', fill: '#f5d39a', style: 'font-size:13px' }, B); t.textContent = `סוגיה ${i + 1}` + (tp ? ` · ${short(tp, 34)}` : ''); });
  // שורש: הדף עצמו
  const rg = el('g', { class: 'node root', transform: `translate(${root.x} ${root.y})` }, N);
  el('circle', { r: 46, class: 'disc', fill: 'url(#rootG)' }, rg);
  const rs = el('text', { y: -10, class: 'rs' }, rg); rs.textContent = 'דף';
  const rt = el('text', { y: 18, class: 'rt' }, rg); rt.textContent = root.w;
  root.el = rg;
  for (const n of flat) {
    const g = el('g', { class: 'node', transform: `translate(${n.x} ${n.y})`, tabindex: 0, role: 'button', 'aria-label': `${ROLE[n.r][1]}: ${n.w}` }, N);
    el('rect', { x: -NW / 2 - 6, y: -NH / 2 - 6, width: NW + 12, height: NH + 12, rx: 22, fill: 'none', stroke: COL[n.r], 'stroke-width': 3, class: 'halo' }, g);
    el('rect', { x: -NW / 2, y: -NH / 2, width: NW, height: NH, rx: 16, fill: '#221a13', stroke: COL[n.r], class: 'body' }, g);
    el('rect', { x: -NW / 2, y: -NH / 2, width: NW, height: 6, rx: 3, fill: COL[n.r] }, g);
    el('circle', { cx: NW / 2 - 14, cy: -NH / 2 + 18, r: 10, fill: COL[n.r] }, g);
    const no = el('text', { x: NW / 2 - 14, y: -NH / 2 + 22, class: 'no' }, g); no.textContent = n.seq;
    const ic = el('text', { x: -NW / 2 + 16, y: -NH / 2 + 24, class: 'ico' }, g); ic.textContent = ROLE[n.r][0];
    const w = el('text', { x: 0, y: -NH / 2 + 24, class: 'who' }, g); w.textContent = short(n.w, 14);
    const t = el('text', { x: 0, y: NH / 2 - 12, class: 'txt' }, g); t.textContent = short(n.t, 22);
    g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); select(n, true); } });
    n.el = g;
  }
}

// ===== מצלמה =====
const cam = { x: 0, y: 0, k: 1 };
function apply() { $('world').setAttribute('transform', `translate(${cam.x} ${cam.y}) scale(${cam.k})`); if (!st.sel) whereSoon(); }
// ===== פס ״איפה אנחנו בגמרא״ =====
function topOf(n) { while (n && n.parent && n.parent.r !== 'root') n = n.parent; return n; }
let whRAF = 0;
function whereSoon() { cancelAnimationFrame(whRAF); whRAF = requestAnimationFrame(() => where(st.sel)); }
function where(n) {
  const box = $('where'); if (!box || !root || !root.k) return;
  let top = n ? topOf(n) : null;
  if (!top) {   // אין שלב נבחר: הסוגיה שבמרכז המסך
    const { h } = stageBox(), wy = (h * 0.5 - cam.y) / cam.k;
    top = root.k[0];
    for (const t of root.k) if (t.y - NH <= wy) top = t;
  }
  const i = root.k.indexOf(top), s = (n || top).s;
  const SN = SECTION_NAMES[st.ref] || [], tp = (SUGYA_TOPIC[st.ref] || [])[i] || short(top.t, 40);
  const src = typeof DAF_SRC !== 'undefined' && DAF_SRC[st.ref] && DAF_SRC[st.ref][s];
  const chain = []; for (let m = n; m && m.r !== 'root'; m = m.parent) chain.unshift(m);
  const path = n ? chain.map(m => `<span class="${m === n ? 'cur' : ''}">${ROLE[m.r][0]} ${m.w}</span>`).join(' ← ')
                 : 'מקישים על צומת כדי לראות איפה הוא בדיון';
  box.innerHTML = `<a class="wh-th" href="${BASE}taanit.html#${st.ref}-${s}" aria-label="המקום בדף">
      <img src="taanit-img/${st.ref}-full.jpg" alt="">${src ? `<i style="left:${src[0]}%;top:${src[1]}%;width:${src[2]}%;height:${src[3]}%"></i>` : ''}</a>
    <div class="wh-tx"><div class="wh-l1">📍 <b>${TREE[st.ref].title}</b> · סוגיה ${i + 1} מתוך ${root.k.length}${SN[s] ? ` · קטע: ${SN[s]}` : ''}</div>
      <div class="wh-l2">${tp}</div><div class="wh-l3">${path}</div></div>`;
}
let tw = null;
function flyTo(tx, ty, tk, ms = 750) {
  cancelAnimationFrame(tw);
  const s = { ...cam }, t0 = performance.now(), ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const step = now => {
    const p = reduce ? 1 : Math.min(1, (now - t0) / ms), e = ease(p);
    // קשת זום קלה: מתרחקים מעט באמצע המעוף
    const bow = reduce ? 1 : 1 - 0.18 * Math.sin(Math.PI * p);
    cam.k = (s.k + (tk - s.k) * e) * bow; cam.x = s.x + (tx - s.x) * e; cam.y = s.y + (ty - s.y) * e;
    if (p === 1) { cam.k = tk; cam.x = tx; cam.y = ty; }
    apply(); if (p < 1) tw = requestAnimationFrame(step);
  };
  tw = requestAnimationFrame(step);
}
function stageBox() { const r = $('stage').getBoundingClientRect(); return { w: r.width, h: r.height }; }
function centerOn(n, k) {
  const { w, h } = stageBox();
  const sheetH = $('sheet').classList.contains('open') ? $('sheet').offsetHeight : 0;
  const k2 = k || Math.min(1.25, Math.max(0.75, w / (NW * 2.6)));
  const top = ($('where') ? $('where').offsetHeight : 0) + 34, bot = h - sheetH - 12;
  flyTo(w / 2 - n.x * k2, top + Math.max(40, bot - top) * 0.45 - n.y * k2, k2);
}
function fit(anim) {
  const { w, h } = stageBox(), all = [root, ...flat];
  const minX = Math.min(...all.map(n => n.x)) - NW / 2 - 20, maxX = Math.max(...all.map(n => n.x)) + NW / 2 + 20;
  const minY = root.y - 60, maxY = Math.max(...all.map(n => n.y)) + NH / 2 + 80;
  const k = Math.max(0.16, Math.min(1.1, w / (maxX - minX), (h - 170) / (maxY - minY)));
  const tx = w / 2 - ((minX + maxX) / 2) * k, ty = 98 - minY * k;   // 98: מתחת לפס ״איפה אנחנו״
  if (anim) flyTo(tx, ty, k); else { cam.x = tx; cam.y = ty; cam.k = k; apply(); }
}

// ===== בחירה ולוח =====
function select(n, fly) {
  st.sel = n;
  flat.forEach(m => m.el.classList.toggle('sel', m === n));
  sheet(n);
  if (fly) centerOn(n);
  $('sProg').textContent = `${n.seq}/${flat.length}`;
  where(n);
  save();
}
function sheet(n) {
  const sh = $('sheet');
  if (!n) { sh.classList.remove('open'); $('stage').classList.remove('has-sheet'); return; }
  const SN = SECTION_NAMES[st.ref] || [];
  const kids = n.k || [];
  const rel = relLabel(n);
  sh.style.setProperty('--rc', COL[n.r]);
  sh.innerHTML = `<div class="sh-grip" id="shGrip" aria-label="גרירה: הגדלה / הקטנה"><div class="grab"></div></div>
    <div class="sh-head"><span class="sh-role">${ROLE[n.r][0]} ${ROLE[n.r][1]}</span><span class="sh-who">${n.w}</span><span class="sh-no">שלב ${n.seq} מתוך ${flat.length}</span><button class="sh-sz" id="shSz"></button><button class="sh-x" id="shX" aria-label="סגור">✕</button></div>
    ${rel && n.parent && n.parent.r !== 'root' ? `<div class="sh-rel">⟵ ${rel} על: ״${short(n.parent.t, 40)}״</div>` : ''}
    <div class="sh-text">${n.t}</div>
    ${toolbar(n, kids)}
    <div class="sh-nav"><button class="sk" id="shPrev" aria-label="השלב הקודם"${n.seq === 1 ? ' disabled' : ''}>▶ הקודם</button><button class="play" id="shPlay">${story ? '❚❚ עצור' : '▶ סיפור'}</button><button class="sk" id="shNext" aria-label="השלב הבא"${n.seq === flat.length ? ' disabled' : ''}>הבא ◀</button></div>
    <div class="sh-acts"><a class="pri" href="${BASE}taanit.html#${st.ref}-${n.s}">↩ להסבר המלא</a><button class="sec" id="shUp">${n.parent && n.parent.r !== 'root' ? '⬆ לשלב שמעל' : '⤢ כל העץ'}</button></div>
    <div style="text-align:center;font-size:12px;color:var(--dim);margin-top:8px">קטע ״${SN[n.s] || n.s + 1}״</div>`;
  sh.classList.add('open');
  sheetSize(shPref, true);
  sh.querySelectorAll('.sh-tab').forEach(t => t.onclick = () => { shTab = t.dataset.t; try { localStorage.setItem('gemara:shtab', shTab); } catch (e) {}
    sh.querySelectorAll('.sh-tab').forEach(x => x.classList.toggle('on', x === t)); sh.querySelectorAll('.sh-pane').forEach(x => x.classList.toggle('on', x.dataset.t === shTab));
    shImgFocus(); });
  gripInit(sh);
  $('shX').onclick = () => { closeSheet(); };
  $('shUp').onclick = () => { if (n.parent && n.parent.r !== 'root') select(n.parent, true); else { closeSheet(); fit(true); } };
  sh.querySelectorAll('.kid').forEach(b => b.onclick = () => select(kids[+b.dataset.i], true));
  $('shPrev').onclick = () => $('sPrev').click(); $('shNext').onclick = () => $('sNext').click(); $('shPlay').onclick = () => $('sPlay').click();
  $('stage').classList.add('has-sheet');
  sh.scrollTop = 0;
  const mk = sh.querySelector('.mk'); const sim = sh.querySelector('.sh-img');
  if (mk && sim) setTimeout(shImgFocus, 50);
}
// ההסבר הארוך של צומת (TREE_CX ב־tree-data.js → CONTEXT ב־context-data.js). פתוח כברירת מחדל; זוכרים אם סגרו
function ctxOf(n) {
  const e = typeof TREE_CX !== 'undefined' && TREE_CX[st.ref] && TREE_CX[st.ref][n.seq - 1];
  if (!e) return '';
  const C = typeof CONTEXT !== 'undefined' ? CONTEXT : {};
  const parts = typeof e === 'string' ? [C[e]] : Array.isArray(e) ? e.map(k => C[k]) : [e.L];
  const body = parts.filter(Boolean).map(t => `<p>${t}</p>`).join('');
  if (!body) return '';
  let open = true; try { open = localStorage.getItem('gemara:ctxT') !== '0'; } catch (er) {}
  return `<details class="sh-ctx"${open ? ' open' : ''} ontoggle="try{localStorage.setItem('gemara:ctxT',this.open?'1':'0')}catch(e){}"><summary>🧭 ההקשר המלא — על מה מדברים כאן</summary>${body}</details>`;
}
// ===== סרגל הכלים בחלונית =====
let shTab = 'tk'; try { shTab = localStorage.getItem('gemara:shtab') || 'tk'; } catch (e) {}
function cxKeys(n) {
  const e = typeof TREE_CX !== 'undefined' && TREE_CX[st.ref] && TREE_CX[st.ref][n.seq - 1];
  return typeof e === 'string' ? [e] : Array.isArray(e) ? e : [];
}
function ctxBody(n) {
  const e = typeof TREE_CX !== 'undefined' && TREE_CX[st.ref] && TREE_CX[st.ref][n.seq - 1];
  const C = typeof CONTEXT !== 'undefined' ? CONTEXT : {};
  const parts = !e ? [] : typeof e === 'string' ? [C[e]] : Array.isArray(e) ? e.map(k => C[k]) : [e.L];
  return parts.filter(Boolean).map(t => `<p>${t}</p>`).join('');
}
function wbwBlock(w) {
  const D = (typeof TX !== 'undefined' && TX.WDICT) || {};
  return `<div class="wbw">${w.split('|').map(p => {
    const i = p.indexOf('='); const a = (i < 0 ? p : p.slice(0, i)).trim(), h = i < 0 ? '' : p.slice(i + 1).trim();
    const ws = a.split(/\s+/);
    if (ws.length === 1) return `<span class="ww"><b>${a}</b><i>${h}</i></span>`;
    return `<span class="wg"><span class="wg-words">${ws.map(x => `<span class="ww"><b>${x}</b><i>${D[x] || ''}</i></span>`).join('')}</span><span class="wg-mean">${h}</span></span>`;
  }).join('')}</div>`;
}
function toolbar(n, kids) {
  const T = typeof TX !== 'undefined' ? TX : {}, ks = cxKeys(n);
  const tks = ks.map(k => (T.TAKHLES || {})[k]).filter(Boolean);
  const gm = ks.map(k => (T.PUNCT || {})[k]).filter(Boolean);
  const ww = ks.map(k => (T.WBW || {})[k]).filter(Boolean);
  const hay = (n.t + ' ' + gm.join(' ')).replace(/[״"]/g, '');
  const terms = (T.KEY_TERMS || []).filter(([t]) => hay.includes(t));
  const cx = ctxBody(n);
  const panes = [
    ['tk', '🎯 בתכלס', `<div class="sh-exp"><b>🎯 בתכלס:</b> ${n.e}</div>${tks.length && !tks.includes(n.e) ? `<div class="sh-tk2">${tks.join('<br>')}</div>` : ''}
      ${kids.length ? `<div class="sh-kids"><div class="kh">⬇ מה עונים על זה (${kids.length})</div>${kids.map((k, i) =>
        `<button class="kid" data-i="${i}" style="--kc:${COL[k.r]}"><b>${ROLE[k.r][0]} ${relLabel(k) || ROLE[k.r][1]}</b> ${k.w}: ${short(k.t, 34)}</button>`).join('')}</div>` : ''}`],
    ['cx', '🧭 ההקשר', cx ? `<div class="sh-ctxp">${cx}</div>` : ''],
    ['gm', '📜 בגמרא', gm.map(t => `<div class="g-punct">${t.replace(/״([^״]+)״/g, '<q>״$1״</q>')}</div>`).join('')],
    ['wbw', '🔤 מילה במילה', ww.map(wbwBlock).join('')],
    ['tm', '💡 מונחים', terms.length ? `<div class="sh-terms">${terms.map(([t, d]) => `<div><b>${t}</b><span>${d}</span></div>`).join('')}</div>` : ''],
  ];
  let cur = panes.find(p => p[0] === shTab && p[2]) ? shTab : 'tk';
  // הצילום עם המילים המודגשות — תמיד גלוי וצמוד למעלה, מעל הלשוניות (גם במילה במילה)
  const img = `<div class="sh-img"><div class="sh-imgw"><img src="taanit-img/${st.ref}-${n.s}.jpg" alt="לשון הגמרא בדף" onload="shImgFocus()" onerror="this.closest('.sh-img').remove()">${marksHTML(st.ref, n)}</div></div>`;
  return `<div class="sh-pin">${img}<div class="sh-tabs" role="tablist">${panes.map(([id, lb, body]) => `<button class="sh-tab${id === cur ? ' on' : ''}" data-t="${id}"${body ? '' : ' disabled'}>${lb}</button>`).join('')}</div></div>
    ${panes.map(([id, , body]) => `<div class="sh-pane${id === cur ? ' on' : ''}" data-t="${id}">${body || '<div class="sh-none">אין לשלב הזה</div>'}</div>`).join('')}`;
}
// מביא את המילים המודגשות למרכז הצילום הקטן
function shImgFocus() {
  const sim = document.querySelector('#sheet .sh-img'), mks = document.querySelectorAll('#sheet .mk');
  if (!sim || !mks.length) return;
  const top = Math.min(...[...mks].map(m => m.offsetTop)), bot = Math.max(...[...mks].map(m => m.offsetTop + m.offsetHeight));
  sim.scrollTop = Math.max(0, (top + bot) / 2 - sim.clientHeight / 2);
}
// ===== תריס: שלושה גבהים =====
let shState = 'half', shPref = 'half'; try { shPref = localStorage.getItem('gemara:shsize') === 'full' ? 'full' : 'half'; } catch (e) {}
const SZ_LBL = { peek: '⬆ פתח', half: '⬆ הגדל', full: '⬇ הקטן' };
function sheetSize(st2, quiet) {
  const sh = $('sheet'); if (!sh.classList.contains('open')) return;
  shState = st2;
  sh.classList.remove('s-peek', 's-half', 's-full'); sh.classList.add('s-' + st2); sh.style.height = '';
  if (st2 !== 'peek') { shPref = st2; try { localStorage.setItem('gemara:shsize', st2); } catch (e) {} } else sh.scrollTop = 0;
  const b = $('shSz'); if (b) b.textContent = SZ_LBL[st2];
  if (!quiet && st.sel) setTimeout(() => { if (st.sel) centerOn(st.sel); shImgFocus(); }, 330);
}
function sheetPeek(on) { if (on) { if (shState !== 'peek') sheetSize('peek'); } else if (shState === 'peek') sheetSize(shPref); }
function gripInit(sh) {
  const H = () => $('stage').getBoundingClientRect().height;
  let d = null;
  const start = e => {
    if (e.target.closest('button, a')) return;
    d = { y0: e.clientY, h0: sh.offsetHeight, t0: Date.now(), moved: false }; sh.classList.add('dragging'); e.currentTarget.setPointerCapture(e.pointerId);
  };
  const move = e => { if (!d) return; const dy = e.clientY - d.y0; if (Math.abs(dy) > 6) d.moved = true;
    if (d.moved) sh.style.height = Math.max(70, Math.min(H() * 0.95, d.h0 - dy)) + 'px'; };
  const end = e => {
    if (!d) return; const dy = e.clientY - d.y0, v = dy / Math.max(1, Date.now() - d.t0), was = d; d = null; sh.classList.remove('dragging');
    if (!was.moved) { sheetSize(shState === 'peek' ? shPref : shState === 'half' ? 'full' : 'half'); return; }   // הקשה: פס→פתוח, חצי→מלא, מלא→חצי
    const h = sh.offsetHeight, hh = H(), pts = { peek: 82, half: hh * 0.52, full: hh * 0.93 };
    let best = Object.keys(pts).reduce((a, k) => Math.abs(pts[k] - h) < Math.abs(pts[a] - h) ? k : a, 'half');
    if (v > 0.6) best = shState === 'full' ? 'half' : 'peek'; else if (v < -0.6) best = shState === 'peek' ? 'half' : 'full';   // הנפה מהירה
    sheetSize(best);
  };
  [$('shGrip'), sh.querySelector('.sh-head')].forEach(g => { g.style.touchAction = 'none'; g.addEventListener('pointerdown', start); g.addEventListener('pointermove', move); g.addEventListener('pointerup', end); g.addEventListener('pointercancel', end); });
  $('shSz').onclick = e => { e.stopPropagation(); sheetSize(shState === 'full' ? 'half' : shState === 'half' ? 'full' : shPref); };
  $('shSz').textContent = SZ_LBL[shState];
  // משיכה למטה כשהתוכן כבר בראש — מקטינה בשלב אחד
  let ty = null;
  sh.addEventListener('touchstart', e => { ty = sh.scrollTop <= 0 && !e.target.closest('.sh-grip, .sh-head') ? e.touches[0].clientY : null; }, { passive: true });
  sh.addEventListener('touchmove', e => { if (ty != null && e.touches[0].clientY - ty > 80) { sheetSize(shState === 'full' ? 'half' : 'peek'); ty = null; } }, { passive: true });
}
function closeSheet() { st.sel = null; whereSoon(); flat.forEach(m => m.el.classList.remove('sel')); sheet(null); $('stage').classList.remove('has-sheet'); }

// ===== סיפור הסוגיה: מעוף מצומת לצומת, הענף נמתח והניצוץ רץ =====
let story = null;
function revealUpTo(i) {
  flat.forEach((n, j) => {
    const on = j <= i;
    n.el.classList.toggle('pending', !on); n.linkEl.classList.toggle('pending', !on); if (n.lblEl) n.lblEl.classList.toggle('pending', !on);
  });
}
function growLink(n) {
  const p = n.linkEl, len = p.getTotalLength();
  p.style.transition = 'none'; p.style.strokeDasharray = `${len}`; p.style.strokeDashoffset = `${len}`;
  p.getBoundingClientRect();
  p.style.transition = 'stroke-dashoffset .7s ease-out'; p.style.strokeDashoffset = '0';
  setTimeout(() => { p.style.strokeDasharray = ''; p.style.strokeDashoffset = ''; p.style.transition = ''; }, 760);
  const sp = el('circle', { r: 5, class: 'spark' }, $('fx')); const t0 = performance.now();
  const run = now => { const q = Math.min(1, (now - t0) / 700); const pt = p.getPointAtLength(len * q); sp.setAttribute('cx', pt.x); sp.setAttribute('cy', pt.y); if (q < 1) requestAnimationFrame(run); else sp.remove(); };
  requestAnimationFrame(run);
  n.el.animate([{ transform: `translate(${n.x}px, ${n.y}px) scale(.4)`, opacity: 0 }, { transform: `translate(${n.x}px, ${n.y}px) scale(1.08)`, opacity: 1, offset: .7 }, { transform: `translate(${n.x}px, ${n.y}px) scale(1)` }],
    { duration: 520, delay: 380, easing: 'ease-out', fill: 'backwards' });
}
function storyGo(i, auto) {
  i = Math.max(0, Math.min(flat.length - 1, i));
  const n = flat[i];
  revealUpTo(i);
  growLink(n);
  select(n, true);
  if (story && auto) {
    clearTimeout(story.t);
    const wait = 2600 + Math.min(4000, (n.t.length + n.e.length) * 28);
    story.t = setTimeout(() => { if (i + 1 < flat.length) storyGo(i + 1, true); else stopStory(true); }, wait);
  }
}
function startStory() {
  story = { t: null }; $('sPlay').textContent = '❚❚ עצור'; if ($('shPlay')) $('shPlay').textContent = '❚❚ עצור';
  const i = st.sel ? flat.indexOf(st.sel) : -1;
  if (i < 0) { revealUpTo(-1); fit(true); setTimeout(() => story && storyGo(0, true), 800); } else storyGo(i, true);
}
function stopStory(done) {
  if (story) clearTimeout(story.t); story = null; $('sPlay').textContent = done ? '↻ שוב מההתחלה' : '▶ המשך הסיפור'; if ($('shPlay')) $('shPlay').textContent = '▶ סיפור';
  revealUpTo(flat.length);
}
$('sPlay').onclick = () => { if (story) stopStory(); else { if ($('sPlay').textContent.startsWith('↻')) { st.sel = null; } startStory(); } };
$('sNext').onclick = () => { const i = st.sel ? flat.indexOf(st.sel) + 1 : 0; if (story) storyGo(i, true); else { revealUpTo(flat.length); select(flat[Math.min(i, flat.length - 1)], true); } };
$('sPrev').onclick = () => { const i = st.sel ? flat.indexOf(st.sel) - 1 : 0; if (story) storyGo(i, true); else { revealUpTo(flat.length); select(flat[Math.max(0, i)], true); } };

// ===== גרירה, צביטה וגלגלת =====
const ptr = new Map(); let ptr0 = { x: 0, y: 0 }, peeked = false; let moved = false, last = null, pinch0 = null;
const stg = $('stage');
stg.addEventListener('pointerdown', e => {
  if (e.target.closest('.sheet, .story, .hud, .legend')) return;
  ptr.set(e.pointerId, { x: e.clientX, y: e.clientY }); moved = false; cancelAnimationFrame(tw);
  if (ptr.size === 1) { ptr0 = { x: e.clientX, y: e.clientY }; peeked = false; }
  if (ptr.size === 2) { const [a, b] = [...ptr.values()]; pinch0 = { d: Math.hypot(a.x - b.x, a.y - b.y), k: cam.k, cx: (a.x + b.x) / 2, cy: (a.y + b.y) / 2, x: cam.x, y: cam.y }; }
  last = { x: e.clientX, y: e.clientY }; stg.classList.add('drag'); hideHint();
});
stg.addEventListener('pointermove', e => {
  if (!ptr.has(e.pointerId)) return;
  ptr.set(e.pointerId, { x: e.clientX, y: e.clientY });
  const r = stg.getBoundingClientRect();
  if (ptr.size === 2 && pinch0) {
    const [a, b] = [...ptr.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y);
    const k = Math.max(0.15, Math.min(2.5, pinch0.k * d / pinch0.d));
    const cx = pinch0.cx - r.left, cy = pinch0.cy - r.top;
    cam.x = cx - (cx - pinch0.x) * (k / pinch0.k); cam.y = cy - (cy - pinch0.y) * (k / pinch0.k); cam.k = k; moved = true; apply();
    if (!peeked) { peeked = true; sheetPeek(true); } return;
  }
  const dx = e.clientX - last.x, dy = e.clientY - last.y;
  if (Math.abs(dx) + Math.abs(dy) > 3) moved = true;
  if (moved && !peeked && Math.hypot(e.clientX - ptr0.x, e.clientY - ptr0.y) > 24) { peeked = true; sheetPeek(true); }   // גוררים את העץ באמת: התריס יורד
  cam.x += dx; cam.y += dy; last = { x: e.clientX, y: e.clientY }; apply();
});
const up = e => {
  const wasTap = ptr.has(e.pointerId) && ptr.size === 1 && !moved;
  ptr.delete(e.pointerId); if (ptr.size < 2) pinch0 = null;
  if (!ptr.size) { stg.classList.remove('drag'); }
  if (wasTap && e.type === 'pointerup') {
    const hit = document.elementFromPoint(e.clientX, e.clientY);
    const g = hit && hit.closest('.node');
    if (g) { if (g.classList.contains('root')) { closeSheet(); fit(true); } else { const n = flat.find(m => m.el === g); if (n) { if (story) stopStory(); revealUpTo(flat.length); select(n, true); } } }
  }
  if (!ptr.size) setTimeout(() => moved = false, 0);
};
stg.addEventListener('pointerup', up); stg.addEventListener('pointercancel', up);
stg.addEventListener('wheel', e => {
  e.preventDefault(); const r = stg.getBoundingClientRect(); const cx = e.clientX - r.left, cy = e.clientY - r.top;
  const k = Math.max(0.15, Math.min(2.5, cam.k * Math.exp(-e.deltaY * 0.0015)));
  cam.x = cx - (cx - cam.x) * (k / cam.k); cam.y = cy - (cy - cam.y) * (k / cam.k); cam.k = k; apply(); hideHint();
}, { passive: false });
function zoomBy(f) { const { w, h } = stageBox(); const k = Math.max(0.15, Math.min(2.5, cam.k * f)); flyTo(w / 2 - (w / 2 - cam.x) * (k / cam.k), h / 2 - (h / 2 - cam.y) * (k / cam.k), k, 300); }
$('zIn').onclick = () => zoomBy(1.35); $('zOut').onclick = () => zoomBy(1 / 1.35); $('zFit').onclick = () => { closeSheet(); fit(true); };
$('lgBtn').onclick = () => $('legend').classList.toggle('hide');
function hideHint() { const h = $('hint'); if (h) { h.style.opacity = 0; setTimeout(() => h.remove(), 600); } }
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeSheet();
  if (e.key === 'ArrowLeft') $('sNext').click();
  if (e.key === 'ArrowRight') $('sPrev').click();
});

// ===== כוכבים ברקע (קבועים) =====
(function stars() { const g = $('stars'); let s = 7; const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  for (let i = 0; i < 70; i++) el('circle', { cx: (rnd() * 100) + '%', cy: (rnd() * 100) + '%', r: (rnd() * 1.2 + 0.3).toFixed(2), opacity: (rnd() * 0.35 + 0.08).toFixed(2) }, g); })();

// ===== טעינה =====
function save() { try { localStorage.setItem('gemara:tree2', JSON.stringify({ ref: st.ref })); } catch (e) {} }
function load(ref, sec) {
  if (story) stopStory();
  st.ref = ref; st.sel = null;
  $('tabs').innerHTML = Object.keys(TREE).map(r => `<button class="tab${r === ref ? ' on' : ''}" data-r="${r}">${TREE[r].title}</button>`).join('');
  $('backLink').href = BASE + 'taanit.html#' + ref;
  build(ref); draw(); sheet(null); revealUpTo(flat.length);
  $('sPlay').textContent = '▶ סיפור הסוגיה'; $('sProg').textContent = `0/${flat.length}`;
  fit(false);
  if (sec != null) { const n = flat.find(m => m.s === sec); if (n) setTimeout(() => select(n, true), 500); }
  else setTimeout(() => { if (!st.sel && !story) { const { w } = stageBox(); flyTo(w / 2 - root.x * 0.85, 120 - (root.y - 60) * 0.85, 0.85, 1100); } }, 900);
  save();
}
$('tabs').addEventListener('click', e => { const b = e.target.closest('.tab'); if (b) load(b.dataset.r); });
window.addEventListener('resize', () => { if (st.sel) centerOn(st.sel); else fit(false); });
window.addEventListener('hashchange', () => { const m = location.hash.slice(1).match(/^(\d+[ab])(?:-(\d+))?$/); if (m && TREE[m[1]]) load(m[1], m[2] != null ? +m[2] : null); });
load(st.ref, st.sec);
setTimeout(hideHint, 4500);
</script>
