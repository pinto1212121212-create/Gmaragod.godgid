<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>תענית — אנימציה לכל המסכת</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;700;900&family=Heebo:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1410;
    --ink-2: #221a14;
    --parchment: #f4ead5;
    --parchment-soft: #e8dcc0;
    --parchment-dim: #b8a888;
    --gold: #e8b76d;
    --gold-bright: #f5d39a;
    --gold-deep: #8a6638;
    --gold-shadow: #5a4220;
    --crimson: #c14a5a;
    --crimson-glow: #e87080;
    --sage: #88b27a;
    --sage-glow: #a5cc97;
    --sky: #7fb3d5;
    --sky-glow: #a5cce0;
    --warm: #e89a6d;
    --flame: #ff9844;
    --rashi: #c89568;
    --tosafot: #8fa9c4;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    background: var(--ink);
    color: var(--parchment);
    font-family: 'Heebo', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  body {
    background:
      radial-gradient(ellipse at 50% 0%, rgba(232,183,109,0.1) 0%, transparent 60%),
      linear-gradient(180deg, #1a1410 0%, #221a14 60%, #1a1410 100%);
    min-height: 100vh;
  }

  .app {
    max-width: 720px;
    margin: 0 auto;
    padding: 12px 16px 110px;
  }

  /* ===== Header with navigator ===== */
  header {
    text-align: center;
    padding: 8px 0 14px;
    border-bottom: 1px solid rgba(232,183,109,0.18);
    margin-bottom: 16px;
  }

  .masechet-name {
    font-size: 13px;
    color: var(--gold);
    letter-spacing: 0.2em;
    font-weight: 700;
  }

  .daf-nav {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 10px;
    align-items: center;
    margin-top: 10px;
  }

  .nav-arrow {
    background: rgba(232,183,109,0.15);
    border: 1px solid var(--gold);
    color: var(--gold-bright);
    width: 38px;
    height: 38px;
    border-radius: 50%;
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s, transform 0.15s;
  }
  .nav-arrow:active { transform: scale(0.92); }
  .nav-arrow:disabled { opacity: 0.3; }

  .daf-display {
    text-align: center;
    cursor: pointer;
  }
  .daf-display:active { opacity: 0.7; }

  .daf-display h1 {
    font-family: 'Frank Ruhl Libre', serif;
    font-weight: 900;
    font-size: clamp(18px, 5vw, 22px);
    color: var(--parchment);
  }

  .daf-display .perek-name {
    font-size: 11px;
    color: var(--parchment-dim);
    margin-top: 2px;
  }

  /* ===== Action bar (Translation/Rashi/Tosafot) ===== */
  .action-bar {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    margin-bottom: 16px;
  }

  .action-btn {
    padding: 12px 8px;
    border-radius: 10px;
    border: 1.5px solid;
    background: rgba(20,16,10,0.5);
    color: var(--parchment);
    font-family: 'Heebo', sans-serif;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    transition: background 0.2s, transform 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .action-btn:active { transform: scale(0.97); }

  .action-btn.trans {
    border-color: var(--gold);
    color: var(--gold-bright);
  }
  .action-btn.trans:hover { background: rgba(232,183,109,0.15); }

  .action-btn.rashi {
    border-color: var(--rashi);
    color: var(--rashi);
  }
  .action-btn.rashi:hover { background: rgba(200,149,104,0.15); }

  .action-btn.tos {
    border-color: var(--tosafot);
    color: var(--tosafot);
  }
  .action-btn.tos:hover { background: rgba(143,169,196,0.15); }

  .action-btn .count {
    background: rgba(0,0,0,0.3);
    padding: 2px 7px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 700;
  }

  .action-btn.disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  /* ===== Translation modal styling ===== */
  .modal.trans { border-top-color: var(--gold); }
  .modal.trans .modal-title { color: var(--gold-bright); }

  .trans-section-header {
    font-weight: 700;
    font-size: 15px;
    color: var(--gold);
    margin: 18px 0 10px;
    padding: 8px 12px;
    background: rgba(232,183,109,0.1);
    border-radius: 6px;
    text-align: center;
    letter-spacing: 0.02em;
  }

  .trans-section-header:first-child { margin-top: 0; }

  .trans-entry {
    margin-bottom: 12px;
    background: rgba(20,16,10,0.6);
    border-radius: 10px;
    padding: 12px 14px;
    border-right: 2px solid var(--gold-deep);
  }

  .trans-aram {
    font-family: 'Frank Ruhl Libre', serif;
    font-size: 17px;
    line-height: 1.85;
    color: var(--gold-bright);
    margin-bottom: 10px;
    padding-bottom: 10px;
    border-bottom: 1px dashed rgba(232,183,109,0.3);
  }

  .trans-heb {
    font-size: 14.5px;
    line-height: 1.75;
    color: var(--parchment-soft);
  }
  .trans-heb strong { color: var(--gold-bright); }

  .trans-summary {
    font-style: italic;
    font-size: 14px;
    color: var(--parchment-dim);
    padding: 10px 14px;
    background: rgba(232,183,109,0.04);
    border-radius: 8px;
    margin-bottom: 12px;
    border-right: 2px dashed var(--gold-deep);
    line-height: 1.65;
  }

  .trans-note {
    margin-top: 16px;
    padding: 10px 14px;
    background: rgba(127,179,213,0.06);
    border: 1px dashed var(--sky);
    border-radius: 8px;
    font-size: 12.5px;
    color: var(--parchment-dim);
    line-height: 1.6;
  }
  .trans-note strong { color: var(--sky-glow); }

  /* ===== Stage ===== */
  .stage { position: relative; min-height: 60vh; }
  .scene { display: none; }
  .scene.active {
    display: block;
    animation: gentleFade 0.3s ease-out both;
  }
  @keyframes gentleFade { from { opacity: 0; } to { opacity: 1; } }

  .scene-tag {
    display: inline-block;
    background: var(--gold-deep);
    color: var(--parchment);
    font-size: 12px;
    font-weight: 700;
    padding: 4px 12px;
    border-radius: 12px;
    margin-bottom: 12px;
  }
  .scene-tag.q { background: var(--crimson); }
  .scene-tag.a { background: var(--sage); color: var(--ink); }
  .scene-tag.surprise { background: var(--flame); color: var(--ink); }

  .scene-title {
    font-family: 'Heebo', sans-serif;
    font-weight: 900;
    font-size: clamp(20px, 5.4vw, 26px);
    color: var(--gold-bright);
    margin-bottom: 12px;
    line-height: 1.25;
  }
  .scene-title .accent { color: var(--parchment); }
  .scene-title .flame-c { color: var(--flame); }
  .scene-title .water-c { color: var(--sky-glow); }

  .story {
    font-size: 16px;
    line-height: 1.8;
    color: var(--parchment-soft);
    margin-bottom: 12px;
  }
  .story p { margin-bottom: 11px; }
  .story strong { color: var(--gold-bright); font-weight: 700; }
  .story em { color: var(--parchment); background: rgba(232,183,109,0.1); padding: 0 4px; border-radius: 3px; font-style: normal; }

  .pic {
    margin: 14px 0;
    padding: 14px 10px;
    background: radial-gradient(ellipse at center, rgba(232,183,109,0.08), transparent 75%);
    border-radius: 12px;
    text-align: center;
  }
  .pic svg { max-width: 100%; height: auto; }
  .pic-caption {
    font-size: 12px;
    color: var(--gold);
    margin-top: 6px;
    font-weight: 500;
  }

  .bubble {
    background: rgba(232,183,109,0.1);
    border: 2px solid var(--gold);
    border-radius: 14px;
    padding: 12px 14px;
    margin: 12px 0;
    font-size: 15px;
    line-height: 1.7;
    color: var(--parchment);
  }
  .bubble.question { border-color: var(--crimson); background: rgba(193,74,90,0.08); }
  .bubble.answer { border-color: var(--sage); background: rgba(136,178,122,0.08); }
  .bubble.surprise { border-color: var(--flame); background: rgba(255,152,68,0.1); }

  .bubble-label {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 10px;
    margin-bottom: 6px;
    background: var(--gold);
    color: var(--ink);
  }
  .bubble.question .bubble-label { background: var(--crimson); color: var(--parchment); }
  .bubble.answer .bubble-label { background: var(--sage); color: var(--ink); }
  .bubble.surprise .bubble-label { background: var(--flame); color: var(--ink); }

  .keyidea {
    background: linear-gradient(135deg, rgba(232,183,109,0.12), rgba(232,183,109,0.04));
    border: 2px dashed var(--gold);
    border-radius: 12px;
    padding: 12px 14px;
    margin: 12px 0;
    text-align: center;
  }
  .keyidea-label {
    font-size: 12px;
    color: var(--gold-bright);
    font-weight: 700;
    letter-spacing: 0.1em;
    margin-bottom: 6px;
  }
  .keyidea p { font-size: 15px; line-height: 1.6; color: var(--parchment); }
  .keyidea strong { color: var(--gold-bright); }

  /* List items */
  .m-item {
    display: grid;
    grid-template-columns: 28px 32px 1fr;
    gap: 10px;
    align-items: center;
    padding: 10px 12px;
    background: rgba(20,16,10,0.4);
    border-right: 2px solid var(--gold);
    border-radius: 4px;
    margin-bottom: 6px;
  }
  .m-item .m-num { font-size: 13px; color: var(--gold); text-align: center; font-weight: 700; }
  .m-item svg { width: 28px; height: 28px; color: var(--gold); }
  .m-name { font-weight: 700; font-size: 15px; color: var(--parchment); }
  .m-note { font-size: 11.5px; color: var(--parchment-dim); margin-top: 2px; }

  .vs-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin: 12px 0;
  }
  .vs-card { padding: 10px; border-radius: 10px; text-align: center; }
  .vs-card.a { background: rgba(232,183,109,0.1); border: 1.5px solid var(--gold); }
  .vs-card.b { background: rgba(127,179,213,0.1); border: 1.5px solid var(--sky); }
  .vs-card .emoji { font-size: 26px; margin-bottom: 4px; }
  .vs-card h5 { font-size: 14px; font-weight: 700; margin-bottom: 3px; }
  .vs-card.a h5 { color: var(--gold-bright); }
  .vs-card.b h5 { color: var(--sky-glow); }
  .vs-card p { font-size: 12.5px; color: var(--parchment-soft); line-height: 1.5; }

  .sage-quote {
    background: rgba(20,16,10,0.5);
    border-left: 3px solid var(--gold-bright);
    border-radius: 4px;
    padding: 10px 12px;
    margin: 10px 0;
  }
  .sage-quote .sage-name { font-weight: 700; color: var(--gold-bright); font-size: 13px; margin-bottom: 4px; }
  .sage-quote p { font-size: 14px; line-height: 1.6; color: var(--parchment); }

  /* ===== Empty state for stubs ===== */
  .stub {
    text-align: center;
    padding: 50px 20px;
  }
  .stub-icon { font-size: 56px; margin-bottom: 14px; opacity: 0.5; }
  .stub h3 {
    font-family: 'Heebo', sans-serif;
    font-weight: 700;
    font-size: 22px;
    color: var(--gold-bright);
    margin-bottom: 8px;
  }
  .stub p {
    color: var(--parchment-dim);
    font-size: 15px;
    line-height: 1.6;
    max-width: 360px;
    margin: 0 auto 20px;
  }
  .stub .stub-perek {
    background: rgba(232,183,109,0.08);
    border: 1px solid rgba(232,183,109,0.25);
    padding: 12px 16px;
    border-radius: 8px;
    display: inline-block;
    margin-top: 10px;
  }
  .stub .stub-perek-label {
    font-size: 11px;
    color: var(--gold);
    letter-spacing: 0.2em;
    margin-bottom: 4px;
  }
  .stub .stub-perek-name {
    font-size: 16px;
    color: var(--parchment);
    font-weight: 700;
  }

  /* ===== Modal ===== */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 50;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
  }
  .modal-overlay.open {
    opacity: 1;
    pointer-events: auto;
  }

  .modal {
    position: fixed;
    bottom: 0;
    right: 0;
    left: 0;
    max-height: 90vh;
    background: var(--ink-2);
    border-top: 2px solid;
    border-radius: 18px 18px 0 0;
    z-index: 51;
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.2, 0.7, 0.2, 1);
    display: flex;
    flex-direction: column;
  }
  .modal.open { transform: translateY(0); }
  .modal.rashi { border-top-color: var(--rashi); }
  .modal.tos { border-top-color: var(--tosafot); }

  .modal-handle {
    width: 40px;
    height: 4px;
    background: rgba(232,183,109,0.4);
    border-radius: 2px;
    margin: 10px auto 0;
  }

  .modal-header {
    padding: 12px 18px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid rgba(232,183,109,0.15);
  }
  .modal-title {
    font-family: 'Heebo', sans-serif;
    font-weight: 900;
    font-size: 20px;
  }
  .modal.rashi .modal-title { color: var(--rashi); }
  .modal.tos .modal-title { color: var(--tosafot); }

  .modal-close {
    background: rgba(232,183,109,0.15);
    border: none;
    color: var(--parchment);
    width: 32px;
    height: 32px;
    border-radius: 50%;
    font-size: 16px;
    cursor: pointer;
  }
  .modal-close:active { transform: scale(0.92); }

  .modal-content {
    overflow-y: auto;
    padding: 16px 18px 24px;
    flex: 1;
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
  }

  .meforesh-entry {
    padding: 12px 14px;
    background: rgba(20,16,10,0.5);
    border-radius: 10px;
    margin-bottom: 10px;
  }
  .modal.rashi .meforesh-entry { border-right: 3px solid var(--rashi); }
  .modal.tos .meforesh-entry { border-right: 3px solid var(--tosafot); }

  .meforesh-dh {
    display: inline-block;
    font-weight: 700;
    font-size: 14px;
    padding: 3px 10px;
    border-radius: 6px;
    margin-bottom: 8px;
  }
  .modal.rashi .meforesh-dh { background: var(--rashi); color: var(--ink); }
  .modal.tos .meforesh-dh { background: var(--tosafot); color: var(--ink); }

  .meforesh-content {
    font-size: 14.5px;
    line-height: 1.7;
    color: var(--parchment-soft);
  }
  .meforesh-content p { margin-bottom: 10px; }
  .meforesh-content p:last-child { margin-bottom: 0; }
  .meforesh-content strong { color: var(--gold-bright); }
  .meforesh-content em { color: var(--parchment); background: rgba(232,183,109,0.08); padding: 0 3px; border-radius: 2px; font-style: normal; }

  /* ===== Kushya animated diagrams (תוספות) ===== */
  .kviz {
    margin: 2px 0 16px;
    padding: 11px 10px 9px;
    background: linear-gradient(180deg, rgba(143,169,196,0.12), rgba(20,16,10,0.45));
    border: 1px solid rgba(143,169,196,0.4);
    border-radius: 12px;
    overflow: hidden;
  }
  .kviz-head {
    font-size: 12px; font-weight: 700; color: var(--tosafot);
    margin-bottom: 8px; display: flex; align-items: center; gap: 5px;
  }
  .kviz-stage {
    position: relative; display: flex; align-items: center; justify-content: center;
    gap: 9px; flex-wrap: wrap; min-height: 86px; padding: 8px 2px 2px;
  }
  .kviz-cap {
    font-size: 12px; color: var(--gold); text-align: center;
    margin-top: 9px; font-weight: 500; line-height: 1.55;
  }
  .kviz-cap strong { color: var(--gold-bright); }
  .knode {
    position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px;
    background: rgba(244,234,213,0.06); border: 1.5px solid var(--parchment-dim);
    border-radius: 10px; padding: 7px 9px; min-width: 54px;
    font-size: 11px; font-weight: 600; color: var(--parchment-soft); text-align: center; line-height: 1.3;
  }
  .knode .kemoji { font-size: 22px; line-height: 1; }
  .knode.good { border-color: var(--sage); color: var(--sage-glow); background: rgba(136,178,122,0.13); }
  .knode.bad  { border-color: var(--crimson); color: var(--crimson-glow); background: rgba(193,74,90,0.13); }
  .knode.gold { border-color: var(--gold); color: var(--gold-bright); background: rgba(232,183,109,0.13); }
  .karrow { color: var(--gold); font-size: 22px; font-weight: 700; }
  .kverdict {
    position: absolute; top: -9px; left: -9px; width: 22px; height: 22px;
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 800; opacity: 0; z-index: 3;
  }
  .kverdict.good { background: var(--sage); color: var(--ink); }
  .kverdict.bad  { background: var(--crimson); color: #fff; }
  .ktag { font-size: 10px; font-weight: 800; padding: 2px 7px; border-radius: 20px; }
  .ktag.red   { background: var(--crimson); color: #fff; }
  .ktag.green { background: var(--sage); color: var(--ink); }
  .kstamp {
    position: absolute; top: -13px; left: 50%; background: var(--crimson); color: #fff;
    font-size: 10px; font-weight: 800; padding: 3px 8px; border-radius: 6px;
    box-shadow: 0 2px 6px rgba(0,0,0,.45); white-space: nowrap; z-index: 3;
  }
  .kbar {
    position: relative; width: 86%; height: 34px; border: 1.5px solid var(--gold);
    border-radius: 8px; overflow: hidden; background: rgba(244,234,213,0.05);
  }
  .kbar-fill {
    position: absolute; top: 0; right: 0; height: 100%; width: 0;
    background: linear-gradient(270deg, var(--crimson), var(--crimson-glow)); opacity: .55;
  }
  .kbar-lbl { position: absolute; top: 50%; transform: translateY(-50%); font-size: 11px; font-weight: 700; color: var(--parchment); z-index: 2; }
  .kchip { font-size: 11px; font-weight: 700; padding: 4px 9px; border-radius: 8px; }
  .kchip.ok { background: rgba(136,178,122,0.18); color: var(--sage-glow); border: 1px solid var(--sage); animation: kFade 3.5s ease-in-out infinite; }
  .kchip.no { background: rgba(193,74,90,0.18); color: var(--crimson-glow); border: 1px solid var(--crimson); }
  .kdots { display: inline-flex; gap: 4px; }
  .kd { width: 11px; height: 11px; border-radius: 50%; border: 1.5px solid var(--parchment-dim); background: transparent; display: inline-block; }
  .kd.on { background: var(--crimson); border-color: var(--crimson); }
  .trans-entry .kviz { margin: 12px 0 2px; }
  .trans-summary .kviz { margin: 12px 0 0; }

  @keyframes kFade   { 0%,15%{opacity:0} 35%,100%{opacity:1} }
  @keyframes kPulse  { 0%,100%{transform:scale(1)} 50%{transform:scale(1.13)} }
  @keyframes kFloatUp{ 0%,30%{transform:translateY(0);opacity:1} 75%{transform:translateY(-34px);opacity:0} 100%{opacity:0} }
  @keyframes kShake  { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-4px)} 50%{transform:translateX(4px)} 75%{transform:translateX(-3px)} }
  @keyframes kBleed  { 0%,18%{width:0} 68%,100%{width:100%} }
  @keyframes kAppear { 0%,50%{opacity:0;transform:scale(.4)} 66%{opacity:1;transform:scale(1.25)} 80%,100%{opacity:1;transform:scale(1)} }
  @keyframes kFlash  { 0%,100%{opacity:.25} 50%{opacity:1} }
  @keyframes kStampC { 0%,40%{transform:translateX(-50%) translateY(-22px) scale(1.5);opacity:0} 56%{transform:translateX(-50%) translateY(0) scale(1);opacity:1} 70%{transform:translateX(-50%) scale(1.12)} 85%,100%{transform:translateX(-50%) scale(1);opacity:1} }

  .modal-empty {
    text-align: center;
    padding: 30px 20px;
    color: var(--parchment-dim);
  }
  .modal-empty .e-icon { font-size: 36px; margin-bottom: 10px; opacity: 0.5; }

  /* ===== Daf picker modal ===== */
  .picker-modal {
    position: fixed;
    inset: 0;
    background: var(--ink-2);
    z-index: 60;
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.2, 0.7, 0.2, 1);
    display: flex;
    flex-direction: column;
  }
  .picker-modal.open { transform: translateY(0); }

  .picker-header {
    padding: 14px 18px;
    border-bottom: 1px solid rgba(232,183,109,0.15);

    align-items: center;
    justify-content: space-between;
  }

  .picker-title {
    font-weight: 700;
    font-size: 17px;

  }

  .picker-content {

    flex: 1;
  }

  .perek-section {
    margin-bottom: 16px;
  }

  .perek-header {
    font-weight: 700;
    font-size: 14px;
    color: var(--gold);
    margin-bottom: 8px;
    padding: 0 4px;

  .daf-grid {
    display: grid;

    gap: 6px;
  }

  .daf-btn {

  .daf-btn.has-content::after {

    color: var(--sage-glow);

  /* ===== Bottom navigation ===== */
  .nav {
    position: fixed;
    bottom: 0;
    right: 0;
    left: 0;
    background: linear-gradient(180deg, transparent, var(--ink) 40%);

  }

  .nav-inner {
    max-width: 720px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 12px;
    align-items: center;
  }

  .nav-btn {
    background: var(--gold);
    color: var(--ink);

    width: 46px;
    height: 46px;
    border-radius: 50%;

    cursor: pointer;

    align-items: center;
    justify-content: center;

  .progress {
    display: flex;
    gap: 5px;
    justify-content: center;
    align-items: center;

  }
  .dot {
    width: 7px;
    height: 7px;

  .scene-counter {
    text-align: center;
    font-size: 11px;
    color: var(--parchment-dim);
    margin-top: 10px;
  }

  /* ===== Tabs ===== */
  .tabs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin-top: 12px;
    padding: 4px;
    background: rgba(20,16,10,0.5);
    border-radius: 12px;
    border: 1px solid rgba(232,183,109,0.18);
  }

  .tab {
    padding: 10px 8px;
    background: transparent;
    border: none;
    color: var(--parchment-dim);
    font-family: 'Heebo', sans-serif;
    font-weight: 700;
    font-size: 14px;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.25s, color 0.25s;
  }
  .tab:active { transform: scale(0.97); }
  .tab.active {
    background: var(--gold-deep);

  }

  /* Hide masechet-only sections when in tutorial mode */
  body.tutorial-mode .masechet-only { display: none; }

  /* ===== Tutorial: terms (clickable Aramaic) ===== */
  .term {
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 5px;
    transition: background 0.2s;
    border-bottom: 2px dotted;
    display: inline-block;
  }
  .term.statement { background: rgba(232,183,109,0.15); border-color: var(--gold); color: var(--gold-bright); }
  .term.question { background: rgba(193,74,90,0.15); border-color: var(--crimson); color: var(--crimson-glow); }
  .term.answer { background: rgba(136,178,122,0.15); border-color: var(--sage); color: var(--sage-glow); }
  .term.source { background: rgba(127,179,213,0.15); border-color: var(--sky); color: var(--sky-glow); }
  .term.distinction { background: rgba(176,143,196,0.15); border-color: #b08fc4; color: #b08fc4; }
  .term.conclusion { background: rgba(232,154,109,0.15); border-color: var(--warm); color: var(--warm); }
  .term:active { transform: scale(0.95); }

  /* ===== Tutorial: gemara text block ===== */
  .gem-block {
    background: rgba(244,234,213,0.04);

  }

  /* ===== Tutorial: step-by-step ===== */
  .step {
    display: grid;
    grid-template-columns: 32px 1fr;
    gap: 12px;
    margin-bottom: 10px;
    padding: 12px 14px;

  .step-num {
    font-weight: 700;
    color: var(--gold);
    font-size: 16px;
    text-align: center;
    padding-top: 2px;
  }
  .step-aram {
    font-family: 'Frank Ruhl Libre', serif;
    font-size: 17px;
    color: var(--gold-bright);
    font-weight: 700;
    margin-bottom: 4px;
  }
  .step-trans {
    font-size: 13px;
    color: var(--parchment-soft);
    margin-bottom: 6px;
  }
  .step-fn {
    display: inline-block;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 4px;
    margin-bottom: 6px;
    font-weight: 700;
  }
  .step-fn.statement { background: rgba(232,183,109,0.2); color: var(--gold-bright); }
  .step-fn.question { background: rgba(193,74,90,0.2); color: var(--crimson-glow); }
  .step-fn.answer { background: rgba(136,178,122,0.2); color: var(--sage-glow); }
  .step-fn.source { background: rgba(127,179,213,0.2); color: var(--sky-glow); }
  .step-fn.distinction { background: rgba(176,143,196,0.2); color: #b08fc4; }
  .step-fn.conclusion { background: rgba(232,154,109,0.2); color: var(--warm); }
  .step-expl {
    font-size: 14px;
    color: var(--parchment-soft);
    line-height: 1.6;
    margin-top: 4px;
  }
  .step-expl strong { color: var(--gold-bright); }
  .step-expl em { color: var(--parchment); font-style: normal; }

  /* ===== Tutorial: vocab cards ===== */
  .vocab-card {
    background: rgba(20,16,10,0.4);
    border: 1px solid rgba(232,183,109,0.2);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 10px;
  }
  .vocab-aram {
    font-family: 'Frank Ruhl Libre', serif;
    font-size: 20px;
    font-weight: 700;
    color: var(--gold-bright);
    margin-bottom: 4px;
  }
  .vocab-pron {
    font-size: 11px;
    color: var(--parchment-dim);
    font-style: italic;
    margin-bottom: 6px;
  }
  .vocab-mean {
    font-size: 14.5px;
    color: var(--parchment);
    margin-bottom: 6px;
  }
  .vocab-fn {
    font-size: 12px;
    color: var(--gold);
    font-weight: 700;
  }
  .vocab-example {
    margin-top: 8px;
    padding: 8px 10px;
    background: rgba(244,234,213,0.04);
    border-right: 2px solid var(--gold);
    border-radius: 4px;
    font-size: 13px;
    line-height: 1.6;
  }
  .vocab-example em {
    font-family: 'Frank Ruhl Libre', serif;
    color: var(--gold-bright);
    font-weight: 700;
    font-style: normal;
  }

  /* ===== Tutorial: patterns ===== */
  .pattern {
    background: rgba(232,183,109,0.05);
    border-radius: 10px;
    padding: 12px;
    margin: 12px 0;
  }
  .pattern-title {
    font-weight: 700;
    font-size: 14px;
    color: var(--gold-bright);
    margin-bottom: 8px;
  }
  .pattern-flow {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .pattern-step {
    display: grid;
    grid-template-columns: 32px 1fr;
    gap: 10px;
    align-items: center;
    padding: 7px 10px;
    border-radius: 6px;
  }
  .pattern-step.q { background: rgba(193,74,90,0.1); border-right: 2px solid var(--crimson); }
  .pattern-step.a { background: rgba(136,178,122,0.1); border-right: 2px solid var(--sage); }
  .pattern-step.s { background: rgba(127,179,213,0.1); border-right: 2px solid var(--sky); }
  .pattern-step.d { background: rgba(176,143,196,0.1); border-right: 2px solid #b08fc4; }
  .pattern-step .p-icon { font-size: 16px; text-align: center; }
  .pattern-step .p-label {
    font-size: 12.5px;
    font-weight: 700;
    color: var(--parchment);
  }
  .pattern-step .p-label small {
    display: block;
    font-weight: 400;
    font-size: 11px;
    color: var(--parchment-dim);
    margin-top: 2px;
  }
  .pattern-arrow {
    text-align: center;
    color: var(--gold);
    font-size: 11px;
  }

  /* ===== Tutorial: tip box ===== */
  .tip {
    background: linear-gradient(135deg, rgba(232,183,109,0.12), rgba(232,183,109,0.04));
    border: 1px dashed var(--gold);
    border-radius: 10px;
    padding: 12px 14px;
    margin: 12px 0;
  }
  .tip-label {
    font-size: 12px;
    color: var(--gold-bright);
    font-weight: 700;
    letter-spacing: 0.1em;
    margin-bottom: 6px;
  }
  .tip p {
    font-size: 14.5px;
    line-height: 1.65;
    color: var(--parchment-soft);
  }

  /* ===== Tutorial: legend ===== */
  .legend {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin: 10px 0;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    padding: 7px 9px;
    border-radius: 6px;
  }
  .legend-item .l-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .legend-item.statement { background: rgba(232,183,109,0.08); }
  .legend-item.statement .l-dot { background: var(--gold); }
  .legend-item.question { background: rgba(193,74,90,0.08); }
  .legend-item.question .l-dot { background: var(--crimson); }
  .legend-item.answer { background: rgba(136,178,122,0.08); }
  .legend-item.answer .l-dot { background: var(--sage); }
  .legend-item.source { background: rgba(127,179,213,0.08); }
  .legend-item.source .l-dot { background: var(--sky); }
  .legend-item.distinction { background: rgba(176,143,196,0.08); }
  .legend-item.distinction .l-dot { background: #b08fc4; }
  .legend-item.conclusion { background: rgba(232,154,109,0.08); }
  .legend-item.conclusion .l-dot { background: var(--warm); }

  /* ===== Term modal ===== */
  .modal.term { border-top-color: var(--gold); }
  .modal.term .modal-title { color: var(--gold-bright); }

  .modal-aram-big {
    font-family: 'Frank Ruhl Libre', serif;
    font-size: 28px;
    font-weight: 700;
    color: var(--gold-bright);
    margin-bottom: 6px;
  }
  .modal-pron {
    font-size: 11px;
    color: var(--parchment-dim);
    font-style: italic;
    margin-bottom: 10px;
  }
  .modal-fn-badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 700;
    margin-bottom: 10px;
  }
  .modal-mean-text {
    font-size: 15px;
    color: var(--parchment);
    margin-bottom: 12px;
    line-height: 1.6;
  }
  .modal-use {
    font-size: 14px;
    line-height: 1.7;
    color: var(--parchment-soft);
  }
  .modal-use strong { color: var(--gold-bright); }
  .modal-use em { color: var(--parchment); font-style: normal; }

  /* ===== Kid-friendly explanation boxes ===== */
  .kid-box {
    margin: 14px 0;
    padding: 14px 16px;
    border-radius: 14px;
    border-right: 4px solid;
  }
  .kid-box.setup { background: rgba(232,183,109,0.1); border-color: var(--gold); }
  .kid-box.question { background: rgba(193,74,90,0.1); border-color: var(--crimson); }
  .kid-box.answer { background: rgba(136,178,122,0.1); border-color: var(--sage); }
  .kid-box.bigidea { background: rgba(127,179,213,0.1); border-color: var(--sky); }
  .kid-box.surprise { background: rgba(255,152,68,0.1); border-color: var(--flame); }

  .kid-box .kid-icon {
    font-size: 36px;
    line-height: 1;
    margin-bottom: 6px;
  }
  .kid-box .kid-label {
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 10px;
    letter-spacing: 0.05em;
  }
  .kid-box.setup .kid-label { color: var(--gold-bright); }
  .kid-box.question .kid-label { color: var(--crimson-glow); }
  .kid-box.answer .kid-label { color: var(--sage-glow); }
  .kid-box.bigidea .kid-label { color: var(--sky-glow); }
  .kid-box.surprise .kid-label { color: var(--flame); }

  .kid-box p {
    font-size: 16px;
    line-height: 1.8;
    color: var(--parchment);
    margin-bottom: 10px;
  }
  .kid-box p:last-child { margin-bottom: 0; }
  .kid-box strong { color: var(--gold-bright); }
  .kid-box em { color: var(--parchment-soft); font-style: italic; }

  @keyframes flicker { 0%, 100% { opacity: 0.7; } 50% { opacity: 1; } }
  .flame-anim { animation: flicker 2s ease-in-out infinite; }

  @media (max-width: 380px) {
    .vs-grid { grid-template-columns: 1fr; }
    .action-btn { font-size: 13px; padding: 10px 8px; }
  }

  /* ===== Taanit additions: animated drawings ===== */
  .t-grow { transform-box: fill-box; transform-origin: 50% 100%; animation: tGrow 5s ease-in-out infinite; }
  @keyframes tGrow { 0%,12% { transform: scaleY(0.05); } 62%,100% { transform: scaleY(1); } }
  .t-barR { transform-box: fill-box; transform-origin: 100% 50%; animation: tBar 5s ease-out infinite; }
  .t-barR.d2 { animation-delay: .6s; }
  @keyframes tBar { 0%,10% { transform: scaleX(0); } 55%,100% { transform: scaleX(1); } }
  .t-rain line { animation: tRain 1.3s linear infinite; }
  .t-rain line:nth-child(2n) { animation-delay: .45s; }
  .t-rain line:nth-child(3n) { animation-delay: .9s; }
  @keyframes tRain { 0% { transform: translateY(-8px); opacity: 0; } 25% { opacity: 1; } 100% { transform: translateY(26px); opacity: 0; } }
  .t-walk { animation: tWalk 7s linear infinite; }
  @keyframes tWalk { 0% { transform: translateX(0); } 48% { transform: translateX(-150px); } 50% { transform: translateX(-150px) scaleX(-1); } 100% { transform: translateX(0) scaleX(-1); } }
  .t-bob { transform-box: fill-box; transform-origin: center; animation: tBob 1.1s ease-in-out infinite; }
  @keyframes tBob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2.5px); } }
  .t-tear { animation: tTear 1.6s ease-in infinite; }
  @keyframes tTear { 0%,20% { transform: translateY(0); opacity: 0; } 35% { opacity: 1; } 100% { transform: translateY(14px); opacity: 0; } }
  .t-glow { animation: tGlow 3s ease-in-out infinite; }
  @keyframes tGlow { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
  .t-pop { transform-box: fill-box; transform-origin: center; opacity: 0; animation: tPop 6s ease-in-out infinite; }
  @keyframes tPop { 0%,8% { opacity: 0; transform: scale(.3); } 16% { opacity: 1; transform: scale(1.15); } 22%,88% { opacity: 1; transform: scale(1); } 100% { opacity: 0; } }
  .t-ant { animation: tAnt 4s linear infinite; }
  @keyframes tAnt { 0% { transform: translateX(0); } 100% { transform: translateX(-60px); } }
  .t-sway { transform-box: fill-box; transform-origin: 50% 100%; animation: tSway 3s ease-in-out infinite; }
  @keyframes tSway { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }

  /* prayer-slot grid (Rav / Shmuel) */
  .slots { display: grid; grid-template-columns: 64px repeat(5, 1fr); gap: 4px; font-size: 11px; margin: 12px 0; }
  .slots .h { color: var(--parchment-dim); text-align: center; font-weight: 700; line-height: 1.3; }
  .slots .day { color: var(--gold); text-align: center; font-weight: 800; font-size: 10.5px; }
  .slots .who { color: var(--gold-bright); font-weight: 800; display: flex; align-items: center; font-size: 12px; }
  .slots .c { height: 30px; border-radius: 7px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px; opacity: 0; animation: kFade 4.5s ease-in-out infinite; }
  .slots .c.on { background: rgba(127,179,213,0.22); border: 1px solid var(--sky); color: var(--sky-glow); }
  .slots .c.off { background: rgba(193,74,90,0.12); border: 1px dashed var(--crimson); color: var(--crimson-glow); }

  /* step chain */
  .chain { margin: 12px 0; }
  .chain-step { position: relative; padding: 10px 12px; border-radius: 10px; margin-bottom: 18px; font-size: 14px; line-height: 1.65; background: rgba(20,16,10,0.55); border-right: 3px solid var(--gold-deep); opacity: 0; animation: kFade 1s ease-out forwards; }
  .chain-step::after { content: "⬇"; position: absolute; bottom: -17px; left: 50%; transform: translateX(-50%); color: var(--gold-deep); font-size: 12px; }
  .chain-step:last-child::after { content: none; }
  .chain-step.q { border-right-color: var(--crimson); }
  .chain-step.a { border-right-color: var(--sage); }
  .chain-step.fin { border-right-color: var(--sky); background: rgba(127,179,213,0.08); }
  .chain-step b { color: var(--gold-bright); }
  .chain-step .who { display: inline-block; font-size: 11px; font-weight: 800; padding: 1px 8px; border-radius: 9px; background: var(--gold-deep); color: var(--parchment); margin-left: 6px; }
  .chain-step.q .who { background: var(--crimson); }
  .chain-step.a .who { background: var(--sage); color: var(--ink); }
  .chain-step.fin .who { background: var(--sky); color: var(--ink); }

  /* meforesh source text + caution */
  .mf-src { font-family: 'Frank Ruhl Libre', serif; font-size: 16px; line-height: 1.85; color: var(--parchment); background: rgba(244,234,213,0.05); border-radius: 8px; padding: 9px 12px; margin-bottom: 10px; }
  .mf-expl-label { font-size: 11px; font-weight: 800; color: var(--gold); letter-spacing: .05em; margin-bottom: 4px; }
  .mf-warn { font-size: 12px; line-height: 1.6; color: var(--warm); background: rgba(232,154,109,0.08); border: 1px dashed var(--warm); border-radius: 8px; padding: 7px 10px; margin-bottom: 10px; }
  .mf-anchor { font-size: 11.5px; color: var(--parchment-dim); margin-bottom: 8px; }
  .mf-anchor b { color: var(--gold); }
  .src-note { font-size: 11.5px; color: var(--parchment-dim); text-align: center; margin: 10px 0 0; line-height: 1.6; }
  .src-note a { color: var(--sky-glow); }
  .t-walk.short { animation-name: tWalkS; }
  @keyframes tWalkS { 0% { transform: translateX(0); } 48% { transform: translateX(-96px); } 50% { transform: translateX(-96px) scaleX(-1); } 100% { transform: translateX(0) scaleX(-1); } }
