amudim['4b'].translation = [{"type": "section", "title": "המשך הסוגיה — שאלה והזכרה"}, {"type": "quote", "aramaic": "רַבִּי יְהוֹשֻׁעַ הִיא, דְּאָמַר מִשְּׁעַת הַנָּחָתוֹ?! אָמַר רָבָא: אֲפִילּוּ תֵּימָא רַבִּי אֱלִיעֶזֶר — שְׁאֵלָה לְחוּד, וְהַזְכָּרָה לְחוּד.", "translation": "<strong>האם הדין שהובא לפני כן (בעמוד א׳) הולך דווקא כשיטת ר׳ יהושע</strong>, שאמר ״משעת הנחתו״ — שמזכירים גשמים רק משעה שמניחים את הלולב (ביום טוב האחרון)? <strong>אמר רבא:</strong> אפילו תאמר שהיא כר׳ אליעזר — <strong>שאלה לחוד והזכרה לחוד</strong>: הבקשה וההזכרה הן שני עניינים נפרדים."}, {"type": "section", "title": "ר׳ יהודה: ״העובר לפני התיבה״"}, {"type": "quote", "aramaic": "רַבִּי יְהוּדָה אוֹמֵר: הָעוֹבֵר לִפְנֵי הַתֵּיבָה כּוּ׳.", "translation": "<strong>ר׳ יהודה אומר</strong> (במשנה): ״העובר לפני התיבה (=החזן) ביום טוב האחרון של חג — האחרון (מוסף) מזכיר, הראשון (שחרית) אינו מזכיר; ביום טוב הראשון של פסח — הראשון מזכיר, האחרון אינו מזכיר״."}, {"type": "quote", "aramaic": "וּרְמִינְהוּ: עַד מָתַי שׁוֹאֲלִין אֶת הַגְּשָׁמִים, רַבִּי יְהוּדָה אוֹמֵר: עַד שֶׁיַּעֲבוֹר הַפֶּסַח, רַבִּי מֵאִיר אוֹמֵר: עַד שֶׁיַּעֲבוֹר נִיסָן.", "translation": "<strong>והקשו סתירה:</strong> בברייתא שנינו: עד מתי מבקשים גשמים? ר׳ יהודה אומר: <strong>עד שיעבור הפסח</strong> (כל ימי הפסח); ר׳ מאיר אומר: עד שיעבור ניסן. — והרי במשנה ר׳ יהודה אמר שמפסיקים כבר ביום טוב הראשון!"}, {"type": "quote", "aramaic": "אָמַר רַב חִסְדָּא, לָא קַשְׁיָא: כָּאן לִשְׁאוֹל, כָּאן לְהַזְכִּיר. מִישְׁאָל — שָׁאֵיל וְאָזֵיל, לְהַזְכִּיר — בְּיוֹם טוֹב הָרִאשׁוֹן פָּסֵיק.", "translation": "<strong>אמר רב חסדא, אין קושיה:</strong> כאן (בברייתא) — לעניין <em>שאלה</em>, כאן (במשנה) — לעניין <em>הזכרה</em>. את הבקשה — ממשיך ושואל (עד סוף פסח); את ההזכרה — ביום טוב הראשון הוא מפסיק."}, {"type": "quote", "aramaic": "אָמַר עוּלָּא: הָא דְּרַב חִסְדָּא קַשְׁיָא כַּחֹמֶץ לַשִּׁנַּיִם וְכֶעָשָׁן לָעֵינָיִם. וּמָה בִּמְקוֹם שֶׁאֵינוֹ שׁוֹאֵל — מַזְכִּיר, בִּמְקוֹם שֶׁשּׁוֹאֵל, אֵינוֹ דִּין שֶׁיְּהֵא מַזְכִּיר?", "translation": "<strong>אמר עולא:</strong> הדברים של רב חסדא קשים <strong>כחומץ לשיניים וכעשן לעיניים</strong>! הרי: אם במקום שאינו שואל (שמיני עצרת) — הוא מזכיר, במקום ששואל (חול המועד פסח) — האם אין זה דין (קל וחומר) שיזכיר?!", "viz": "<div class=\"kviz\"><div class=\"kviz-head\">🎬 הקל וחומר</div><div class=\"kviz-stage\"><div class=\"knode gold\"><span class=\"kemoji\">🌿</span>אינו שואל<br>→ מזכיר</div><span class=\"karrow\">⟸</span><div class=\"knode bad\"><span class=\"kverdict bad\" style=\"animation:kAppear 4s infinite 1.4s\">✗</span><span class=\"kemoji\">🫓</span>שואל<br>→ לא מזכיר?!</div></div><div class=\"kviz-cap\">״אינו דין שיהא מזכיר?״</div></div>"}, {"type": "quote", "aramaic": "אֶלָּא אָמַר עוּלָּא: תְּרֵי תַנָּאֵי אַלִּיבָּא דְּרַבִּי יְהוּדָה.", "translation": "<strong>אלא אמר עולא:</strong> שני תנאים (=שני מוסרי שמועה) הם, שנחלקו בשיטת ר׳ יהודה."}, {"type": "section", "title": "רב יוסף ורבה — שני ניסיונות"}, {"type": "quote", "aramaic": "רַב יוֹסֵף אָמַר: מַאי ״עַד שֶׁיַּעֲבוֹר הַפֶּסַח״ — עַד שֶׁיַּעֲבוֹר שְׁלִיחַ צִבּוּר רִאשׁוֹן הַיּוֹרֵד בְּיוֹם טוֹב רִאשׁוֹן שֶׁל פֶּסַח.", "translation": "<strong>רב יוסף אמר:</strong> מהו ״עד שיעבור הפסח״? — עד שיעבור <strong>שליח הציבור הראשון</strong> שיורד (להתפלל) ביום טוב הראשון של פסח. (וכך הברייתא שווה למשנה.)"}, {"type": "quote", "aramaic": "אֲמַר לֵיהּ אַבָּיֵי: שְׁאֵלָה בְּיוֹם טוֹב מִי אִיכָּא?", "translation": "<strong>אמר לו אביי:</strong> וכי יש <strong>שאלה ביום טוב</strong>? (הרי ביום טוב לא אומרים ברכת השנים!)"}, {"type": "quote", "aramaic": "אֲמַר לֵיהּ: אִין שׁוֹאֵל מְתוּרְגְּמָן. וְכִי מְתוּרְגְּמָן שׁוֹאֵל דָּבָר שֶׁאֵינוֹ צָרִיךְ לַצִּבּוּר? אֶלָּא מְחַוַּורְתָּא, כִּדְעוּלָּא.", "translation": "<strong>אמר לו (רב יוסף): כן — המתורגמן שואל</strong> (בתוך הדרשה). <strong>(השיב אביי):</strong> וכי המתורגמן יבקש דבר שהציבור אינו צריך? <strong>אלא ברור כדברי עולא.</strong>"}, {"type": "quote", "aramaic": "רַבָּה אָמַר: מַאי ״עַד שֶׁיַּעֲבוֹר הַפֶּסַח״ — עַד שֶׁיַּעֲבוֹר זְמַן שְׁחִיטַת הַפֶּסַח. וְכִתְחִילָּתוֹ כֵּן סוֹפוֹ: מָה תְּחִילָּתוֹ — מַזְכִּיר אַף עַל פִּי שֶׁאֵינוֹ שׁוֹאֵל, אַף סוֹפוֹ — מַזְכִּיר אַף עַל פִּי שֶׁאֵינוֹ שׁוֹאֵל.", "translation": "<strong>רבה אמר:</strong> מהו ״עד שיעבור הפסח״? — עד שיעבור <strong>זמן שחיטת הפסח</strong> (חצות י״ד ניסן). <strong>וכתחילתו כן סופו:</strong> כמו שבתחילה (בסוכות) מזכיר אף על פי שאינו שואל — כך בסוף (בפסח) מזכיר אף על פי שאינו שואל."}, {"type": "quote", "aramaic": "אֲמַר לֵיהּ אַבָּיֵי: בִּשְׁלָמָא תְּחִילָּתוֹ מַזְכִּיר — הַזְכָּרָה נָמֵי רִיצּוּי שְׁאֵלָה הִיא, אֶלָּא סוֹפוֹ, מַאי רִיצּוּי שְׁאֵלָה אִיכָּא? אֶלָּא מְחַוַּורְתָּא כִּדְעוּלָּא.", "translation": "<strong>אמר לו אביי:</strong> נניח שבתחילה מזכיר — ההזכרה היא <strong>״ריצוי״</strong> (הכנה, ריצוי) לשאלה שתבוא; אבל בסוף — איזה ריצוי לשאלה יש כאן? <strong>אלא ברור כדברי עולא.</strong>"}, {"type": "section", "title": "פסק ר׳ יוחנן — ושרשרת קושיות"}, {"type": "quote", "aramaic": "אָמַר רַבִּי אַסִּי אָמַר רַבִּי יוֹחָנָן: הֲלָכָה כְּרַבִּי יְהוּדָה. אֲמַר לֵיהּ רַבִּי זֵירָא לְרַבִּי אַסִּי: וּמִי אָמַר רַבִּי יוֹחָנָן הָכִי? וְהָתְנַן: בִּשְׁלֹשָׁה בְּמַרְחֶשְׁווֹן שׁוֹאֲלִין אֶת הַגְּשָׁמִים, רַבָּן גַּמְלִיאֵל אוֹמֵר: בְּשִׁבְעָה בּוֹ. וְאָמַר רַבִּי אֶלְעָזָר: הֲלָכָה כְּרַבָּן גַּמְלִיאֵל!", "translation": "<strong>אמר ר׳ אסי בשם ר׳ יוחנן:</strong> הלכה כר׳ יהודה. <strong>אמר לו ר׳ זירא:</strong> וכי ר׳ יוחנן אמר כך? והרי שנינו (במשנה בהמשך): ״בשלשה במרחשוון שואלין את הגשמים; רבן גמליאל אומר: בשבעה בו״ — <strong>ואמר ר׳ אלעזר: הלכה כרבן גמליאל!</strong>"}, {"type": "quote", "aramaic": "אֲמַר לֵיהּ: גַּבְרָא אַגַּבְרָא קָא רָמֵית?! אִיבָּעֵית אֵימָא, לָא קַשְׁיָא: כָּאן לִשְׁאוֹל, כָּאן לְהַזְכִּיר.", "translation": "<strong>אמר לו:</strong> אדם על אדם אתה מקשה?! (ר׳ אלעזר אינו ר׳ יוחנן.) <strong>ואם תרצה אמור:</strong> אין קושיה — כאן לשאלה (ז׳ במרחשוון), כאן להזכרה (שמיני עצרת)."}, {"type": "quote", "aramaic": "וְהָאָמַר רַבִּי יוֹחָנָן: בִּמְקוֹם שֶׁשּׁוֹאֵל מַזְכִּיר! הָהוּא לְהַפְסָקָה אִיתְּמַר. וְהָאָמַר רַבִּי יוֹחָנָן: הִתְחִיל לְהַזְכִּיר — מַתְחִיל לִשְׁאוֹל, פָּסַק מִלִּשְׁאוֹל — פּוֹסֵק מִלְּהַזְכִּיר.", "translation": "<strong>והרי ר׳ יוחנן אמר: במקום ששואל — מזכיר!</strong> — <em>(תירוץ:)</em> ההוא נאמר לעניין <strong>הפסקה</strong>. — <em>(קושיה:)</em> והרי ר׳ יוחנן אמר: <strong>התחיל להזכיר — מתחיל לשאול; פסק מלשאול — פוסק מלהזכיר</strong>! (גם להתחלה.)"}, {"type": "quote", "aramaic": "אֶלָּא, לָא קַשְׁיָא: הָא לַן, הָא לְהוּ. מַאי שְׁנָא לְדִידַן — דְּאִית לַן פֵּירֵי בְּדַבְרָא, לְדִידְהוּ נָמֵי אִית לְהוּ עוֹלֵי רְגָלִים!", "translation": "<strong>אלא, אין קושיה: זה — לנו (בבבל), וזה — להם (בארץ ישראל).</strong> — <em>מה שונה אצלנו?</em> שיש לנו פירות בשדה. — <em>אבל גם אצלם</em> יש <strong>עולי רגלים</strong> (שצריכים לחזור בלי גשם)!", "viz": "<div class=\"kviz\"><div class=\"kviz-head\">🎬 מי מתחיל מתי?</div><div class=\"kviz-stage\"><div class=\"knode gold\"><span class=\"kemoji\">🌾</span>בבל<br><span style=\"opacity:.7\">ז׳ במרחשוון</span></div><div class=\"knode\"><span class=\"kemoji\">🏛️</span>א״י, מקדש קיים<br><span style=\"opacity:.7\">ז׳ במרחשוון</span></div><div class=\"knode good\"><span class=\"kverdict good\" style=\"animation:kAppear 4s infinite 1.2s\">✓</span><span class=\"kemoji\">🌧️</span>א״י, בלי מקדש<br><span style=\"opacity:.7\">שמיני עצרת</span></div></div><div class=\"kviz-cap\">לפי מסקנת הגמרא (ופירוש רש״י) — זמן ההזכרה</div></div>"}, {"type": "quote", "aramaic": "כִּי קָאָמַר רַבִּי יוֹחָנָן, בִּזְמַן שֶׁאֵין בֵּית הַמִּקְדָּשׁ קַיָּים. הַשְׁתָּא דְּאָתֵית לְהָכִי — הָא וְהָא לְדִידְהוּ, וְלָא קַשְׁיָא: כָּאן בִּזְמַן שֶׁבֵּית הַמִּקְדָּשׁ קַיָּים, כָּאן בִּזְמַן שֶׁאֵין בֵּית הַמִּקְדָּשׁ קַיָּים.", "translation": "<strong>כאשר ר׳ יוחנן אמר (הלכה כר׳ יהודה) — בזמן שאין בית המקדש קיים.</strong> עכשיו שהגעת לכך: גם זה וגם זה — לבני ארץ ישראל, ואין קושיה: כאן — בזמן שבית המקדש קיים, כאן — בזמן שאין בית המקדש קיים."}, {"type": "section", "title": "״תרי יומי״ — שני ימים בחו״ל"}, {"type": "quote", "aramaic": "וַאֲנַן דְּאִית לַן תְּרֵי יוֹמֵי, הֵיכִי עָבְדִינַן? אָמַר רַב: מַתְחִיל בְּמוּסָפִין, וּפוֹסֵק בְּמִנְחָה עַרְבִית וְשַׁחֲרִית, וְחוֹזֵר בְּמוּסָפִין.", "translation": "<strong>ואנחנו, שיש לנו שני ימים (טובים), איך נוהגים?</strong> אמר רב: מתחיל במוסף, ופוסק במנחה, ערבית ושחרית, וחוזר (ומזכיר) במוסף."}, {"type": "quote", "aramaic": "אֲמַר לְהוּ שְׁמוּאֵל, פּוּקוּ וֶאֱמַרוּ לֵיהּ לְאַבָּא: אַחַר שֶׁעֲשִׂיתוֹ קוֹדֶשׁ תַּעֲשֵׂהוּ חוֹל? אֶלָּא אָמַר שְׁמוּאֵל: מַתְחִיל בְּמוּסָפִין וּבְמִנְחָה, וּפוֹסֵק עַרְבִית וְשַׁחֲרִית, וְחוֹזֵר וּמַתְחִיל בְּמוּסָפִין.", "translation": "<strong>אמר להם שמואל: צאו ואמרו לאבא (=לרב):</strong> אחרי שעשית אותו (את היום) קודש — תעשה אותו חול?! <strong>אלא אמר שמואל:</strong> מתחיל במוסף ובמנחה, ופוסק בערבית ושחרית, וחוזר ומתחיל במוסף."}, {"type": "note", "text": "<strong>מקור הטקסט:</strong> ספריא, מהדורת וויליאם דייוידסון — ארמית מנוקדת (CC-BY-NC). התרגום וההסברים — לשון פשוטה, בעזרת רש״י."}];
amudim['5a'].translation = [{"type": "section", "title": "סוף הסוגיה — ״כיון שהתחיל״"}, {"type": "quote", "aramaic": "רָבָא אָמַר: כֵּיוָן שֶׁהִתְחִיל, שׁוּב אֵינוֹ פּוֹסֵק. וְכֵן אָמַר רַב שֵׁשֶׁת: כֵּיוָן שֶׁהִתְחִיל, שׁוּב אֵינוֹ פּוֹסֵק.", "translation": "<strong>רבא אמר:</strong> כיון שהתחיל (להזכיר) — שוב אינו פוסק. <strong>וכן אמר רב ששת:</strong> כיון שהתחיל — שוב אינו פוסק."}, {"type": "quote", "aramaic": "וְאַף רַב הֲדַר בֵּיהּ. דְּאָמַר רַב חֲנַנְאֵל אָמַר רַב: מוֹנֶה עֶשְׂרִים וְאֶחָד יוֹם כְּדֶרֶךְ שֶׁמּוֹנֶה עֲשָׂרָה יָמִים מֵרֹאשׁ הַשָּׁנָה עַד יוֹם הַכִּפּוּרִים, וּמַתְחִיל, וְכֵיוָן שֶׁהִתְחִיל — שׁוּב אֵינוֹ פּוֹסֵק. וְהִלְכְתָא: כֵּיוָן שֶׁהִתְחִיל, שׁוּב אֵינוֹ פּוֹסֵק.", "translation": "<strong>וגם רב חזר בו:</strong> שאמר רב חננאל בשם רב: <strong>מונה עשרים ואחד יום</strong> (מראש השנה), כמו שמונה עשרה ימים מראש השנה עד יום הכיפורים — ומתחיל; וכיון שהתחיל, שוב אינו פוסק. <strong>וההלכה: כיון שהתחיל — שוב אינו פוסק.</strong>"}, {"type": "section", "title": "משנה: עד מתי שואלין"}, {"type": "quote", "aramaic": "מַתְנִי׳ עַד מָתַי שׁוֹאֲלִין אֶת הַגְּשָׁמִים? רַבִּי יְהוּדָה אוֹמֵר: עַד שֶׁיַּעֲבוֹר הַפֶּסַח, רַבִּי מֵאִיר אוֹמֵר: עַד שֶׁיֵּצֵא נִיסָן, שֶׁנֶּאֱמַר: ״וַיּוֹרֶד לָכֶם גֶּשֶׁם מוֹרֶה וּמַלְקוֹשׁ בָּרִאשׁוֹן״.", "translation": "<strong>משנה:</strong> עד מתי שואלים את הגשמים? <strong>ר׳ יהודה</strong> אומר: עד שיעבור הפסח. <strong>ר׳ מאיר</strong> אומר: עד שייצא ניסן, שנאמר: ״ויורד לכם גשם מורה ומלקוש <strong>בראשון</strong>״ (=בחודש הראשון, ניסן)."}, {"type": "section", "title": "גמרא: יורה בניסן? — הנס בימי יואל"}, {"type": "quote", "aramaic": "גְּמָ׳ אֲמַר לֵיהּ רַב נַחְמָן לְרַבִּי יִצְחָק: יוֹרֶה בְּנִיסָן? יוֹרֶה בִּמְרַחְשְׁוָן הוּא! דִּתְנַן: יוֹרֶה בִּמְרַחְשְׁוָן וּמַלְקוֹשׁ בְּנִיסָן! אֲמַר לֵיהּ, הָכִי אָמַר רַבִּי יוֹחָנָן: בִּימֵי יוֹאֵל בֶּן פְּתוּאֵל נִתְקַיֵּים מִקְרָא זֶה דִּכְתִיב בֵּיהּ ״יֶתֶר הַגָּזָם אָכַל הָאַרְבֶּה וְגוֹ׳״. אוֹתָהּ שָׁנָה יָצָא אֲדָר וְלֹא יָרְדוּ גְּשָׁמִים, יָרְדָה לָהֶם רְבִיעָה רִאשׁוֹנָה בְּאֶחָד בְּנִיסָן.", "translation": "<strong>גמרא: אמר רב נחמן לר׳ יצחק:</strong> יורה בניסן?! יורה הרי במרחשוון! ששנינו: יורה במרחשוון ומלקוש בניסן. <strong>אמר לו, כך אמר ר׳ יוחנן:</strong> בימי יואל בן פתואל התקיים פסוק זה, שנאמר עליו ״יתר הגזם אכל הארבה וגו׳״. באותה שנה יצא אדר ולא ירדו גשמים; ירד להם <strong>הגשם הראשון (״רביעה ראשונה״) באחד בניסן</strong>."}, {"type": "quote", "aramaic": "אָמַר לָהֶם נָבִיא לְיִשְׂרָאֵל: צְאוּ וְזִרְעוּ! אָמְרוּ לוֹ: מִי שֶׁיֵּשׁ לוֹ קַב חִטִּים אוֹ קַבַּיִּם שְׂעוֹרִין — יֹאכְלֶנּוּ וְיִחְיֶה, אוֹ יִזְרָעֶנּוּ וְיָמוּת? אָמַר לָהֶם: אַף עַל פִּי כֵן צְאוּ וְזִרְעוּ. נַעֲשָׂה לָהֶם נֵס, וְנִתְגַּלָּה לָהֶם מַה שֶּׁבַּכְּתָלִין וּמַה שֶּׁבְּחוֹרֵי נְמָלִים.", "translation": "<strong>אמר להם הנביא לישראל: צאו וזרעו!</strong> אמרו לו: מי שיש לו קב חיטים או קביים שעורים — שיאכל אותו ויחיה, או שיזרע אותו וימות? אמר להם: <strong>אף על פי כן — צאו וזרעו.</strong> נעשה להם נס, ונתגלה להם מה שבכתלים ומה שבחורי נמלים."}, {"type": "quote", "aramaic": "יָצְאוּ וְזָרְעוּ שֵׁנִי וּשְׁלִישִׁי וּרְבִיעִי, וְיָרְדָה לָהֶם רְבִיעָה שְׁנִיָּה בַּחֲמִשָּׁה בְּנִיסָן. הִקְרִיבוּ עוֹמֶר בְּשִׁשָּׁה עָשָׂר בְּנִיסָן, נִמְצֵאת תְּבוּאָה הַגְּדֵילָה בְּשִׁשָּׁה חֳדָשִׁים, גְּדֵילָה בְּאַחַד עָשָׂר יוֹם. נִמְצָא עוֹמֶר הַקָּרֵב מִתְּבוּאָה שֶׁל שִׁשָּׁה חֳדָשִׁים, קָרֵב מִתְּבוּאָה שֶׁל אַחַד עָשָׂר יוֹם.", "translation": "<strong>יצאו וזרעו</strong> בשני, בשלישי וברביעי (בניסן), וירד להם הגשם השני בחמישה בניסן. <strong>הקריבו עומר בשישה עשר בניסן</strong> — נמצא שתבואה שגדלה בשישה חודשים, גדלה באחד עשר יום; ונמצא שהעומר הקרב מתבואה של שישה חודשים — קרב מתבואה של אחד עשר יום.", "viz": "<div class=\"kviz\"><div class=\"kviz-head\">🎬 11 ימים</div><div class=\"kviz-stage\"><div class=\"knode\"><span class=\"kemoji\">🌧️</span>ה׳ ניסן<br><span style=\"opacity:.7\">גשם שני</span></div><span class=\"karrow\">←</span><div class=\"knode good\" style=\"animation:kPulse 2.5s infinite\"><span class=\"kemoji\">🌾</span>ט״ז ניסן<br><span style=\"opacity:.7\">עומר</span></div></div><div class=\"kviz-cap\">16 − 5 = <strong>11 ימי גידול</strong> (במקום שישה חודשים, מתשרי עד ניסן)</div></div>"}, {"type": "quote", "aramaic": "וְעַל אוֹתוֹ הַדּוֹר הוּא אוֹמֵר: ״הַזֹּרְעִים בְּדִמְעָה בְּרִנָּה יִקְצֹרוּ. הָלוֹךְ יֵלֵךְ וּבָכֹה נֹשֵׂא מֶשֶׁךְ הַזָּרַע וְגוֹ׳״. מַאי ״הָלוֹךְ יֵלֵךְ וּבָכֹה נֹשֵׂא מֶשֶׁךְ וְגוֹ׳״? אָמַר רַבִּי יְהוּדָה: שׁוֹר, כְּשֶׁהוּא חוֹרֵשׁ — הוֹלֵךְ וּבוֹכֶה, וּבַחֲזִירָתוֹ — אוֹכֵל חָזִיז מִן הַתֶּלֶם. וְזֶהוּ: ״בֹּא יָבֹא בְּרִנָּה״.", "translation": "<strong>ועל אותו הדור הוא אומר:</strong> ״הזרעים בדמעה ברנה יקצרו, הלוך ילך ובכה נשא משך הזרע וגו׳״. מהו ״הלוך ילך ובכה״? <strong>אמר ר׳ יהודה:</strong> השור — כשהוא חורש, הולך ובוכה; ובחזרתו — אוכל עשב רך (״חזיז״) מן התלם (שכבר צמח!). וזהו ״בא יבא ברנה״."}, {"type": "quote", "aramaic": "מַאי ״נֹשֵׂא אֲלֻמֹּתָיו״? אָמַר רַב חִסְדָּא, וְאָמְרִי לַהּ בְּמַתְנִיתָא תָּנָא: קָנֶה זֶרֶת, שִׁיבּוֹלֶת זִרְתַּיִם.", "translation": "<strong>מהו ״נשא אלמתיו״?</strong> אמר רב חסדא, ויש אומרים שבברייתא שנו: <strong>הקנה — זרת, השיבולת — זרתיים.</strong>"}, {"type": "section", "title": "דרשות ר׳ יוחנן (רב נחמן שואל את ר׳ יצחק)"}, {"type": "quote", "aramaic": "אֲמַר לֵיהּ רַב נַחְמָן לְרַבִּי יִצְחָק, מַאי דִּכְתִיב: ״כִּי קָרָא ה׳ לָרָעָב וְגַם בָּא אֶל הָאָרֶץ שֶׁבַע שָׁנִים״, בְּהָנָךְ שֶׁבַע שָׁנִים מַאי אֲכוּל?", "translation": "<strong>אמר רב נחמן לר׳ יצחק:</strong> מה פירוש הפסוק ״כי קרא ה׳ לרעב, וגם בא אל הארץ שבע שנים״ — בשבע השנים האלה, מה אכלו?"}, {"type": "quote", "aramaic": "אֲמַר לֵיהּ, הָכִי אָמַר רַבִּי יוֹחָנָן: שָׁנָה רִאשׁוֹנָה אָכְלוּ מַה שֶּׁבַּבָּתִּים, שְׁנִיָּה אָכְלוּ מַה שֶּׁבַּשָּׂדוֹת, שְׁלִישִׁית בְּשַׂר בְּהֵמָה טְהוֹרָה, רְבִיעִית בְּשַׂר בְּהֵמָה טְמֵאָה, חֲמִישִׁית בְּשַׂר שְׁקָצִים וּרְמָשִׂים, שִׁשִּׁית בְּשַׂר בְּנֵיהֶם וּבְנוֹתֵיהֶם, שְׁבִיעִית בְּשַׂר זְרוֹעוֹתֵיהֶם, לְקַיֵּים מַה שֶּׁנֶּאֱמַר: ״אִישׁ בְּשַׂר זְרֹעוֹ יֹאכֵלוּ״.", "translation": "<strong>אמר לו, כך אמר ר׳ יוחנן:</strong> בשנה הראשונה אכלו מה שבבתים; בשנייה — מה שבשדות; בשלישית — בשר בהמה טהורה; ברביעית — בשר בהמה טמאה; בחמישית — בשר שקצים ורמשים; בשישית — בשר בניהם ובנותיהם; בשביעית — בשר זרועותיהם, לקיים מה שנאמר: ״איש בשר זרעו יאכלו״."}, {"type": "quote", "aramaic": "וַאֲמַר לֵיהּ רַב נַחְמָן לְרַבִּי יִצְחָק, מַאי דִּכְתִיב: ״בְּקִרְבְּךָ קָדוֹשׁ וְלֹא אָבוֹא בְּעִיר״, מִשּׁוּם דִּבְקִרְבְּךָ קָדוֹשׁ לֹא אָבוֹא בְּעִיר? אָמַר לֵיהּ: הָכִי אָמַר רַבִּי יוֹחָנָן, אָמַר הַקָּדוֹשׁ בָּרוּךְ הוּא: לֹא אָבוֹא בִּירוּשָׁלַיִם שֶׁל מַעְלָה עַד שֶׁאָבוֹא לִירוּשָׁלַיִם שֶׁל מַטָּה!", "translation": "<strong>ואמר רב נחמן לר׳ יצחק:</strong> מה פירוש ״בקרבך קדוש ולא אבוא בעיר״ — וכי משום שבקרבך קדוש, לא אבוא בעיר? <strong>אמר לו, כך אמר ר׳ יוחנן:</strong> אמר הקב״ה: לא אבוא בירושלים של מעלה עד שאבוא לירושלים של מטה."}, {"type": "quote", "aramaic": "וּמִי אִיכָּא יְרוּשָׁלַיִם לְמַעְלָה? אִין, דִּכְתִיב: ״יְרוּשָׁלִַים הַבְּנוּיָה כְּעִיר שֶׁחֻבְּרָה לָּהּ יַחְדָּו״.", "translation": "<strong>וכי יש ירושלים למעלה?</strong> כן! שנאמר: ״ירושלים הבנויה כעיר שחברה לה יחדו״."}, {"type": "quote", "aramaic": "וַאֲמַר לֵיהּ רַבִּי נַחְמָן לְרַבִּי יִצְחָק, מַאי דִּכְתִיב: ״וּבְאַחַת יִבְעֲרוּ וְיִכְסָלוּ מוּסַר הֲבָלִים עֵץ הוּא״? אֲמַר לֵיהּ, הָכִי אָמַר רַבִּי יוֹחָנָן: אַחַת הִיא שֶׁמְּבַעֶרֶת רְשָׁעִים בְּגֵיהִנָּם, מַאי הִיא — עֲבוֹדָה זָרָה. כְּתִיב הָכָא: ״מוּסַר הֲבָלִים עֵץ הוּא״, וּכְתִיב הָתָם: ״הֶבֶל הֵמָּה מַעֲשֵׂה תַּעְתֻּעִים״.", "translation": "<strong>ואמר רב נחמן לר׳ יצחק:</strong> מה פירוש ״ובאחת יבערו ויכסלו, מוסר הבלים עץ הוא״? <strong>אמר לו, כך אמר ר׳ יוחנן:</strong> דבר <em>אחד</em> הוא שמבער את הרשעים בגיהנם — מהו? <strong>עבודה זרה</strong>. כתוב כאן ״מוסר <em>הבלים</em> עץ הוא״, וכתוב שם ״<em>הבל</em> המה, מעשה תעתעים״."}, {"type": "quote", "aramaic": "וַאֲמַר לֵיהּ רַב נַחְמָן לְרַבִּי יִצְחָק, מַאי דִּכְתִיב: ״כִּי שְׁתַּיִם רָעוֹת עָשָׂה עַמִּי״, תַּרְתֵּין הוּא דַּהֲווֹ? עֶשְׂרִין וְאַרְבַּע שְׁבִיקָא לְהוּ? אֲמַר לֵיהּ, הָכִי אָמַר רַבִּי יוֹחָנָן: אַחַת שֶׁהִיא", "translation": "<strong>ואמר רב נחמן לר׳ יצחק:</strong> מה פירוש ״כי שתים רעות עשה עמי״ — שתיים בלבד היו? ועשרים וארבע (העבירות) ויתר להם?! <strong>אמר לו, כך אמר ר׳ יוחנן: אחת שהיא...</strong> <em>(ההמשך בעמוד ב׳)</em>"}, {"type": "note", "text": "<strong>מקור הטקסט:</strong> ספריא, מהדורת וויליאם דייוידסון — ארמית מנוקדת (CC-BY-NC). התרגום וההסברים — לשון פשוטה, בעזרת רש״י. הדף נגמר באמצע משפט — כך גם בספריא."}];
amudim['4b'].rashi = [{"dh": "הכי גרסינן ואיכא דאמרי לימא ר' יהושע היא אפי' תימא רבי אליעזר כו'", "content": "<div class=\"mf-warn\">רש״י לעמוד זה הודבק כשהתרגום האוטומטי של הדפדפן היה פעיל. הנוסח נראה תקין, אך לא אומת מחדש.</div><div class=\"mf-anchor\">על הגמרא: <b>רַבִּי יְהוֹשֻׁעַ הִיא, דְּאָמַר מִשְּׁעַת הַנָּחָתוֹ?! אָמַר …</b></div><div class=\"mf-src\">הכי גרסינן ואיכא דאמרי לימא ר' יהושע היא אפי' תימא רבי אליעזר כו' – ולא גרסינן סברוה שאלה לחוד והזכרה לחוד דהא לא משתמע ממתני':</div><div class=\"mf-expl-label\">💡 הסבר</div><p>רש״י מתקן את הגרסה: הגמרא אומרת ״לימא ר׳ יהושע היא?... אפילו תימא ר׳ אליעזר״. את המילה ״סברוה״ (=חשבו בתחילה) שאלה לחוד והזכרה לחוד — <strong>לא גורסים</strong>, כי זה לא משתמע מהמשנה. כלומר ההבחנה ״שאלה לחוד והזכרה לחוד״ היא <em>חידושו של רבא</em>.</p>"}, {"dh": "עד אימתי שואלין את הגשמים", "content": "<div class=\"mf-anchor\">על הגמרא: <b>וּרְמִינְהוּ: עַד מָתַי שׁוֹאֲלִין אֶת הַגְּשָׁמִים, רַבִּי …</b></div><div class=\"mf-src\">עד אימתי שואלין את הגשמים – בסוף ימות הגשמים:</div><div class=\"mf-expl-label\">💡 הסבר</div><p>״עד אימתי שואלין״ — הכוונה ל<strong>סוף</strong> עונת הגשמים (מתי מפסיקים), ולא להתחלה.</p>"}, {"dh": "עד שיעבור הפסח", "content": "<div class=\"mf-anchor\">על הגמרא: <b>וּרְמִינְהוּ: עַד מָתַי שׁוֹאֲלִין אֶת הַגְּשָׁמִים, רַבִּי …</b></div><div class=\"mf-src\">עד שיעבור הפסח – דאמרינן כל חולו של מועד ותן טל ומטר:</div><div class=\"mf-expl-label\">💡 הסבר</div><p>״עד שיעבור הפסח״ — כל חול המועד ממשיכים לומר ״ותן טל ומטר״.</p>"}, {"dh": "עד שיצא ניסן", "content": "<div class=\"mf-anchor\">על הגמרא: <b>וּרְמִינְהוּ: עַד מָתַי שׁוֹאֲלִין אֶת הַגְּשָׁמִים, רַבִּי …</b></div><div class=\"mf-src\">עד שיצא ניסן – וכדמפיק טעמא במתני':</div><div class=\"mf-expl-label\">💡 הסבר</div><p>״עד שיצא ניסן״ — וטעמו מפורש במשנה (״מורה ומלקוש בראשון״).</p>"}, {"dh": "הכי גרסינן אמר רב חסדא כאן לשאול כאן להזכיר מישאיל שאיל ואזיל והזכרה ביו\"ט ראשון פוסק", "content": "<div class=\"mf-anchor\">על הגמרא: <b>אָמַר רַב חִסְדָּא, לָא קַשְׁיָא: כָּאן לִשְׁאוֹל, …</b></div><div class=\"mf-src\">הכי גרסינן אמר רב חסדא כאן לשאול כאן להזכיר מישאיל שאיל ואזיל והזכרה ביו\"ט ראשון פוסק – לשאול שואל והולך עד שיעבור הפסח כדקתני עד מתי שואלין כו' להזכיר אינו מזכיר אלא בתפלת יוצר של יו\"ט ראשון:</div><div class=\"mf-expl-label\">💡 הסבר</div><p>הנוסח הנכון של רב חסדא. <strong>שאלה</strong> — ממשיכים עד שיעבור הפסח (כמו בברייתא). <strong>הזכרה</strong> — מזכירים רק בתפילת <em>יוצר</em> (=שחרית) של יום טוב ראשון, ובמוסף כבר לא (כמו במשנה).</p>"}, {"dh": "במקום שאינו שואל", "content": "<div class=\"mf-anchor\">על הגמרא: <b>אָמַר עוּלָּא: הָא דְּרַב חִסְדָּא קַשְׁיָא כַּחֹמֶץ …</b></div><div class=\"mf-src\">במקום שאינו שואל – ביו\"ט האחרון של חג שאינו מתפלל תפלתו תפלת חול דאין שאלה אלא בברכת השנים:</div><div class=\"mf-expl-label\">💡 הסבר</div><p>״במקום שאינו שואל״ = שמיני עצרת: ביום טוב לא מתפללים תפילת חול, ו״שאלה״ נמצאת רק בברכת השנים.</p>"}, {"dh": "מזכיר", "content": "<div class=\"mf-anchor\">על הגמרא: <b>אָמַר עוּלָּא: הָא דְּרַב חִסְדָּא קַשְׁיָא כַּחֹמֶץ …</b></div><div class=\"mf-src\">מזכיר – גבורות גשמים כדאמר רבי יהודה האחרון מזכיר:</div><div class=\"mf-expl-label\">💡 הסבר</div><p>״מזכיר״ — אומר ״גבורות גשמים״, כמו שאמר ר׳ יהודה ״האחרון מזכיר״.</p>"}, {"dh": "במקום שהוא שואל", "content": "<div class=\"mf-anchor\">על הגמרא: <b>אָמַר עוּלָּא: הָא דְּרַב חִסְדָּא קַשְׁיָא כַּחֹמֶץ …</b></div><div class=\"mf-src\">במקום שהוא שואל – בחולו של מועד של פסח:</div><div class=\"mf-expl-label\">💡 הסבר</div><p>״במקום שהוא שואל״ = חול המועד פסח (שם יש תפילת חול, ושואלים).</p>"}, {"dh": "תרי תנאי", "content": "<div class=\"mf-anchor\">על הגמרא: <b>אֶלָּא אָמַר עוּלָּא: תְּרֵי תַנָּאֵי אַלִּיבָּא דְּרַבִּי …</b></div><div class=\"mf-src\">תרי תנאי – חד אמר עד שיעבור הפסח שואלין כל שכן שמזכירין וחד אמר שאלה עד הפסח והזכרה שיכול להזכיר ביו\"ט מזכיר ביו\"ט הראשון של פסח בתפלת יוצר ובמוספין פוסק:</div><div class=\"mf-expl-label\">💡 הסבר</div><p>״תרי תנאי״: תנא אחד אומר ששואלים עד אחרי הפסח — וכל שכן שמזכירים. תנא שני אומר: שאלה — עד הפסח; והזכרה (שאפשר לומר ביום טוב) — מזכיר ביום טוב הראשון בשחרית, ובמוסף פוסק.</p>"}, {"dh": "רב יוסף אמר", "content": "<div class=\"mf-anchor\">על הגמרא: <b>רַב יוֹסֵף אָמַר: מַאי עַד שֶׁיַּעֲבוֹר הַפֶּסַח …</b></div><div class=\"mf-src\">רב יוסף אמר – האי דקתני עד אימתי שואלין עד שיעבור כו' ה\"ק עד שיעבור שליח צבור כו' והיינו כאידך רבי יהודה דמתני' דאמר הראשון מזכיר האחרון אינו מזכיר:</div><div class=\"mf-expl-label\">💡 הסבר</div><p>רב יוסף מפרש את הברייתא: ״עד שיעבור שליח הציבור״ — וכך היא שווה למשנה: ״הראשון מזכיר, האחרון אינו מזכיר״.</p>"}, {"dh": "שאלה ביו\"ט מי איכא", "content": "<div class=\"mf-anchor\">על הגמרא: <b>אֲמַר לֵיהּ אַבָּיֵי: שְׁאֵלָה בְּיוֹם טוֹב מִי …</b></div><div class=\"mf-src\">שאלה ביו\"ט מי איכא – וכי מתפלל הוא תפלת חול שאתה אומר עד שיעבור הפסח דהיינו זמן שליח צבור של תפלת יו\"ט הראשון של פסח:</div><div class=\"mf-expl-label\">💡 הסבר</div><p>קושיית אביי: וכי מתפללים ביום טוב תפילת חול, שתאמר שזמן ה״שאלה״ נמשך עד שליח הציבור של יום טוב?</p>"}, {"dh": "אמר ליה אין שאלה דמתורגמן", "content": "<div class=\"mf-anchor\">על הגמרא: <b>אֲמַר לֵיהּ: אִין שׁוֹאֵל מְתוּרְגְּמָן. וְכִי מְתוּרְגְּמָן …</b></div><div class=\"mf-src\">אמר ליה אין שאלה דמתורגמן – בדרשה שהוא דורש אומר ברכת שאלה לבדה:</div><div class=\"mf-expl-label\">💡 הסבר</div><p>״אין, שאלה דמתורגמן״: בדרשה שהמתורגמן דורש בציבור, הוא אומר את ברכת השאלה לבדה.</p>"}, {"dh": "דבר שאינו צריך לצבור", "content": "<div class=\"mf-anchor\">על הגמרא: <b>אֲמַר לֵיהּ: אִין שׁוֹאֵל מְתוּרְגְּמָן. וְכִי מְתוּרְגְּמָן …</b></div><div class=\"mf-src\">דבר שאינו צריך לצבור – דכיון דזמן הפסקה הוא לאו אורח ארעא למישאל בצבור דבר שאינו צריך:</div><div class=\"mf-expl-label\">💡 הסבר</div><p>״דבר שאינו צריך לציבור״: מאחר שזה כבר זמן <em>הפסקה</em> (סוף החורף), אין זה דרך ארץ לבקש בציבור דבר שאין בו צורך.</p>"}, {"dh": "עד שיעבור זמן שחיטת פסח", "content": "<div class=\"mf-anchor\">על הגמרא: <b>רַבָּה אָמַר: מַאי עַד שֶׁיַּעֲבוֹר הַפֶּסַח — …</b></div><div class=\"mf-src\">עד שיעבור זמן שחיטת פסח – חצות יום דארבעה עשר עד שיעבור חצות דהיינו כל תפלת יוצר ואשמעינן ר' יהודה דבמנחה דערבי פסחים אע\"ג דמצלינן תפלת חול מפסיקינן ולא יאמר ותן טל ומטר ואע\"ג דמדכרינן עד למחר במוספין פוסק השאלה בתפלת מנחה של ערב יו\"ט הראשון והזכרה שיכול להזכיר ביום טוב מזכיר עד תפלת מוסף של יום טוב הראשון:</div><div class=\"mf-expl-label\">💡 הסבר</div><p>רבה: ״זמן שחיטת פסח״ = חצות של י״ד ניסן — כלומר כל תפילת שחרית. החידוש: במנחה של ערב פסח, אף שמתפללים תפילת חול — מפסיקים ולא אומרים ״ותן טל ומטר״. אבל ההזכרה (שאפשר ביום טוב) ממשיכה עד מוסף של יום טוב הראשון.</p>"}, {"dh": "כתחילתו", "content": "<div class=\"mf-anchor\">על הגמרא: <b>רַבָּה אָמַר: מַאי עַד שֶׁיַּעֲבוֹר הַפֶּסַח — …</b></div><div class=\"mf-src\">כתחילתו – שהוא מזכיר תחלה ביום טוב אחרון של חג ואינו שואל עד לאחר החג כך בסופו אינו שואל במנחה ערב יו\"ט הראשון ומזכיר עד מוסף של יו\"ט ראשון והכא ליכא למיפרך שאלה ביו\"ט מי איכא:</div><div class=\"mf-expl-label\">💡 הסבר</div><p>״כתחילתו״: בסוכות מזכיר תחילה ביום טוב האחרון ואינו שואל עד אחרי החג — כך בסוף: אינו שואל כבר במנחה של ערב פסח, ומזכיר עד מוסף. ולפי רבה לא קשה ״שאלה ביום טוב מי איכא״.</p>"}, {"dh": "דהזכרה נמי צורך שאלה היא", "content": "<div class=\"mf-anchor\">על הגמרא: <b>אֲמַר לֵיהּ אַבָּיֵי: בִּשְׁלָמָא תְּחִילָּתוֹ מַזְכִּיר — …</b></div><div class=\"mf-src\">דהזכרה נמי צורך שאלה היא – שמרצה תחילה לפי שא\"א לו לשאול ביו\"ט וכיון דאיכא שאלה אבתריה מזכיר הוא לרצויי בעלמא:</div><div class=\"mf-expl-label\">💡 הסבר</div><p>״ריצוי שאלה״: בתחילה ההזכרה ״מרצה״ ומכינה, כי ביום טוב אי אפשר לשאול; ומאחר שהשאלה באה אחריה — מזכיר כדי לרצות.</p>"}, {"dh": "אבל סופו", "content": "<div class=\"mf-anchor\">על הגמרא: <b>אֲמַר לֵיהּ אַבָּיֵי: בִּשְׁלָמָא תְּחִילָּתוֹ מַזְכִּיר — …</b></div><div class=\"mf-src\">אבל סופו – למה הוא מזכיר הואיל ואינו צריך לשאול מכאן ואילך הא כיון דאפסקת מאתמול גלית אדעתך דלא ניחא לך בהו ואמאי מזכיר:</div><div class=\"mf-expl-label\">💡 הסבר</div><p>״אבל סופו״: למה יזכיר, אם מכאן והלאה לא ישאל? אדרבה — כשהפסקת לשאול אתמול, ״גילית דעתך שלא נוח לך בהם״ (בגשמים). אז למה להזכיר?</p>"}, {"dh": "הלכה כרבי יהודה", "content": "<div class=\"mf-anchor\">על הגמרא: <b>אָמַר רַבִּי אַסִּי אָמַר רַבִּי יוֹחָנָן: הֲלָכָה …</b></div><div class=\"mf-src\">הלכה כרבי יהודה – דאמר העובר לפני התיבה וכו':</div><div class=\"mf-expl-label\">💡 הסבר</div><p>״הלכה כר׳ יהודה״ — שאמר ״העובר לפני התיבה וכו׳״ (מזכירים ביום טוב האחרון של חג).</p>"}, {"dh": "מי אמר רבי יוחנן הכי", "content": "<div class=\"mf-anchor\">על הגמרא: <b>אָמַר רַבִּי אַסִּי אָמַר רַבִּי יוֹחָנָן: הֲלָכָה …</b></div><div class=\"mf-src\">מי אמר רבי יוחנן הכי – דהלכה כרבי יהודה דמזכיר ביו\"ט האחרון:</div><div class=\"mf-expl-label\">💡 הסבר</div><p>קושיית ר׳ זירא: האם ר׳ יוחנן באמת פסק כר׳ יהודה, שמזכירים ביום טוב האחרון?</p>"}, {"dh": "בשלשה במרחשון", "content": "<div class=\"mf-anchor\">על הגמרא: <b>אָמַר רַבִּי אַסִּי אָמַר רַבִּי יוֹחָנָן: הֲלָכָה …</b></div><div class=\"mf-src\">בשלשה במרחשון – הכי קים להו דהוה זמן גשמים כו':</div><div class=\"mf-expl-label\">💡 הסבר</div><p>״בשלשה במרחשוון״ — כך היה ידוע להם שזה זמן הגשמים.</p>"}, {"dh": "הלכה כרבן גמליאל", "content": "<div class=\"mf-anchor\">על הגמרא: <b>אָמַר רַבִּי אַסִּי אָמַר רַבִּי יוֹחָנָן: הֲלָכָה …</b></div><div class=\"mf-src\">הלכה כרבן גמליאל – דאינו שואל עד שבעה במרחשון וקא ס\"ד דבמקום שהוא שואל מזכיר עד דמשני לקמן:</div><div class=\"mf-expl-label\">💡 הסבר</div><p>״הלכה כרבן גמליאל״ — שאין שואלים עד שבעה במרחשוון. וחשבו בתחילה שגם ההזכרה רק אז (״במקום ששואל — מזכיר״), עד שהגמרא תתרץ בהמשך.</p>"}, {"dh": "כאן לשאול", "content": "<div class=\"mf-anchor\">על הגמרא: <b>אֲמַר לֵיהּ: גַּבְרָא אַגַּבְרָא קָא רָמֵית?! אִיבָּעֵית …</b></div><div class=\"mf-src\">כאן לשאול – בשבעה במרחשון:</div><div class=\"mf-expl-label\">💡 הסבר</div><p>״כאן לשאול״ — שאלה מתחילה בשבעה במרחשוון.</p>"}, {"dh": "כאן להזכיר", "content": "<div class=\"mf-anchor\">על הגמרא: <b>אֲמַר לֵיהּ: גַּבְרָא אַגַּבְרָא קָא רָמֵית?! אִיבָּעֵית …</b></div><div class=\"mf-src\">כאן להזכיר – מיו\"ט האחרון ור' יוחנן אית ליה דרבי אלעזר:</div><div class=\"mf-expl-label\">💡 הסבר</div><p>״כאן להזכיר״ — ההזכרה מיום טוב האחרון. ור׳ יוחנן סובר כר׳ אלעזר (לגבי השאלה) — ואין סתירה.</p>"}, {"dh": "והא א\"ר יוחנן במקום ששואל מזכיר", "content": "<div class=\"mf-anchor\">על הגמרא: <b>וְהָאָמַר רַבִּי יוֹחָנָן: בִּמְקוֹם שֶׁשּׁוֹאֵל מַזְכִּיר! הָהוּא …</b></div><div class=\"mf-src\">והא א\"ר יוחנן במקום ששואל מזכיר – במקום שאינו שואל אינו מזכיר והיכי א\"ר יוחנן דהלכה כר' יהודה שמזכיר ביו\"ט האחרון הא ליכא שאלה דאין אומר ברכת השנים ביו\"ט:</div><div class=\"mf-expl-label\">💡 הסבר</div><p>הקושיה: ר׳ יוחנן אמר ״במקום ששואל — מזכיר״ — משמע שבמקום שאינו שואל, אינו מזכיר. אז איך פסק כר׳ יהודה להזכיר ביום טוב האחרון, כשאין שאלה (אין ברכת השנים ביום טוב)?</p>"}, {"dh": "להפסקה איתמר", "content": "<div class=\"mf-anchor\">על הגמרא: <b>וְהָאָמַר רַבִּי יוֹחָנָן: בִּמְקוֹם שֶׁשּׁוֹאֵל מַזְכִּיר! הָהוּא …</b></div><div class=\"mf-src\">להפסקה איתמר – דכשהוא מפסיק לשאלה בערב הפסח פוסק נמי להזכרה דהכי משמע במקום ששואל מזכיר:</div><div class=\"mf-expl-label\">💡 הסבר</div><p>״להפסקה איתמר״: כשמפסיק לשאול בערב פסח — מפסיק גם להזכיר. זה פירוש ״במקום ששואל מזכיר״.</p>"}, {"dh": "והא תרוייהו איתמר", "content": "<div class=\"mf-anchor\">על הגמרא: <b>וְהָאָמַר רַבִּי יוֹחָנָן: בִּמְקוֹם שֶׁשּׁוֹאֵל מַזְכִּיר! הָהוּא …</b></div><div class=\"mf-src\">והא תרוייהו איתמר – התחלה והפסקה:</div><div class=\"mf-expl-label\">💡 הסבר</div><p>״והא תרווייהו איתמר״ — ר׳ יוחנן אמר במפורש גם על ההתחלה וגם על ההפסקה.</p>"}, {"dh": "יתחיל לשאול", "content": "<div class=\"mf-anchor\">על הגמרא: <b>וְהָאָמַר רַבִּי יוֹחָנָן: בִּמְקוֹם שֶׁשּׁוֹאֵל מַזְכִּיר! הָהוּא …</b></div><div class=\"mf-src\">יתחיל לשאול – דהיינו בחול שיכול לשאול:</div><div class=\"mf-expl-label\">💡 הסבר</div><p>״יתחיל לשאול״ — כלומר בחול, כשאפשר לשאול.</p>"}, {"dh": "פסק מלשאול", "content": "<div class=\"mf-anchor\">על הגמרא: <b>וְהָאָמַר רַבִּי יוֹחָנָן: בִּמְקוֹם שֶׁשּׁוֹאֵל מַזְכִּיר! הָהוּא …</b></div><div class=\"mf-src\">פסק מלשאול – בערב הפסח פוסק מלהזכיר אלמא לא סבירא ליה כרבי יהודה והיכי אמר הלכה כמותו:</div><div class=\"mf-expl-label\">💡 הסבר</div><p>״פסק מלשאול״ — בערב פסח פוסק מלהזכיר. מוכח שר׳ יוחנן לא סובר כר׳ יהודה — ואיך אמר ״הלכה כמותו״?</p>"}, {"dh": "הא לן והא להו", "content": "<div class=\"mf-anchor\">על הגמרא: <b>אֶלָּא, לָא קַשְׁיָא: הָא לַן, הָא לְהוּ. …</b></div><div class=\"mf-src\">הא לן והא להו – לבני בבל שיש לנו תבואה ופירות בשדה כל תשרי אין מזכירין עד שבעה במרחשון ושם שואלים כדאמר רבי יוחנן מתחיל להזכיר מתחיל לשאול:</div><div class=\"mf-expl-label\">💡 הסבר</div><p>״הא לן״ — לבני בבל: יש לנו תבואה ופירות בשדה כל תשרי, ולכן אין מזכירים עד שבעה במרחשוון, ואז גם שואלים — כמו שאמר ר׳ יוחנן ״מתחיל להזכיר מתחיל לשאול״.</p>"}, {"dh": "והא להו", "content": "<div class=\"mf-anchor\">על הגמרא: <b>אֶלָּא, לָא קַשְׁיָא: הָא לַן, הָא לְהוּ. …</b></div><div class=\"mf-src\">והא להו – לבני ארץ ישראל דקוצרין בניסן ואוספין בתשרי מזכירין בי\"ט האחרון כרבי יהודה דאמר רב אסי הלכה כמותו:</div><div class=\"mf-expl-label\">💡 הסבר</div><p>״והא להו״ — לבני ארץ ישראל, שקוצרים בניסן ואוספים בתשרי: מזכירים ביום טוב האחרון כר׳ יהודה, שעליו אמר ר׳ אסי ״הלכה כמותו״.</p>"}, {"dh": "בדברא", "content": "<div class=\"mf-anchor\">על הגמרא: <b>אֶלָּא, לָא קַשְׁיָא: הָא לַן, הָא לְהוּ. …</b></div><div class=\"mf-src\">בדברא – מדבר כלומר בשדות:</div><div class=\"mf-expl-label\">💡 הסבר</div><p>״בדברא״ — מלשון ״מדבר״, כלומר בשדות.</p>"}, {"dh": "אית להו עולי רגלים", "content": "<div class=\"mf-anchor\">על הגמרא: <b>אֶלָּא, לָא קַשְׁיָא: הָא לַן, הָא לְהוּ. …</b></div><div class=\"mf-src\">אית להו עולי רגלים – ואם ירדו להן גשמים קשה להן בחזירתן:</div><div class=\"mf-expl-label\">💡 הסבר</div><p>״אית להו עולי רגלים״ — ואם ירדו להם גשמים, קשה להם בחזרתם הביתה.</p>"}, {"dh": "אלא כי א\"ר יוחנן", "content": "<div class=\"mf-anchor\">על הגמרא: <b>כִּי קָאָמַר רַבִּי יוֹחָנָן, בִּזְמַן שֶׁאֵין בֵּית …</b></div><div class=\"mf-src\">אלא כי א\"ר יוחנן – הלכה כר' יהודה דמזכיר מיו\"ט האחרון כו' בזמן שאין בהמ\"ק קיים וליכא עולי רגלים מזכיר:</div><div class=\"mf-expl-label\">💡 הסבר</div><p>״אלא כי אמר ר׳ יוחנן״ הלכה כר׳ יהודה (להזכיר מיום טוב האחרון) — בזמן שאין בית המקדש, ואין עולי רגלים.</p>"}, {"dh": "כאן בזמן שבית המקדש קיים", "content": "<div class=\"mf-anchor\">על הגמרא: <b>כִּי קָאָמַר רַבִּי יוֹחָנָן, בִּזְמַן שֶׁאֵין בֵּית …</b></div><div class=\"mf-src\">כאן בזמן שבית המקדש קיים – דאיכא עולי רגלים אינו מזכיר עד ז' במרחשון:</div><div class=\"mf-expl-label\">💡 הסבר</div><p>״בזמן שבית המקדש קיים״ — שיש עולי רגלים, אינו מזכיר עד שבעה במרחשוון.</p>"}, {"dh": "אנן דאית לן תרי יומי", "content": "<div class=\"mf-anchor\">על הגמרא: <b>וַאֲנַן דְּאִית לַן תְּרֵי יוֹמֵי, הֵיכִי עָבְדִינַן? …</b></div><div class=\"mf-src\">אנן דאית לן תרי יומי – שני ימים טובים אחרונים שמיני ספק שביעי ותשיעי ספק שמיני לרבי יהודה דאמר מיו\"ט האחרון באיזה מהן מזכיר:</div><div class=\"mf-expl-label\">💡 הסבר</div><p>״תרי יומי״: שני ימים טובים בסוף החג — יום ח׳ (שמיני, ספק שביעי) ויום ט׳ (תשיעי, ספק שמיני). לר׳ יהודה שמזכירים מיום טוב האחרון — באיזה מהם?</p>"}, {"dh": "מתחיל במוסף", "content": "<div class=\"mf-anchor\">על הגמרא: <b>וַאֲנַן דְּאִית לַן תְּרֵי יוֹמֵי, הֵיכִי עָבְדִינַן? …</b></div><div class=\"mf-src\">מתחיל במוסף – של שמיני ספק שביעי דשמא יו\"ט האחרון הוא:</div><div class=\"mf-expl-label\">💡 הסבר</div><p>״מתחיל במוסף״ של יום ח׳ — שמא הוא יום טוב האחרון.</p>"}, {"dh": "ופוסק במנחה", "content": "<div class=\"mf-anchor\">על הגמרא: <b>וַאֲנַן דְּאִית לַן תְּרֵי יוֹמֵי, הֵיכִי עָבְדִינַן? …</b></div><div class=\"mf-src\">ופוסק במנחה – שמא שביעי חול הוא ואין זמן הזכרה עד מוסף של מחר:</div><div class=\"mf-expl-label\">💡 הסבר</div><p>״ופוסק במנחה״ — שמא יום ח׳ הוא בעצם שביעי (חול), ואין זמן הזכרה עד מוסף של מחר.</p>"}, {"dh": "ופוסק נמי בערבית ושחרית", "content": "<div class=\"mf-anchor\">על הגמרא: <b>וַאֲנַן דְּאִית לַן תְּרֵי יוֹמֵי, הֵיכִי עָבְדִינַן? …</b></div><div class=\"mf-src\">ופוסק נמי בערבית ושחרית – של תשיעי ספק שמיני:</div><div class=\"mf-expl-label\">💡 הסבר</div><p>״ופוסק גם בערבית ושחרית״ של יום ט׳ (תשיעי, ספק שמיני).</p>"}, {"dh": "לאבא", "content": "<div class=\"mf-anchor\">על הגמרא: <b>אֲמַר לְהוּ שְׁמוּאֵל, פּוּקוּ וֶאֱמַרוּ לֵיהּ לְאַבָּא: …</b></div><div class=\"mf-src\">לאבא – חברי:</div><div class=\"mf-expl-label\">💡 הסבר</div><p>״לאבא״ — לחברי (כך כינה שמואל את רב).</p>"}, {"dh": "לאחר שעשיתו קודש", "content": "<div class=\"mf-anchor\">על הגמרא: <b>אֲמַר לְהוּ שְׁמוּאֵל, פּוּקוּ וֶאֱמַרוּ לֵיהּ לְאַבָּא: …</b></div><div class=\"mf-src\">לאחר שעשיתו קודש – לשמיני ספק שביעי שהזכרת בו גבורות גשמים כרבי יהודה מיו\"ט האחרון:</div><div class=\"mf-expl-label\">💡 הסבר</div><p>״לאחר שעשיתו קודש״: ביום ח׳ (ספק שביעי) הזכרת גבורות גשמים — כאילו הוא יום טוב האחרון כר׳ יהודה.</p>"}, {"dh": "תעשהו חול", "content": "<div class=\"mf-anchor\">על הגמרא: <b>אֲמַר לְהוּ שְׁמוּאֵל, פּוּקוּ וֶאֱמַרוּ לֵיהּ לְאַבָּא: …</b></div><div class=\"mf-src\">תעשהו חול – בתמיה: שמפסיק במנחה של אותו היום:</div><div class=\"mf-expl-label\">💡 הסבר</div><p>״תעשהו חול?!״ — בתמיה: שאתה מפסיק במנחה של <em>אותו היום</em>.</p>"}, {"dh": "ופוסק ערבית ושחרית", "content": "<div class=\"mf-anchor\">על הגמרא: <b>אֲמַר לְהוּ שְׁמוּאֵל, פּוּקוּ וֶאֱמַרוּ לֵיהּ לְאַבָּא: …</b></div><div class=\"mf-src\">ופוסק ערבית ושחרית – דלאו היינו תפלה של אותו היום:</div><div class=\"mf-expl-label\">💡 הסבר</div><p>״ופוסק ערבית ושחרית״ — כי אלה כבר תפילות של יום אחר (ולכן אין כאן ״עשיתו קודש ותעשהו חול״ באותו יום).</p>"}];
amudim['5a'].rashi = [{"dh": "רבא אמר כיון שהתחיל", "content": "<div class=\"mf-anchor\">על הגמרא: <b>רָבָא אָמַר: כֵּיוָן שֶׁהִתְחִיל, שׁוּב אֵינוֹ פּוֹסֵק. …</b></div><div class=\"mf-src\">רבא אמר כיון שהתחיל – בשמיני ספק שביעי שוב אינו פוסק:</div><div class=\"mf-expl-label\">💡 הסבר</div><p>״כיון שהתחיל״ — מוסף של יום ח׳ (שמיני, ספק שביעי): משם והלאה לא מפסיק.</p>"}, {"dh": "הדר ביה", "content": "<div class=\"mf-anchor\">על הגמרא: <b>וְאַף רַב הֲדַר בֵּיהּ. דְּאָמַר רַב חֲנַנְאֵל …</b></div><div class=\"mf-src\">הדר ביה – ממאי דאמר פוסק:</div><div class=\"mf-expl-label\">💡 הסבר</div><p>״הדר ביה״ — רב חזר ממה שאמר קודם, ״פוסק״.</p>"}, {"dh": "מונה כ\"א יום", "content": "<div class=\"mf-anchor\">על הגמרא: <b>וְאַף רַב הֲדַר בֵּיהּ. דְּאָמַר רַב חֲנַנְאֵל …</b></div><div class=\"mf-src\">מונה כ\"א יום – מראש השנה עד שמיני ספק שביעי של חג כדרך שמונה מר\"ה עד יוה\"כ י' ימים שמתחיל למנות מיום ראשון של ר\"ה ומזכיר מכאן ואילך וזהו שמזכיר בשמיני ספק שביעי שהוא כ\"ב שוב אינו פוסק והא דמתחילין אנו למנות מיום א' דהא דאנו עושין ב' ימים לאו משום ספק דשמא עיברו לאלול דהא אנן בקיאינן בקביעא דירחא אלא משום דמנהג אבותינו בידינו ל\"א מונה כ\"א יום כדרך שמונה כו' כלומר אם עיברו אלול לא יחשוב מיום ראשון של ר\"ה כ\"א יום שאם כן לא ימצאו בידו אלא כ' וכלים ביום טוב שביעי יום נטילת ערבה אלא מיום שמתחילין למנות עשרה ימים לעשות בעשירי יוה\"כ יתחיל למנות באלו שבכך לא יטעה שיום הכפורים יום אחד לבד וידע מהיכן התחילו למנות לו וביום שכלין כ\"א דהיינו ביום טוב אחרון מתחיל להזכיר וכיון שהתחיל שוב אינו פוסק:</div><div class=\"mf-expl-label\">💡 הסבר</div><p>רש״י מסביר את החשבון: מונים מראש השנה ועד שמיני (ספק שביעי) של חג, כמו שמונים מר״ה עשרה ימים ליום כיפור, מתחילים למנות מיום ראשון של ר״ה. כך היום שמזכירים בו — שמיני ספק שביעי — הוא היום ה־22, ומשם לא פוסקים. אנו עושים שני ימים לא מחמת ספק (״אנן בקיאינן בקביעא דירחא״ — אנחנו יודעים את קביעת החודש), אלא כי ״מנהג אבותינו בידינו״. <br><em>לשון אחר:</em> אם עיברו את אלול, לא ימנה מיום ראשון של ר״ה — כי אז יצאו רק 20 ויסתיימו ביום ההושענא רבה; אלא ימנה מהיום שממנו מונים עשרה ימים ליום הכיפורים, וביום שמסתיימים 21 — יום טוב האחרון — מתחיל להזכיר.</p>"}, {"dh": "א\"ל רב נחמן לרב יצחק יורה בניסן הוא", "content": "<div class=\"mf-anchor\">על הגמרא: <b>גְּמָ׳ אֲמַר לֵיהּ רַב נַחְמָן לְרַבִּי יִצְחָק: …</b></div><div class=\"mf-src\">א\"ל רב נחמן לרב יצחק יורה בניסן הוא – דכתיב ויורד לכם גשם מורה ומלקוש בראשון בתמיה:</div><div class=\"mf-expl-label\">💡 הסבר</div><p>הקושיה בתמיה: ״יורה בניסן?״ — כתוב ״ויורד לכם גשם מורה ומלקוש <u>בראשון</u>״.</p>"}, {"dh": "והא במרחשון הוא", "content": "<div class=\"mf-anchor\">על הגמרא: <b>גְּמָ׳ אֲמַר לֵיהּ רַב נַחְמָן לְרַבִּי יִצְחָק: …</b></div><div class=\"mf-src\">והא במרחשון הוא – כדתניא לקמן ובספרי הוא:</div><div class=\"mf-expl-label\">💡 הסבר</div><p>״והא במרחשוון הוא״ — כמו שמובא בברייתא לקמן, ובספרי.</p>"}, {"dh": "יורה ומלקוש", "content": "<div class=\"mf-anchor\">על הגמרא: <b>גְּמָ׳ אֲמַר לֵיהּ רַב נַחְמָן לְרַבִּי יִצְחָק: …</b></div><div class=\"mf-src\">יורה ומלקוש – מפרש לקמן:</div><div class=\"mf-expl-label\">💡 הסבר</div><p>פירוש ״יורה ומלקוש״ — מבואר לקמן.</p>"}, {"dh": "אמר ליה", "content": "<div class=\"mf-anchor\">על הגמרא: <b>גְּמָ׳ אֲמַר לֵיהּ רַב נַחְמָן לְרַבִּי יִצְחָק: …</b></div><div class=\"mf-src\">אמר ליה – ודאי במרחשון הוא ומקרא זה בימי יואל בן פתואל נתקיים שיורה ומלקוש היה בראשון ע\"י נס שהיה רעב שבע שנים דכתיב כי קרא ה' לרעב וגם בא אל הארץ שבע שנים וכתיב יתר הגזם אכל הארבה וגו':</div><div class=\"mf-expl-label\">💡 הסבר</div><p>התשובה: ודאי היורה הוא במרחשוון; אבל פסוק זה התקיים בימי יואל, שבהם היורה והמלקוש היו בניסן <strong>על ידי נס</strong> — אחרי רעב של שבע שנים (״כי קרא ה׳ לרעב...״, ״יתר הגזם אכל הארבה״).</p>"}, {"dh": "הכי גרסינן יצא אדר ולא ירדו גשמים", "content": "<div class=\"mf-anchor\">על הגמרא: <b>גְּמָ׳ אֲמַר לֵיהּ רַב נַחְמָן לְרַבִּי יִצְחָק: …</b></div><div class=\"mf-src\">הכי גרסינן יצא אדר ולא ירדו גשמים – ולא זרעו רוב אדר לא גרסינן:</div><div class=\"mf-expl-label\">💡 הסבר</div><p>תיקון גרסה: הנוסח הוא ״יצא אדר ולא ירדו גשמים״ — ואת המילים ״ולא זרעו רוב אדר״ לא גורסים.</p>"}, {"dh": "רביעה ראשונה", "content": "<div class=\"mf-anchor\">על הגמרא: <b>גְּמָ׳ אֲמַר לֵיהּ רַב נַחְמָן לְרַבִּי יִצְחָק: …</b></div><div class=\"mf-src\">רביעה ראשונה – התחלת גשמים ולקמן (תענית דף ו:) מפרש רביעה שמרביע את הארץ:</div><div class=\"mf-expl-label\">💡 הסבר</div><p>״רביעה ראשונה״ = תחילת הגשמים. ולקמן (ו:) מפרש: ״רביעה״ — שמרביע (מפרה) את הארץ.</p>"}, {"dh": "או יזרענו וימות", "content": "<div class=\"mf-anchor\">על הגמרא: <b>אָמַר לָהֶם נָבִיא לְיִשְׂרָאֵל: צְאוּ וְזִרְעוּ! אָמְרוּ …</b></div><div class=\"mf-src\">או יזרענו וימות – ברעב קודם שתגדל התבואה החדשה שלא יהיה לו מה יאכל:</div><div class=\"mf-expl-label\">💡 הסבר</div><p>״או יזרענו וימות״ — ימות ברעב לפני שתגדל התבואה החדשה, כי לא יהיה לו מה לאכול.</p>"}, {"dh": "נעשה להם נס כו'", "content": "<div class=\"mf-anchor\">על הגמרא: <b>אָמַר לָהֶם נָבִיא לְיִשְׂרָאֵל: צְאוּ וְזִרְעוּ! אָמְרוּ …</b></div><div class=\"mf-src\">נעשה להם נס כו' – והיינו דכתיב ושלמתי לכם את השנים אשר אכל הארבה וגו':</div><div class=\"mf-expl-label\">💡 הסבר</div><p>״נעשה להם נס״ — וזה מה שכתוב: ״ושלמתי לכם את השנים אשר אכל הארבה״.</p>"}, {"dh": "נתגלה להם תבואה שבחורי נמלים ומה שבכתלים", "content": "<div class=\"mf-anchor\">על הגמרא: <b>אָמַר לָהֶם נָבִיא לְיִשְׂרָאֵל: צְאוּ וְזִרְעוּ! אָמְרוּ …</b></div><div class=\"mf-src\">נתגלה להם תבואה שבחורי נמלים ומה שבכתלים – שאצרו העכברים:</div><div class=\"mf-expl-label\">💡 הסבר</div><p>נתגלתה להם התבואה שבחורי הנמלים ושבכתלים — שאגרו העכברים.</p>"}, {"dh": "יצאו וזרעו", "content": "<div class=\"mf-anchor\">על הגמרא: <b>יָצְאוּ וְזָרְעוּ שֵׁנִי וּשְׁלִישִׁי וּרְבִיעִי, וְיָרְדָה לָהֶם …</b></div><div class=\"mf-src\">יצאו וזרעו – וזרעו מה שבידם:</div><div class=\"mf-expl-label\">💡 הסבר</div><p>״יצאו וזרעו״ — את מה שהיה בידם.</p>"}, {"dh": "שני", "content": "<div class=\"mf-anchor\">על הגמרא: <b>יָצְאוּ וְזָרְעוּ שֵׁנִי וּשְׁלִישִׁי וּרְבִיעִי, וְיָרְדָה לָהֶם …</b></div><div class=\"mf-src\">שני – בניסן ושלישי ורביעי ומה שמצאו אכלו ולאחר שזרעו ירדו להם גשמים בה' בניסן והקריבו עומר בט\"ז בניסן מאותה תבואה חדשה:</div><div class=\"mf-expl-label\">💡 הסבר</div><p>״שני״ — בניסן, ושלישי ורביעי; ומה שמצאו (בחורים) — אכלו. אחרי שזרעו ירדו גשמים בה׳ בניסן, והקריבו עומר בט״ז בניסן מאותה תבואה חדשה.</p>"}, {"dh": "הגדילה בששה חדשים", "content": "<div class=\"mf-anchor\">על הגמרא: <b>יָצְאוּ וְזָרְעוּ שֵׁנִי וּשְׁלִישִׁי וּרְבִיעִי, וְיָרְדָה לָהֶם …</b></div><div class=\"mf-src\">הגדילה בששה חדשים – מתשרי ועד ניסן:</div><div class=\"mf-expl-label\">💡 הסבר</div><p>״הגדילה בשישה חודשים״ — מתשרי עד ניסן.</p>"}, {"dh": "בי\"א יום", "content": "<div class=\"mf-anchor\">על הגמרא: <b>יָצְאוּ וְזָרְעוּ שֵׁנִי וּשְׁלִישִׁי וּרְבִיעִי, וְיָרְדָה לָהֶם …</b></div><div class=\"mf-src\">בי\"א יום – מחמשה בניסן עד ט\"ז בו:</div><div class=\"mf-expl-label\">💡 הסבר</div><p>״בי״א יום״ — מחמישה בניסן עד ט״ז בו.</p>"}, {"dh": "הזורעים בדמעה ברנה יקצורו", "content": "<div class=\"mf-anchor\">על הגמרא: <b>וְעַל אוֹתוֹ הַדּוֹר הוּא אוֹמֵר: הַזֹּרְעִים בְּדִמְעָה …</b></div><div class=\"mf-src\">הזורעים בדמעה ברנה יקצורו – שלא היה להן מה לאכול:</div><div class=\"mf-expl-label\">💡 הסבר</div><p>״הזורעים בדמעה״ — כי לא היה להם מה לאכול.</p>"}, {"dh": "מאי הלך ילך ובכה", "content": "<div class=\"mf-anchor\">על הגמרא: <b>וְעַל אוֹתוֹ הַדּוֹר הוּא אוֹמֵר: הַזֹּרְעִים בְּדִמְעָה …</b></div><div class=\"mf-src\">מאי הלך ילך ובכה – אם לבני אדם כבר נאמר הזורעים בדמעה ברנה יקצורו אלא על השור הכתוב אומר:</div><div class=\"mf-expl-label\">💡 הסבר</div><p>״מאי הלוך ילך ובכה״: אם על בני אדם — כבר נאמר ״הזורעים בדמעה ברנה יקצורו״; אלא על <strong>השור</strong> הכתוב מדבר.</p>"}, {"dh": "בהליכתו", "content": "<div class=\"mf-anchor\">על הגמרא: <b>וְעַל אוֹתוֹ הַדּוֹר הוּא אוֹמֵר: הַזֹּרְעִים בְּדִמְעָה …</b></div><div class=\"mf-src\">בהליכתו – לחרוש התלם:</div><div class=\"mf-expl-label\">💡 הסבר</div><p>״בהליכתו״ — כשהולך לחרוש את התלם.</p>"}, {"dh": "ובחזירתו אוכל חזיז", "content": "<div class=\"mf-anchor\">על הגמרא: <b>וְעַל אוֹתוֹ הַדּוֹר הוּא אוֹמֵר: הַזֹּרְעִים בְּדִמְעָה …</b></div><div class=\"mf-src\">ובחזירתו אוכל חזיז – שחת מן התלם שזרעו בהליכתן שכשהוא זורע מיד מתחלת ליגדל:</div><div class=\"mf-expl-label\">💡 הסבר</div><p>״ובחזירתו אוכל חזיז״ — עשב (״שחת״) מן התלם שזרעו בהליכה, כי מיד כשזורע — מתחיל לגדול.</p>"}, {"dh": "מאי בא יבוא ברנה נושא אלומותיו", "content": "<div class=\"mf-anchor\">על הגמרא: <b>מַאי נֹשֵׂא אֲלֻמֹּתָיו? אָמַר רַב חִסְדָּא, וְאָמְרִי …</b></div><div class=\"mf-src\">מאי בא יבוא ברנה נושא אלומותיו – אם מפני התבואה שיש להם לאכול הרי כבר אמור ברנה יקצורו:</div><div class=\"mf-expl-label\">💡 הסבר</div><p>״בא יבא ברנה נושא אלומותיו״: אם מדובר על התבואה שיש להם לאכול — כבר נאמר ״ברנה יקצורו״; לכן הגמרא דורשת את ״אלומותיו״ על גודל השיבולת.</p>"}, {"dh": "שבולת זרתים", "content": "<div class=\"mf-anchor\">על הגמרא: <b>מַאי נֹשֵׂא אֲלֻמֹּתָיו? אָמַר רַב חִסְדָּא, וְאָמְרִי …</b></div><div class=\"mf-src\">שבולת זרתים – זהו נס גדול מה שאין כן דרך כל תבואה שהקנה פי שלשה וארבעה בשבולת:</div><div class=\"mf-expl-label\">💡 הסבר</div><p>״שיבולת זרתיים״ — נס גדול! שאין כן דרך כל תבואה, שהקנה ארוך פי שלושה וארבעה מהשיבולת.</p>"}, {"dh": "כי קרא ה' לרעב", "content": "<div class=\"mf-anchor\">על הגמרא: <b>אֲמַר לֵיהּ רַב נַחְמָן לְרַבִּי יִצְחָק, מַאי …</b></div><div class=\"mf-src\">כי קרא ה' לרעב – בימי יהורם בן אחאב נאמר:</div><div class=\"mf-expl-label\">💡 הסבר</div><p>״כי קרא ה׳ לרעב״ — נאמר בימי יהורם בן אחאב.</p>"}, {"dh": "מה שבשדות", "content": "<div class=\"mf-anchor\">על הגמרא: <b>אֲמַר לֵיהּ, הָכִי אָמַר רַבִּי יוֹחָנָן: שָׁנָה …</b></div><div class=\"mf-src\">מה שבשדות – ספיחים ומה שנשתייר בשדות:</div><div class=\"mf-expl-label\">💡 הסבר</div><p>״מה שבשדות״ — ספיחים (מה שצומח מעצמו) ומה שנשאר בשדות.</p>"}, {"dh": "אכלו בשר בניהם", "content": "<div class=\"mf-anchor\">על הגמרא: <b>אֲמַר לֵיהּ, הָכִי אָמַר רַבִּי יוֹחָנָן: שָׁנָה …</b></div><div class=\"mf-src\">אכלו בשר בניהם – מקצתם:</div><div class=\"mf-expl-label\">💡 הסבר</div><p>״אכלו בשר בניהם״ — מקצתם.</p>"}, {"dh": "משום דבקרבך קדוש", "content": "<div class=\"mf-anchor\">על הגמרא: <b>וַאֲמַר לֵיהּ רַב נַחְמָן לְרַבִּי יִצְחָק, מַאי …</b></div><div class=\"mf-src\">משום דבקרבך קדוש – שאתה מטיב מעשיך לא יבא הקב\"ה בעיר:</div><div class=\"mf-expl-label\">💡 הסבר</div><p>״משום דבקרבך קדוש״ — וכי מפני שאתה מטיב מעשיך, הקב״ה לא יבוא בעיר? (בתמיה)</p>"}, {"dh": "לא אבא בירושלים כו'", "content": "<div class=\"mf-anchor\">על הגמרא: <b>וַאֲמַר לֵיהּ רַב נַחְמָן לְרַבִּי יִצְחָק, מַאי …</b></div><div class=\"mf-src\">לא אבא בירושלים כו' – והכי קאמר עד שיהא בקרבך קדוש למטה דהיינו ירושלים לא אבוא בעיר שלמעלה:</div><div class=\"mf-expl-label\">💡 הסבר</div><p>״לא אבוא בירושלים...״ — כך פירושו: עד שיהיה ״בקרבך קדוש״ למטה, כלומר ירושלים (בנויה) — לא אבוא בעיר שלמעלה.</p>"}, {"dh": "ירושלים הבנויה כעיר שחוברה לה יחדיו", "content": "<div class=\"mf-anchor\">על הגמרא: <b>וּמִי אִיכָּא יְרוּשָׁלַיִם לְמַעְלָה? אִין, דִּכְתִיב: יְרוּשָׁלִַים …</b></div><div class=\"mf-src\">ירושלים הבנויה כעיר שחוברה לה יחדיו – ירושלים שלמטה תהא בנויה כעיר שחוברה לה שהיא כיוצא בה חבירתה ודוגמתה מכלל דאיכא ירושלים אחריתי והיכן אם לא למעלה:</div><div class=\"mf-expl-label\">💡 הסבר</div><p>״ירושלים הבנויה כעיר שחוברה לה יחדיו״ — ירושלים שלמטה תהיה בנויה כעיר ש״חוברה לה״: שיש כמוה ״חברתה ודוגמתה״. משמע שיש ירושלים נוספת — והיכן? למעלה.</p>"}, {"dh": "ובאחת יבערו ויכסלו מוסר הבלים עץ הוא", "content": "<div class=\"mf-anchor\">על הגמרא: <b>וַאֲמַר לֵיהּ רַבִּי נַחְמָן לְרַבִּי יִצְחָק, מַאי …</b></div><div class=\"mf-src\">ובאחת יבערו ויכסלו מוסר הבלים עץ הוא – אי לאו גזרה שוה היה משמע אטומים כעץ לקבל מוסר ולשוא היו לוקין:</div><div class=\"mf-expl-label\">💡 הסבר</div><p>״מוסר הבלים עץ הוא״ — אלמלא הגזירה שווה, היה משמע: אטומים כעץ לקבל מוסר, ולשווא היו לוקים.</p>"}, {"dh": "באחת", "content": "<div class=\"mf-anchor\">על הגמרא: <b>וַאֲמַר לֵיהּ רַבִּי נַחְמָן לְרַבִּי יִצְחָק, מַאי …</b></div><div class=\"mf-src\">באחת – עבירה שהן עושין יתבערו הכסילים רשעים:</div><div class=\"mf-expl-label\">💡 הסבר</div><p>״באחת״ — עבירה אחת שהם עו amudim['4b'].tosafot = [{"dh": "ואמר ר' אלעזר הלכה כר\"ג דאמר וכו׳", "content": "<div class=\"mf-warn\">הטקסט הודבק כשהתרגום האוטומטי של הדפדפן היה פעיל. הנוסח נראה תקין, אך מומלץ להשוות לדפוס.</div><div class=\"mf-anchor\">על הגמרא: <b>אָמַר רַבִּי אַסִּי אָמַר רַבִּי יוֹחָנָן: הֲלָכָה …</b></div><div class=\"mf-src\">ואמר ר' אלעזר הלכה כר\"ג דאמר דאין שואלין עד שבעה וכו'. פירוש ואת אמרת הלכה כר' יהודה בהא דקאמר במתני' רבי יהודה אומר לפני התיבה בי\"ט האחרון של חג האחרון מזכיר והראשון אינו מזכיר ומדמינן לעיל שאלה להזכרה דפריך ורמינה עד מתי שואלין את הגשמים עד שיעבור וכו' ומשני גברא. אגברא וכו':</div><div class=\"mf-expl-label\">💡 הסבר</div><p><strong>על מה תוספות מדברים:</strong> הקושיה של ר׳ זירא. למה פסק ר׳ אלעזר (כרבן גמליאל — שאלה מז׳ במרחשוון) סותר את ר׳ יוחנן (כר׳ יהודה — <em>הזכרה</em> מיום טוב האחרון)? הרי אחד מדבר על שאלה והשני על הזכרה!</p><p><strong>הסבר תוספות:</strong> קודם בגמרא <strong>השווינו שאלה להזכרה</strong> — כשהקשינו ״ורמינהו״ בין הברייתא (שאלה) למשנה (הזכרה) כאילו הן אותו דבר. על בסיס ההנחה הזו ר׳ זירא מקשה. ועל זה עונה ר׳ אסי ״גברא אגברא...״.</p>"}, {"dh": "והא אמר רבי יוחנן במקום ששואלין הגשמים מזכיר", "content": "<div class=\"mf-warn\">הטקסט הודבק כשהתרגום האוטומטי של הדפדפן היה פעיל. הנוסח נראה תקין, אך מומלץ להשוות לדפוס.</div><div class=\"mf-anchor\">על הגמרא: <b>וְהָאָמַר רַבִּי יוֹחָנָן: בִּמְקוֹם שֶׁשּׁוֹאֵל מַזְכִּיר! הָהוּא …</b></div><div class=\"mf-src\">והא אמר רבי יוחנן במקום ששואלין הגשמים מזכיר. ומשני ההוא להפסקה פי' דבמקום שמפסיק מלשאול מפסיק מלהזכיר אבל מתחיל קודם להזכיר וטעמא הוי דהזכרה הוה ריצוי שאלה ומש\"ה ליכא חששא אם מזכיר קודם:</div><div class=\"mf-expl-label\">💡 הסבר</div><p><strong>הקושיה:</strong> ר׳ יוחנן אמר ״במקום ששואל — מזכיר״. התירוץ: ״ההוא להפסקה איתמר״.</p><p><strong>הסבר תוספות:</strong> המשמעות היא — <strong>כשמפסיק לשאול, מפסיק גם להזכיר</strong>. אבל <em>להתחיל</em> להזכיר אפשר קודם (לפני השאלה). והטעם: ההזכרה היא <strong>״ריצוי שאלה״</strong> (כמו שאמר אביי), ולכן אין חשש אם מזכיר לפני שמתחיל לשאול.</p function heb(n) {
  const ones = ['', 'א', 'ב', 'ג', 'ד', 'ה', 'ו', 'ז', 'ח', 'ט'];
  const tens = ['', 'י', 'כ', 'ל', 'מ', 'נ', 'ס', 'ע', 'פ', 'צ'];
  const hundreds = ['', 'ק', 'ק״ק'];

  if (n < 10) return ones[n];
  if (n === 15) return 'ט״ו';
  if (n === 16) return 'ט״ז';
  if (n < 100) {
    const t = Math.floor(n / 10);
    const o = n % 10;
    if (o === 0) return tens[t];
    return tens[t] + '״' + ones[o];
  }
  // 100+
  const h = Math.floor(n / 100);
  const rest = n % 100;
  if (rest === 0) return hundreds[h];
  if (rest < 10) return hundreds[h] + '״' + ones[rest];
  const t = Math.floor(rest / 10);
  const o = rest % 10;
  if (o === 0) return hundreds[h] + tens[t];
  return hundreds[h] + tens[t] + ones[o];
}

// =======================================================
// STATE & RENDERING
// =======================================================
const state = {
  tab: 'masechet',
  ref: '4b',
  sceneIdx: 0,
  modal: null
};

function getAllRefs() {
  return Object.keys(amudim).sort((a, b) => {
    const da = parseInt(a);
    const db = parseInt(b);
    if (da !== db) return da - db;
    return a.endsWith('a') ? -1 : 1;
  });
}

const allRefs = getAllRefs();

function getCurrentIdx() { return allRefs.indexOf(state.ref); }

function goToRef(ref) {
  if (!amudim[ref]) return;
  state.ref = ref;
  state.sceneIdx = 0;
  renderAll();
  window.scrollTo(0, 0);
}

function renderHeader() {
  const amud = amudim[state.ref];
  const perek = getPerekFor(amud.daf, amud.amud);
  document.getElementById('dafTitle').textContent =
    `דף ${heb(amud.daf)} ע״${amud.amud === 'a' ? 'א' : 'ב'}`;
  document.getElementById('perekName').textContent =
    `פרק ${perek.num} — ${perek.name}`;

  const idx = getCurrentIdx();
  document.getElementById('prevDafBtn').disabled = idx === 0;
  document.getElementById('nextDafBtn').disabled = idx === allRefs.length - 1;
}

function renderActionBar() {
  const amud = amudim[state.ref];
  document.getElementById('rashiCount').textContent = amud.rashi.length;
  document.getElementById('tosCount').textContent = amud.tosafot.length;
  document.getElementById('rashiBtn').classList.toggle('disabled', amud.rashi.length === 0);
  document.getElementById('tosBtn').classList.toggle('disabled', amud.tosafot.length === 0);
}

function renderScenes() {
  const stage = document.getElementById('stage');
  const scenes = state.tab === 'masechet' ? amudim[state.ref].scenes : tutorialScenes;

  stage.innerHTML = '';
  scenes.forEach((scene, i) => {
    const div = document.createElement('section');
    div.className = 'scene' + (i === state.sceneIdx ? ' active' : '');
    div.innerHTML = `
      <div class="scene-tag ${scene.tagClass || ''}">${scene.tag}</div>
      <h2 class="scene-title">${scene.title}</h2>
      ${scene.html}
    `;
    stage.appendChild(div);
  });

  renderProgress();
}

function renderProgress() {
  const scenes = state.tab === 'masechet' ? amudim[state.ref].scenes : tutorialScenes;
  const progressEl = document.getElementById('progress');
  const counterEl = document.getElementById('counter');

  progressEl.innerHTML = '';
  for (let i = 0; i < scenes.length; i++) {
    const dot = document.createElement('div');
    dot.className = 'dot' + (i === state.sceneIdx ? ' active' : '');
    dot.addEventListener('click', () => {
      state.sceneIdx = i;
      renderScenes();
    });
    progressEl.appendChild(dot);
  }

  counterEl.textContent = scenes.length > 1
    ? `${state.sceneIdx + 1} / ${scenes.length}`
    : '';

  document.getElementById('prevSceneBtn').disabled = state.sceneIdx === 0;
  document.getElementById('nextSceneBtn').disabled = state.sceneIdx === scenes.length - 1;
}

function renderAll() {
  if (state.tab === 'masechet') {
    renderHeader();
    renderActionBar();
  }
  renderScenes();
}

function switchTab(tab) {
  if (state.tab === tab) return;
  state.tab = tab;
  state.sceneIdx = 0;
  document.body.classList.toggle('tutorial-mode', tab === 'tutorial');
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', t.dataset.tab === tab);
  });
  renderAll();
  window.scrollTo(0, 0);
}

function changeScene(delta) {
  const scenes = state.tab === 'masechet' ? amudim[state.ref].scenes : tutorialScenes;
  const newIdx = state.sceneIdx + delta;
  if (newIdx < 0 || newIdx >= scenes.length) return;
  state.sceneIdx = newIdx;
  renderScenes();
}

// =======================================================
// MODAL
// =======================================================
function openModal(type) {
  const amud = amudim[state.ref];
  const entries = type === 'rashi' ? amud.rashi : amud.tosafot;
  if (entries.length === 0) return;

  state.modal = type;
  const modal = document.getElementById(type === 'rashi' ? 'rashiModal' : 'tosModal');
  const content = document.getElementById(type === 'rashi' ? 'rashiContent' : 'tosContent');

  content.innerHTML = '';
  entries.forEach(e => {
    const div = document.createElement('div');
    div.className = 'meforesh-entry';
    div.innerHTML = `
      <div class="meforesh-dh">${e.dh}</div>
      <div class="meforesh-content">${e.content}</div>
    `;
    content.appendChild(div);
  });

  document.getElementById('modalOverlay').classList.add('open');
  modal.classList.add('open');
}

function openTranslation() {
  const amud = amudim[state.ref];
  const trans = amud.translation || [];
  const content = document.getElementById('transContent');

  if (trans.length === 0) {
    content.innerHTML = `
      <div class="modal-empty">
        <div class="e-icon">📭</div>
        <p style="color: var(--parchment-dim); font-size: 14px;">תרגום עדיין לא נוסף לדף זה.<br>התשתית מוכנה — ניתן להוסיף תרגום בקובץ.</p>
      </div>
    `;
  } else {
    let html = '';
    trans.forEach(entry => {
      if (entry.type === 'section') {
        html += `<div class="trans-section-header">${entry.title}</div>`;
      } else if (entry.type === 'quote') {
        html += `
          <div class="trans-entry">
            <div class="trans-aram">${entry.aramaic}</div>
            <div class="trans-heb">${entry.translation}</div>
            ${entry.viz || ''}
          </div>
        `;
      } else if (entry.type === 'summary') {
        html += `<div class="trans-summary">${entry.text}${entry.viz || ''}</div>`;
      } else if (entry.type === 'note') {
        html += `<div class="trans-note">${entry.text}</div>`;
      }
    });
    content.innerHTML = html;
  }

  state.modal = 'trans';
  document.getElementById('modalOverlay').classList.add('open');
  document.getElementById('transModal').classList.add('open');
}

function closeModal() {
  state.modal = null;
  document.getElementById('modalOverlay').classList.remove('open');
  document.getElementById('rashiModal').classList.remove('open');
  document.getElementById('tosModal').classList.remove('open');
  document.getElementById('termModal').classList.remove('open');
  document.getElementById('transModal').classList.remove('open');
  document.getElementById('pickerModal').classList.remove('open');
}

// =======================================================
// DAF PICKER
// =======================================================
function openPicker() {
  const content = document.getElementById('pickerContent');
  content.innerHTML = '';

  perakim.forEach(perek => {
    const section = document.createElement('div');
    section.className = 'perek-section';

    const header = document.createElement('div');
    header.className = 'perek-header';
    header.textContent = `פרק ${perek.num} — ${perek.name}`;
    section.appendChild(header);

    const grid = document.createElement('div');
    grid.className = 'daf-grid';

    // Find range of dapim in this perek
    const perekIdx = perakim.indexOf(perek);
    const nextPerek = perakim[perekIdx + 1];
    const endDaf = nextPerek ? nextPerek.start : LAST_DAF + 1;
    const endAmud = nextPerek ? nextPerek.startAmud : 'b';

    // Iterate through dapim
    for (let d = perek.start; d < endDaf || (d === endDaf && nextPerek && nextPerek.startAmud === 'b'); d++) {
      const startA = (d === perek.start) ? perek.startAmud : 'a';
      const amudOpts = startA === 'b' ? ['b'] : ['a', 'b'];
      for (const a of amudOpts) {
        if (d === endDaf && nextPerek && a === nextPerek.startAmud) break;
        const ref = `${d}${a}`;
        if (!amudim[ref]) continue;
        const btn = document.createElement('button');
        btn.className = 'daf-btn';
        if (ref === state.ref) btn.classList.add('current');
        if (amudim[ref].scenes.length > 0 && amudim[ref].scenes[0].tag !== `פרק ${getPerekFor(d, a).num}`) {
          btn.classList.add('has-content');
        }
        // Show daf number with side
        btn.textContent = `${heb(d)}${a === 'a' ? '.' : ':'}`;
        btn.addEventListener('click', () => {
          goToRef(ref);
          closeModal();
        });
        grid.appendChild(btn);
      }
    }

    section.appendChild(grid);
    content.appendChild(section);
  });

  document.getElementById('modalOverlay').classList.add('open');
  document.getElementById('pickerModal').classList.add('open');
}

// =======================================================
// EVENT BINDINGS
// =======================================================
document.getElementById('prevDafBtn').addEventListener('click', () => {
  const idx = getCurrentIdx();
  if (idx > 0) goToRef(allRefs[idx - 1]);
});
document.getElementById('nextDafBtn').addEventListener('click', () => {
  const idx = getCurrentIdx();
  if (idx < allRefs.length - 1) goToRef(allRefs[idx + 1]);
});
document.getElementById('dafDisplay').addEventListener('click', openPicker);

// Tab switching
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => switchTab(tab.dataset.tab));
});

// Term modal for clickable Aramaic words in tutorial
document.addEventListener('click', (e) => {
  const term = e.target.closest('.term');
  if (term && term.dataset.term) {
    openTerm(term.dataset.term);
  }
});

function openTerm(key) {
  const t = terms[key];
  if (!t) return;
  const fnColors = {
    statement: { bg: 'rgba(232,183,109,0.2)', color: 'var(--gold-bright)' },
    question: { bg: 'rgba(193,74,90,0.2)', color: 'var(--crimson-glow)' },
    answer: { bg: 'rgba(136,178,122,0.2)', color: 'var(--sage-glow)' },
    source: { bg: 'rgba(127,179,213,0.2)', color: 'var(--sky-glow)' },
    distinction: { bg: 'rgba(176,143,196,0.2)', color: '#b08fc4' },
    conclusion: { bg: 'rgba(232,154,109,0.2)', color: 'var(--warm)' }
  };
  const c = fnColors[t.fn];

  document.getElementById('termContent').innerHTML = `
    <div class="modal-aram-big">${t.aram}</div>
    <div class="modal-pron">${t.pron}</div>
    <div class="modal-fn-badge" style="background: ${c.bg}; color: ${c.color};">${t.fnLabel}</div>
    <div class="modal-mean-text">${t.mean}</div>
    <div class="modal-use">${t.use}</div>
  `;

  state.modal = 'term';
  document.getElementById('modalOverlay').classList.add('open');
  document.getElementById('termModal').classList.add('open');
}

document.getElementById('prevSceneBtn').addEventListener('click', () => changeScene(-1));
document.getElementById('nextSceneBtn').addEventListener('click', () => changeScene(1));

document.getElementById('rashiBtn').addEventListener('click', () => openModal('rashi'));
document.getElementById('tosBtn').addEventListener('click', () => openModal('tos'));
document.getElementById('transBtn').addEventListener('click', () => openTranslation());

document.getElementById('modalOverlay').addEventListener('click', closeModal);
document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', closeModal));

document.addEventListener('keydown', (e) => {
  if (state.modal) {
    if (e.key === 'Escape') closeModal();
    return;
  }
  if (e.key === 'ArrowLeft') changeScene(1);
  if (e.key === 'ArrowRight') changeScene(-1);
});

// Touch swipe for scenes
let touchStartX = 0, touchStartY = 0, touchStartT = 0;
document.addEventListener('touchstart', (e) => {
  if (e.touches.length !== 1) return;
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
  touchStartT = Date.now();
}, { passive: true });

document.addEventListener('touchend', (e) => {
  if (state.modal) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  const dt = Date.now() - touchStartT;
  if (Math.abs(dx) > 80 && Math.abs(dx) > Math.abs(dy) * 2 && dt < 600) {
    if (dx > 0) changeScene(-1);
    else changeScene(1);
  }
}, { passive: true });

// URL hash for deep linking
function readHash() {
  const h = window.location.hash.slice(1);
  if (h === 'tutorial') {
    switchTab('tutorial');
    return;
  }
  if (h && amudim[h]) {
    state.tab = 'masechet';
    state.ref = h;
    renderAll();
  }
}
window.addEventListener('hashchange', readHash);
readHash();

// Initial render
renderAll();
</script>

</body>
</html>
