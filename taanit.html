<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>תענית — אנימציה לכל המסכת</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;700;900&family=Heebo:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1410;
    --ink-2: #221a14;
    --parchment: #f4ead5;
    --parchment-soft: #e8dcc0;
    --parchment-dim: #b8a888;
    --gold: #e8b76d;
    --gold-bright: #f5d39a;
    --gold-deep: #8a6638;
    --gold-shadow: #5a4220;
    --crimson: #c14a5a;
    --crimson-glow: #e87080;
    --sage: #88b27a;
    --sage-glow: #a5cc97;
    --sky: #7fb3d5;
    --sky-glow: #a5cce0;
    --warm: #e89a6d;
    --flame: #ff9844;
    --rashi: #c89568;
    --tosafot: #8fa9c4;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    background: var(--ink);
    color: var(--parchment);
    font-family: 'Heebo', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  body {
    background:
      radial-gradient(ellipse at 50% 0%, rgba(232,183,109,0.1) 0%, transparent 60%),
      linear-gradient(180deg, #1a1410 0%, #221a14 60%, #1a1410 100%);
    min-height: 100vh;
  }

  .app {
    max-width: 720px;
    margin: 0 auto;
    padding: 12px 16px 110px;
  }

  /* ===== Header with navigator ===== */
  header {
    text-align: center;
    padding: 8px 0 14px;
    border-bottom: 1px solid rgba(232,183,109,0.18);
    margin-bottom: 16px;
  }

  .masechet-name {
    font-size: 13px;
    color: var(--gold);
    letter-spacing: 0.2em;
    font-weight: 700;
  }

  .daf-nav {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 10px;
    align-items: center;
    margin-top: 10px;
  }

  .nav-arrow {
    background: rgba(232,183,109,0.15);
    border: 1px solid var(--gold);
    color: var(--gold-bright);
    width: 38px;
    height: 38px;
    border-radius: 50%;
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s, transform 0.15s;
  }
  .nav-arrow:active { transform: scale(0.92); }
  .nav-arrow:disabled { opacity: 0.3; }

  .daf-display {
    text-align: center;
    cursor: pointer;
  }
  .daf-display:active { opacity: 0.7; }

  .daf-display h1 {
    font-family: 'Frank Ruhl Libre', serif;
    font-weight: 900;
    font-size: clamp(18px, 5vw, 22px);
    color: var(--parchment);
  }

  .daf-display .perek-name {
    font-size: 11px;
    color: var(--parchment-dim);
    margin-top: 2px;
  }

  /* ===== Action bar (Translation/Rashi/Tosafot) ===== */
  .action-bar {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    margin-bottom: 16px;
  }

  .action-btn {
    padding: 12px 8px;
    border-radius: 10px;
    border: 1.5px solid;
    background: rgba(20,16,10,0.5);
    color: var(--parchment);
    font-family: 'Heebo', sans-serif;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    transition: background 0.2s, transform 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .action-btn:active { transform: scale(0.97); }

  .action-btn.trans {
    border-color: var(--gold);
    color: var(--gold-bright);
  }
  .action-btn.trans:hover { background: rgba(232,183,109,0.15); }

  .action-btn.rashi {
    border-color: var(--rashi);
    color: var(--rashi);
  }
  .action-btn.rashi:hover { background: rgba(200,149,104,0.15); }

  .action-btn.tos {
    border-color: var(--tosafot);
    color: var(--tosafot);
  }
  .action-btn.tos:hover { background: rgba(143,169,196,0.15); }

  .action-btn .count {
    background: rgba(0,0,0,0.3);
    padding: 2px 7px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 700;
  }

  .action-btn.disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  /* ===== Translation modal styling ===== */
  .modal.trans { border-top-color: var(--gold); }
  .modal.trans .modal-title { color: var(--gold-bright); }

  .trans-section-header {
    font-weight: 700;
    font-size: 15px;
    color: var(--gold);
    margin: 18px 0 10px;
    padding: 8px 12px;
    background: rgba(232,183,109,0.1);
    border-radius: 6px;
    text-align: center;
    letter-spacing: 0.02em;
  }

  .trans-section-header:first-child { margin-top: 0; }

  .trans-entry {
    margin-bottom: 12px;
    background: rgba(20,16,10,0.6);
    border-radius: 10px;
    padding: 12px 14px;
    border-right: 2px solid var(--gold-deep);
  }

  .trans-aram {
    font-family: 'Frank Ruhl Libre', serif;
    font-size: 17px;
    line-height: 1.85;
    color: var(--gold-bright);
    margin-bottom: 10px;
    padding-bottom: 10px;
    border-bottom: 1px dashed rgba(232,183,109,0.3);
  }

  .trans-heb {
    font-size: 14.5px;
    line-height: 1.75;
    color: var(--parchment-soft);
  }
  .trans-heb strong { color: var(--gold-bright); }

  .trans-summary {
    font-style: italic;
    font-size: 14px;
    color: var(--parchment-dim);
    padding: 10px 14px;
    background: rgba(232,183,109,0.04);
    border-radius: 8px;
    margin-bottom: 12px;
    border-right: 2px dashed var(--gold-deep);
    line-height: 1.65;
  }

  .trans-note {
    margin-top: 16px;
    padding: 10px 14px;
    background: rgba(127,179,213,0.06);
    border: 1px dashed var(--sky);
    border-radius: 8px;
    font-size: 12.5px;
    color: var(--parchment-dim);
    line-height: 1.6;
  }
  .trans-note strong { color: var(--sky-glow); }

  /* ===== Stage ===== */
  .stage { position: relative; min-height: 60vh; }
  .scene { display: none; }
  .scene.active {
    display: block;
    animation: gentleFade 0.3s ease-out both;
  }
  @keyframes gentleFade { from { opacity: 0; } to { opacity: 1; } }

  .scene-tag {
    display: inline-block;
    background: var(--gold-deep);
    color: var(--parchment);
    font-size: 12px;
    font-weight: 700;
    padding: 4px 12px;
    border-radius: 12px;
    margin-bottom: 12px;
  }
  .scene-tag.q { background: var(--crimson); }
  .scene-tag.a { background: var(--sage); color: var(--ink); }
  .scene-tag.surprise { background: var(--flame); color: var(--ink); }

  .scene-title {
    font-family: 'Heebo', sans-serif;
    font-weight: 900;
    font-size: clamp(20px, 5.4vw, 26px);
    color: var(--gold-bright);
    margin-bottom: 12px;
    line-height: 1.25;
  }
  .scene-title .accent { color: var(--parchment); }
  .scene-title .flame-c { color: var(--flame); }
  .scene-title .water-c { color: var(--sky-glow); }

  .story {
    font-size: 16px;
    line-height: 1.8;
    color: var(--parchment-soft);
    margin-bottom: 12px;
  }
  .story p { margin-bottom: 11px; }
  .story strong { color: var(--gold-bright); font-weight: 700; }
  .story em { color: var(--parchment); background: rgba(232,183,109,0.1); padding: 0 4px; border-radius: 3px; font-style: normal; }

  .pic {
    margin: 14px 0;
    padding: 14px 10px;
    background: radial-gradient(ellipse at center, rgba(232,183,109,0.08), transparent 75%);
    border-radius: 12px;
    text-align: center;
  }
  .pic svg { max-width: 100%; height: auto; }
  .pic-caption {
    font-size: 12px;
    color: var(--gold);
    margin-top: 6px;
    font-weight: 500;
  }

  .bubble {
    background: rgba(232,183,109,0.1);
    border: 2px solid var(--gold);
    border-radius: 14px;
    padding: 12px 14px;
    margin: 12px 0;
    font-size: 15px;
    line-height: 1.7;
    color: var(--parchment);
  }
  .bubble.question { border-color: var(--crimson); background: rgba(193,74,90,0.08); }
  .bubble.answer { border-color: var(--sage); background: rgba(136,178,122,0.08); }
  .bubble.surprise { border-color: var(--flame); background: rgba(255,152,68,0.1); }

  .bubble-label {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 10px;
    margin-bottom: 6px;
    background: var(--gold);
    color: var(--ink);
  }
  .bubble.question .bubble-label { background: var(--crimson); color: var(--parchment); }
  .bubble.answer .bubble-label { background: var(--sage); color: var(--ink); }
  .bubble.surprise .bubble-label { background: var(--flame); color: var(--ink); }

  .keyidea {
    background: linear-gradient(135deg, rgba(232,183,109,0.12), rgba(232,183,109,0.04));
    border: 2px dashed var(--gold);
    border-radius: 12px;
    padding: 12px 14px;
    margin: 12px 0;
    text-align: center;
  }
  .keyidea-label {
    font-size: 12px;
    color: var(--gold-bright);
    font-weight: 700;
    letter-spacing: 0.1em;
    margin-bottom: 6px;
  }
  .keyidea p { font-size: 15px; line-height: 1.6; color: var(--parchment); }
  .keyidea strong { color: var(--gold-bright); }

  /* List items */
  .m-item {
    display: grid;
    grid-template-columns: 28px 32px 1fr;
    gap: 10px;
    align-items: center;
    padding: 10px 12px;
    background: rgba(20,16,10,0.4);
    border-right: 2px solid var(--gold);
    border-radius: 4px;
    margin-bottom: 6px;
  }
  .m-item .m-num { font-size: 13px; color: var(--gold); text-align: center; font-weight: 700; }
  .m-item svg { width: 28px; height: 28px; color: var(--gold); }
  .m-name { font-weight: 700; font-size: 15px; color: var(--parchment); }
  .m-note { font-size: 11.5px; color: var(--parchment-dim); margin-top: 2px; }

  .vs-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin: 12px 0;
  }
  .vs-card { padding: 10px; border-radius: 10px; text-align: center; }
  .vs-card.a { background: rgba(232,183,109,0.1); border: 1.5px solid var(--gold); }
  .vs-card.b { background: rgba(127,179,213,0.1); border: 1.5px solid var(--sky); }
  .vs-card .emoji { font-size: 26px; margin-bottom: 4px; }
  .vs-card h5 { font-size: 14px; font-weight: 700; margin-bottom: 3px; }
  .vs-card.a h5 { color: var(--gold-bright); }
  .vs-card.b h5 { color: var(--sky-glow); }
  .vs-card p { font-size: 12.5px; color: var(--parchment-soft); line-height: 1.5; }

  .sage-quote {
    background: rgba(20,16,10,0.5);
    border-left: 3px solid var(--gold-bright);
    border-radius: 4px;
    padding: 10px 12px;
    margin: 10px 0;
  }
  .sage-quote .sage-name { font-weight: 700; color: var(--gold-bright); font-size: 13px; margin-bottom: 4px; }
  .sage-quote p { font-size: 14px; line-height: 1.6; color: var(--parchment); }

  /* ===== Empty state for stubs ===== */
  .stub {
    text-align: center;
    padding: 50px 20px;
  }
  .stub-icon { font-size: 56px; margin-bottom: 14px; opacity: 0.5; }
  .stub h3 {
    font-family: 'Heebo', sans-serif;
    font-weight: 700;
    font-size: 22px;
    color: var(--gold-bright);
    margin-bottom: 8px;
  }
  .stub p {
    color: var(--parchment-dim);
    font-size: 15px;
    line-height: 1.6;
    max-width: 360px;
    margin: 0 auto 20px;
  }
  .stub .stub-perek {
    background: rgba(232,183,109,0.08);
    border: 1px solid rgba(232,183,109,0.25);
    padding: 12px 16px;
    border-radius: 8px;
    display: inline-block;
    margin-top: 10px;
  }
  .stub .stub-perek-label {
    font-size: 11px;
    color: var(--gold);
    letter-spacing: 0.2em;
    margin-bottom: 4px;
  }
  .stub .stub-perek-name {
    font-size: 16px;
    color: var(--parchment);
    font-weight: 700;
  }

  /* ===== Modal ===== */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 50;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
  }
  .modal-overlay.open {
    opacity: 1;
    pointer-events: auto;
  }

  .modal {
    position: fixed;
    bottom: 0;
    right: 0;
    left: 0;
    max-height: 90vh;
    background: var(--ink-2);
    border-top: 2px solid;
    border-radius: 18px 18px 0 0;
    z-index: 51;
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.2, 0.7, 0.2, 1);
    display: flex;
    flex-direction: column;
  }
  .modal.open { transform: translateY(0); }
  .modal.rashi { border-top-color: var(--rashi); }
  .modal.tos { border-top-color: var(--tosafot); }

  .modal-handle {
    width: 40px;
    height: 4px;
    background: rgba(232,183,109,0.4);
    border-radius: 2px;
    margin: 10px auto 0;
  }

  .modal-header {
    padding: 12px 18px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid rgba(232,183,109,0.15);
  }
  .modal-title {
    font-family: 'Heebo', sans-serif;
    font-weight: 900;
    font-size: 20px;
  }
  .modal.rashi .modal-title { color: var(--rashi); }
  .modal.tos .modal-title { color: var(--tosafot); }

  .modal-close {
    background: rgba(232,183,109,0.15);
    border: none;
    color: var(--parchment);
    width: 32px;
    height: 32px;
    border-radius: 50%;
    font-size: 16px;
    cursor: pointer;
  }
  .modal-close:active { transform: scale(0.92); }

  .modal-content {
    overflow-y: auto;
    padding: 16px 18px 24px;
    flex: 1;
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
  }

  .meforesh-entry {
    padding: 12px 14px;
    background: rgba(20,16,10,0.5);
    border-radius: 10px;
    margin-bottom: 10px;
  }
  .modal.rashi .meforesh-entry { border-right: 3px solid var(--rashi); }
  .modal.tos .meforesh-entry { border-right: 3px solid var(--tosafot); }

  .meforesh-dh {
    display: inline-block;
    font-weight: 700;
    font-size: 14px;
    padding: 3px 10px;
    border-radius: 6px;
    margin-bottom: 8px;
  }
  .modal.rashi .meforesh-dh { background: var(--rashi); color: var(--ink); }
  .modal.tos .meforesh-dh { background: var(--tosafot); color: var(--ink); }

  .meforesh-content {
    font-size: 14.5px;
    line-height: 1.7;
    color: var(--parchment-soft);
  }
  .meforesh-content p { margin-bottom: 10px; }
  .meforesh-content p:last-child { margin-bottom: 0; }
  .meforesh-content strong { color: var(--gold-bright); }
  .meforesh-content em { color: var(--parchment); background: rgba(232,183,109,0.08); padding: 0 3px; border-radius: 2px; font-style: normal; }

  /* ===== Kushya animated diagrams (תוספות) ===== */
  .kviz {
    margin: 2px 0 16px;
    padding: 11px 10px 9px;
    background: linear-gradient(180deg, rgba(143,169,196,0.12), rgba(20,16,10,0.45));
    border: 1px solid rgba(143,169,196,0.4);
    border-radius: 12px;
    overflow: hidden;
  }
  .kviz-head {
    font-size: 12px; font-weight: 700; color: var(--tosafot);
    margin-bottom: 8px; display: flex; align-items: center; gap: 5px;
  }
  .kviz-stage {
    position: relative; display: flex; align-items: center; justify-content: center;
    gap: 9px; flex-wrap: wrap; min-height: 86px; padding: 8px 2px 2px;
  }
  .kviz-cap {
    font-size: 12px; color: var(--gold); text-align: center;
    margin-top: 9px; font-weight: 500; line-height: 1.55;
  }
  .kviz-cap strong { color: var(--gold-bright); }
  .knode {
    position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px;
    background: rgba(244,234,213,0.06); border: 1.5px solid var(--parchment-dim);
    border-radius: 10px; padding: 7px 9px; min-width: 54px;
    font-size: 11px; font-weight: 600; color: var(--parchment-soft); text-align: center; line-height: 1.3;
  }
  .knode .kemoji { font-size: 22px; line-height: 1; }
  .knode.good { border-color: var(--sage); color: var(--sage-glow); background: rgba(136,178,122,0.13); }
  .knode.bad  { border-color: var(--crimson); color: var(--crimson-glow); background: rgba(193,74,90,0.13); }
  .knode.gold { border-color: var(--gold); color: var(--gold-bright); background: rgba(232,183,109,0.13); }
  .karrow { color: var(--gold); font-size: 22px; font-weight: 700; }
  .kverdict {
    position: absolute; top: -9px; left: -9px; width: 22px; height: 22px;
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 800; opacity: 0; z-index: 3;
  }
  .kverdict.good { background: var(--sage); color: var(--ink); }
  .kverdict.bad  { background: var(--crimson); color: #fff; }
  .ktag { font-size: 10px; font-weight: 800; padding: 2px 7px; border-radius: 20px; }
  .ktag.red   { background: var(--crimson); color: #fff; }
  .ktag.green { background: var(--sage); color: var(--ink); }
  .kstamp {
    position: absolute; top: -13px; left: 50%; background: var(--crimson); color: #fff;
    font-size: 10px; font-weight: 800; padding: 3px 8px; border-radius: 6px;
    box-shadow: 0 2px 6px rgba(0,0,0,.45); white-space: nowrap; z-index: 3;
  }
  .kbar {
    position: relative; width: 86%; height: 34px; border: 1.5px solid var(--gold);
    border-radius: 8px; overflow: hidden; background: rgba(244,234,213,0.05);
  }
  .kbar-fill {
    position: absolute; top: 0; right: 0; height: 100%; width: 0;
    background: linear-gradient(270deg, var(--crimson), var(--crimson-glow)); opacity: .55;
  }
  .kbar-lbl { position: absolute; top: 50%; transform: translateY(-50%); font-size: 11px; font-weight: 700; color: var(--parchment); z-index: 2; }
  .kchip { font-size: 11px; font-weight: 700; padding: 4px 9px; border-radius: 8px; }
  .kchip.ok { background: rgba(136,178,122,0.18); color: var(--sage-glow); border: 1px solid var(--sage); animation: kFade 3.5s ease-in-out infinite; }
  .kchip.no { background: rgba(193,74,90,0.18); color: var(--crimson-glow); border: 1px solid var(--crimson); }
  .kdots { display: inline-flex; gap: 4px; }
  .kd { width: 11px; height: 11px; border-radius: 50%; border: 1.5px solid var(--parchment-dim); background: transparent; display: inline-block; }
  .kd.on { background: var(--crimson); border-color: var(--crimson); }
  .trans-entry .kviz { margin: 12px 0 2px; }
  .trans-summary .kviz { margin: 12px 0 0; }

  @keyframes kFade   { 0%,15%{opacity:0} 35%,100%{opacity:1} }
  @keyframes kPulse  { 0%,100%{transform:scale(1)} 50%{transform:scale(1.13)} }
  @keyframes kFloatUp{ 0%,30%{transform:translateY(0);opacity:1} 75%{transform:translateY(-34px);opacity:0} 100%{opacity:0} }
  @keyframes kShake  { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-4px)} 50%{transform:translateX(4px)} 75%{transform:translateX(-3px)} }
  @keyframes kBleed  { 0%,18%{width:0} 68%,100%{width:100%} }
  @keyframes kAppear { 0%,50%{opacity:0;transform:scale(.4)} 66%{opacity:1;transform:scale(1.25)} 80%,100%{opacity:1;transform:scale(1)} }
  @keyframes kFlash  { 0%,100%{opacity:.25} 50%{opacity:1} }
  @keyframes kStampC { 0%,40%{transform:translateX(-50%) translateY(-22px) scale(1.5);opacity:0} 56%{transform:translateX(-50%) translateY(0) scale(1);opacity:1} 70%{transform:translateX(-50%) scale(1.12)} 85%,100%{transform:translateX(-50%) scale(1);opacity:1} }

  .modal-empty {
    text-align: center;
    padding: 30px 20px;
    color: var(--parchment-dim);
  }
  .modal-empty .e-icon { font-size: 36px; margin-bottom: 10px; opacity: 0.5; }

  /* ===== Daf picker modal ===== */
  .picker-modal {
    position: fixed;
    inset: 0;
    background: var(--ink-2);
    z-index: 60;
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.2, 0.7, 0.2, 1);
    display: flex;
    flex-direction: column;
  }
  .picker-modal.open { transform: translateY(0); }

  .picker-header {
    padding: 14px 18px;
    border-bottom: 1px solid rgba(232,183,109,0.15);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .picker-title {
    font-weight: 700;
    font-size: 17px;
    color: var(--gold-bright);
  }

  .picker-content {
    overflow-y: auto;
    padding: 14px 18px 24px;
    flex: 1;
  }

  .perek-section {
    margin-bottom: 16px;
  }

  .perek-header {
    font-weight: 700;
    font-size: 14px;
    color: var(--gold);
    margin-bottom: 8px;
    padding: 0 4px;
  }

  .daf-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(58px, 1fr));
    gap: 6px;
  }

  .daf-btn {
    padding: 10px 4px;
    background: rgba(20,16,10,0.5);
    border: 1px solid rgba(232,183,109,0.2);
    border-radius: 6px;
    color: var(--parchment);
    font-family: 'Heebo', sans-serif;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    text-align: center;
    transition: background 0.2s;
  }
  .daf-btn:active { transform: scale(0.95); }
  .daf-btn.current {
    background: var(--gold);
    color: var(--ink);
    border-color: var(--gold);
  }
  .daf-btn.has-content::after {
    content: "•";
    display: block;
    color: var(--sage-glow);
    font-size: 11px;
    margin-top: -2px;
  }

  /* ===== Bottom navigation ===== */
  .nav {
    position: fixed;
    bottom: 0;
    right: 0;
    left: 0;
    background: linear-gradient(180deg, transparent, var(--ink) 40%);
    padding: 22px 18px 18px;
    z-index: 10;
  }

  .nav-inner {
    max-width: 720px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 12px;
    align-items: center;
  }

  .nav-btn {
    background: var(--gold);
    color: var(--ink);
    border: none;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    font-size: 20px;
    cursor: pointer;
    transition: background 0.2s, transform 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    box-shadow: 0 4px 14px rgba(0,0,0,0.4);
  }
  .nav-btn:active { transform: scale(0.92); }
  .nav-btn:disabled { opacity: 0.3; }

  .progress {
    display: flex;
    gap: 5px;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
  }
  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: rgba(232,183,109,0.3);
    transition: background 0.25s, width 0.25s, border-radius 0.25s;
    cursor: pointer;
  }
  .dot.active {
    background: var(--gold);
    width: 20px;
    border-radius: 4px;
  }

  .scene-counter {
    text-align: center;
    font-size: 11px;
    color: var(--parchment-dim);
    margin-top: 10px;
  }

  /* ===== Tabs ===== */
  .tabs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin-top: 12px;
    padding: 4px;
    background: rgba(20,16,10,0.5);
    border-radius: 12px;
    border: 1px solid rgba(232,183,109,0.18);
  }

  .tab {
    padding: 10px 8px;
    background: transparent;
    border: none;
    color: var(--parchment-dim);
    font-family: 'Heebo', sans-serif;
    font-weight: 700;
    font-size: 14px;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.25s, color 0.25s;
  }
  .tab:active { transform: scale(0.97); }
  .tab.active {
    background: var(--gold-deep);
    color: var(--parchment);
  }

  /* Hide masechet-only sections when in tutorial mode */
  body.tutorial-mode .masechet-only { display: none; }

  /* ===== Tutorial: terms (clickable Aramaic) ===== */
  .term {
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 5px;
    transition: background 0.2s;
    border-bottom: 2px dotted;
    display: inline-block;
  }
  .term.statement { background: rgba(232,183,109,0.15); border-color: var(--gold); color: var(--gold-bright); }
  .term.question { background: rgba(193,74,90,0.15); border-color: var(--crimson); color: var(--crimson-glow); }
  .term.answer { background: rgba(136,178,122,0.15); border-color: var(--sage); color: var(--sage-glow); }
  .term.source { background: rgba(127,179,213,0.15); border-color: var(--sky); color: var(--sky-glow); }
  .term.distinction { background: rgba(176,143,196,0.15); border-color: #b08fc4; color: #b08fc4; }
  .term.conclusion { background: rgba(232,154,109,0.15); border-color: var(--warm); color: var(--warm); }
  .term:active { transform: scale(0.95); }

  /* ===== Tutorial: gemara text block ===== */
  .gem-block {
    background: rgba(244,234,213,0.04);
    border: 1px solid rgba(232,183,109,0.25);
    border-radius: 10px;
    padding: 14px 16px;
    margin: 12px 0;
    font-family: 'Frank Ruhl Libre', serif;
    font-size: 18px;
    line-height: 2;
    color: var(--parchment);
  }

  /* ===== Tutorial: step-by-step ===== */
  .step {
    display: grid;
    grid-template-columns: 32px 1fr;
    gap: 12px;
    margin-bottom: 10px;
    padding: 12px 14px;
    background: rgba(20,16,10,0.5);
    border-radius: 10px;
    border-right: 3px solid var(--gold);
  }
  .step-num {
    font-weight: 700;
    color: var(--gold);
    font-size: 16px;
    text-align: center;
    padding-top: 2px;
  }
  .step-aram {
    font-family: 'Frank Ruhl Libre', serif;
    font-size: 17px;
    color: var(--gold-bright);
    font-weight: 700;
    margin-bottom: 4px;
  }
  .step-trans {
    font-size: 13px;
    color: var(--parchment-soft);
    margin-bottom: 6px;
  }
  .step-fn {
    display: inline-block;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 4px;
    margin-bottom: 6px;
    font-weight: 700;
  }
  .step-fn.statement { background: rgba(232,183,109,0.2); color: var(--gold-bright); }
  .step-fn.question { background: rgba(193,74,90,0.2); color: var(--crimson-glow); }
  .step-fn.answer { background: rgba(136,178,122,0.2); color: var(--sage-glow); }
  .step-fn.source { background: rgba(127,179,213,0.2); color: var(--sky-glow); }
  .step-fn.distinction { background: rgba(176,143,196,0.2); color: #b08fc4; }
  .step-fn.conclusion { background: rgba(232,154,109,0.2); color: var(--warm); }
  .step-expl {
    font-size: 14px;
    color: var(--parchment-soft);
    line-height: 1.6;
    margin-top: 4px;
  }
  .step-expl strong { color: var(--gold-bright); }
  .step-expl em { color: var(--parchment); font-style: normal; }

  /* ===== Tutorial: vocab cards ===== */
  .vocab-card {
    background: rgba(20,16,10,0.4);
    border: 1px solid rgba(232,183,109,0.2);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 10px;
  }
  .vocab-aram {
    font-family: 'Frank Ruhl Libre', serif;
    font-size: 20px;
    font-weight: 700;
    color: var(--gold-bright);
    margin-bottom: 4px;
  }
  .vocab-pron {
    font-size: 11px;
    color: var(--parchment-dim);
    font-style: italic;
    margin-bottom: 6px;
  }
  .vocab-mean {
    font-size: 14.5px;
    color: var(--parchment);
    margin-bottom: 6px;
  }
  .vocab-fn {
    font-size: 12px;
    color: var(--gold);
    font-weight: 700;
  }
  .vocab-example {
    margin-top: 8px;
    padding: 8px 10px;
    background: rgba(244,234,213,0.04);
    border-right: 2px solid var(--gold);
    border-radius: 4px;
    font-size: 13px;
    line-height: 1.6;
  }
  .vocab-example em {
    font-family: 'Frank Ruhl Libre', serif;
    color: var(--gold-bright);
    font-weight: 700;
    font-style: normal;
  }

  /* ===== Tutorial: patterns ===== */
  .pattern {
    background: rgba(232,183,109,0.05);
    border-radius: 10px;
    padding: 12px;
    margin: 12px 0;
  }
  .pattern-title {
    font-weight: 700;
    font-size: 14px;
    color: var(--gold-bright);
    margin-bottom: 8px;
  }
  .pattern-flow {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .pattern-step {
    display: grid;
    grid-template-columns: 32px 1fr;
    gap: 10px;
    align-items: center;
    padding: 7px 10px;
    border-radius: 6px;
  }
  .pattern-step.q { background: rgba(193,74,90,0.1); border-right: 2px solid var(--crimson); }
  .pattern-step.a { background: rgba(136,178,122,0.1); border-right: 2px solid var(--sage); }
  .pattern-step.s { background: rgba(127,179,213,0.1); border-right: 2px solid var(--sky); }
  .pattern-step.d { background: rgba(176,143,196,0.1); border-right: 2px solid #b08fc4; }
  .pattern-step .p-icon { font-size: 16px; text-align: center; }
  .pattern-step .p-label {
    font-size: 12.5px;
    font-weight: 700;
    color: var(--parchment);
  }
  .pattern-step .p-label small {
    display: block;
    font-weight: 400;
    font-size: 11px;
    color: var(--parchment-dim);
    margin-top: 2px;
  }
  .pattern-arrow {
    text-align: center;
    color: var(--gold);
    font-size: 11px;
  }

  /* ===== Tutorial: tip box ===== */
  .tip {
    background: linear-gradient(135deg, rgba(232,183,109,0.12), rgba(232,183,109,0.04));
    border: 1px dashed var(--gold);
    border-radius: 10px;
    padding: 12px 14px;
    margin: 12px 0;
  }
  .tip-label {
    font-size: 12px;
    color: var(--gold-bright);
    font-weight: 700;
    letter-spacing: 0.1em;
    margin-bottom: 6px;
  }
  .tip p {
    font-size: 14.5px;
    line-height: 1.65;
    color: var(--parchment-soft);
  }

  /* ===== Tutorial: legend ===== */
  .legend {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin: 10px 0;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    padding: 7px 9px;
    border-radius: 6px;
  }
  .legend-item .l-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .legend-item.statement { background: rgba(232,183,109,0.08); }
  .legend-item.statement .l-dot { background: var(--gold); }
  .legend-item.question { background: rgba(193,74,90,0.08); }
  .legend-item.question .l-dot { background: var(--crimson); }
  .legend-item.answer { background: rgba(136,178,122,0.08); }
  .legend-item.answer .l-dot { background: var(--sage); }
  .legend-item.source { background: rgba(127,179,213,0.08); }
  .legend-item.source .l-dot { background: var(--sky); }
  .legend-item.distinction { background: rgba(176,143,196,0.08); }
  .legend-item.distinction .l-dot { background: #b08fc4; }
  .legend-item.conclusion { background: rgba(232,154,109,0.08); }
  .legend-item.conclusion .l-dot { background: var(--warm); }

  /* ===== Term modal ===== */
  .modal.term { border-top-color: var(--gold); }
  .modal.term .modal-title { color: var(--gold-bright); }

  .modal-aram-big {
    font-family: 'Frank Ruhl Libre', serif;
    font-size: 28px;
    font-weight: 700;
    color: var(--gold-bright);
    margin-bottom: 6px;
  }
  .modal-pron {
    font-size: 11px;
    color: var(--parchment-dim);
    font-style: italic;
    margin-bottom: 10px;
  }
  .modal-fn-badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 700;
    margin-bottom: 10px;
  }
  .modal-mean-text {
    font-size: 15px;
    color: var(--parchment);
    margin-bottom: 12px;
    line-height: 1.6;
  }
  .modal-use {
    font-size: 14px;
    line-height: 1.7;
    color: var(--parchment-soft);
  }
  .modal-use strong { color: var(--gold-bright); }
  .modal-use em { color: var(--parchment); font-style: normal; }

  /* ===== Kid-friendly explanation boxes ===== */
  .kid-box {
    margin: 14px 0;
    padding: 14px 16px;
    border-radius: 14px;
    border-right: 4px solid;
  }
  .kid-box.setup { background: rgba(232,183,109,0.1); border-color: var(--gold); }
  .kid-box.question { background: rgba(193,74,90,0.1); border-color: var(--crimson); }
  .kid-box.answer { background: rgba(136,178,122,0.1); border-color: var(--sage); }
  .kid-box.bigidea { background: rgba(127,179,213,0.1); border-color: var(--sky); }
  .kid-box.surprise { background: rgba(255,152,68,0.1); border-color: var(--flame); }

  .kid-box .kid-icon {
    font-size: 36px;
    line-height: 1;
    margin-bottom: 6px;
  }
  .kid-box .kid-label {
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 10px;
    letter-spacing: 0.05em;
  }
  .kid-box.setup .kid-label { color: var(--gold-bright); }
  .kid-box.question .kid-label { color: var(--crimson-glow); }
  .kid-box.answer .kid-label { color: var(--sage-glow); }
  .kid-box.bigidea .kid-label { color: var(--sky-glow); }
  .kid-box.surprise .kid-label { color: var(--flame); }

  .kid-box p {
    font-size: 16px;
    line-height: 1.8;
    color: var(--parchment);
    margin-bottom: 10px;
  }
  .kid-box p:last-child { margin-bottom: 0; }
  .kid-box strong { color: var(--gold-bright); }
  .kid-box em { color: var(--parchment-soft); font-style: italic; }

  @keyframes flicker { 0%, 100% { opacity: 0.7; } 50% { opacity: 1; } }
  .flame-anim { animation: flicker 2s ease-in-out infinite; }

  @media (max-width: 380px) {
    .vs-grid { grid-template-columns: 1fr; }
    .action-btn { font-size: 13px; padding: 10px 8px; }
  }

  /* ===== Taanit additions ===== */
  .nl-pt.first { transform: translateX(0); text-align: right; }
  .nl-pt.first::before { right: 6px; transform: none; }
  .day-strip { display: flex; gap: 3px; direction: ltr; flex-direction: row-reverse; }
  .ds-d { width: 38px; padding: 5px 0; border-radius: 7px; text-align: center; font-size: 12px; font-weight: 800;
    background: rgba(127,179,213,0.15); color: var(--sky-glow); animation: kFade 4s infinite both; }
  .ds-d span { display: block; font-size: 13px; }
  .ds-d.edge { background: rgba(232,183,109,0.3); color: var(--gold-bright); }
  .map-table { display: grid; grid-template-columns: 58px 1fr 1fr 52px; gap: 4px; font-size: 11.5px; line-height: 1.45; margin: 10px 0; }
  .mt-h { font-weight: 800; color: var(--gold); padding: 4px 2px; }
  .mt-n { font-weight: 800; color: var(--gold-bright); padding: 6px 2px; }
  .mt-c { background: rgba(244,234,213,0.05); border-radius: 6px; padding: 6px; color: var(--parchment-soft); min-width: 0; }
  .mt-c.no { color: var(--crimson-glow); text-align: center; }
  .mt-c.ok { color: var(--sage-glow); text-align: center; background: rgba(136,178,122,0.15); }

  .daf-src { margin: 4px 0 16px; border: 1px solid rgba(232,183,109,0.35); border-radius: 12px; overflow: hidden; background: #efe9dc; }
  .daf-src figcaption { font-size: 12px; font-weight: 700; color: var(--gold-bright); background: var(--ink-2); padding: 7px 10px; }
  .daf-src figcaption span { font-weight: 400; color: var(--parchment-dim); }
  .daf-src img { display: block; width: 100%; height: auto; cursor: zoom-in; }
  .photo-btn { width: 100%; margin-bottom: 12px; padding: 11px; border-radius: 10px; border: 1px solid var(--gold);
    background: rgba(232,183,109,0.12); color: var(--gold-bright); font-family: inherit; font-weight: 700; font-size: 14px; cursor: pointer; }
  .photo-overlay { position: fixed; inset: 0; z-index: 80; background: rgba(10,8,6,0.96); display: none; flex-direction: column; }
  .photo-overlay.open { display: flex; }
  .po-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; color: var(--gold-bright); font-weight: 700; }
  .po-scroll { flex: 1; overflow: auto; padding: 0 8px 20px; }
  .po-wrap { position: relative; width: 100%; max-width: 720px; margin: 0 auto; }
  .po-wrap.zoom { width: 230%; max-width: none; }
  .po-hint { text-align: center; font-size: 12px; color: var(--parchment-dim); padding: 6px 0 calc(8px + env(safe-area-inset-bottom, 0px)); }
  .po-wrap img { display: block; width: 100%; height: auto; border-radius: 6px; }
  .po-all { position: absolute; border: 2px dashed rgba(136,178,122,0.9); background: rgba(136,178,122,0.10); border-radius: 4px; }
  .po-all span { position: absolute; top: 2px; right: 2px; background: var(--sage); color: var(--ink); font-size: 11px; font-weight: 800;
    border-radius: 9px; padding: 0 6px; }
  .po-mark { position: absolute; border: 3px solid var(--flame); border-radius: 6px; background: rgba(255,152,68,0.18);
    box-shadow: 0 0 0 9999px rgba(0,0,0,0.35); animation: kFlash 2s infinite; }
  .quiz { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
  .quiz-q { background: rgba(244,234,213,0.05); border: 1px solid rgba(232,183,109,0.25); border-radius: 10px; padding: 10px 12px; }
  .quiz-q summary { cursor: pointer; font-weight: 700; color: var(--gold-bright); font-size: 14px; list-style: none; }
  .quiz-q summary::before { content: "❓ "; }
  .quiz-q[open] summary::before { content: "✅ "; }
  .quiz-a { margin-top: 8px; font-size: 14px; line-height: 1.7; color: var(--parchment-soft); }
  .sflow { display: flex; flex-direction: column; gap: 6px; margin: 12px 0; }
  .sf-step { display: flex; gap: 10px; align-items: flex-start; padding: 9px 11px; border-radius: 10px;
    background: rgba(244,234,213,0.05); border-right: 3px solid var(--sky); font-size: 14px; line-height: 1.65; }
  .sf-step.bad { border-right-color: var(--crimson); }
  .sf-step.hl { border-right-color: var(--gold); background: rgba(232,183,109,0.1); }
  .sf-who { flex: 0 0 74px; font-weight: 800; color: var(--gold); font-size: 12px; padding-top: 2px; }
  .sf-txt { flex: 1; min-width: 0; }
  .pray-grid, .rain-table { display: grid; gap: 4px; width: 100%; font-size: 11px; text-align: center; }
  .pray-grid { grid-template-columns: 52px repeat(4, 1fr); }
  .rain-table { grid-template-columns: 58px repeat(3, 1fr); }
  .pg-h, .rt-h { font-weight: 800; color: var(--gold); padding: 3px 0; }
  .rt-h small { font-weight: 500; color: var(--parchment-dim); }
  .pg-n, .rt-n { font-weight: 800; color: var(--parchment-soft); display: flex; align-items: center; }
  .pg-c, .rt-c { border-radius: 6px; padding: 6px 2px; font-weight: 700; background: rgba(244,234,213,0.06); }
  .pg-c.on { background: rgba(136,178,122,0.25); color: var(--sage-glow); animation: kFade 3.5s infinite; }
  .pg-c.off { background: rgba(193,74,90,0.18); color: var(--crimson-glow); }
  .rt-c.hl { background: rgba(232,183,109,0.25); color: var(--gold-bright); animation: kPulse 2.5s infinite; }
  .ladder { display: flex; flex-direction: column; gap: 4px; margin: 12px 0; }
  .ld-step { font-size: 13px; font-weight: 600; padding: 7px 10px; border-radius: 8px;
    margin-right: calc(var(--i) * 12px); color: var(--parchment);
    background: rgba(193,74,90, calc(0.08 + var(--i) * 0.07)); border: 1px solid rgba(193,74,90,0.35);
    animation: gentleFade .6s both; animation-delay: calc(var(--i) * .25s); }
  .ld-step b { display: inline-block; width: 20px; color: var(--gold); }
  .ld-step span { color: var(--parchment-dim); font-weight: 400; }
  .stalk-cmp { display: flex; gap: 40px; align-items: flex-end; justify-content: center; height: 110px; }
  .sc-col { display: flex; flex-direction: column; align-items: center; font-size: 11px; font-weight: 700; color: var(--parchment-soft); }
  .sc-ear { width: 16px; border-radius: 8px 8px 4px 4px; background: var(--gold); }
  .sc-stem { width: 4px; background: var(--sage); margin-bottom: 4px; }
  .sc-col.miracle .sc-ear { animation: kPulse 2.5s infinite; background: var(--gold-bright); }
  .throat { position: relative; display: flex; gap: 14px; justify-content: center; height: 100px; width: 200px; }
  .th-tube { width: 64px; border-radius: 10px 10px 4px 4px; display: flex; align-items: flex-end; justify-content: center;
    font-size: 11px; font-weight: 700; padding-bottom: 6px; text-align: center; }
  .th-tube.trachea { background: rgba(127,179,213,0.22); border: 1.5px solid var(--sky); color: var(--sky-glow); }

<script>
// =======================================================
// PEREK DATA — מסכת תענית
// =======================================================
const perakim = [
  { num: 1, name: 'מאימתי', start: 2, startAmud: 'a' },
  { num: 2, name: 'סדר תעניות כיצד', start: 15, startAmud: 'a' },
  { num: 3, name: 'סדר תעניות אלו', start: 18, startAmud: 'b' },
  { num: 4, name: 'בשלשה פרקים', start: 26, startAmud: 'a' }
];

function getPerekFor(daf, amud) {
  const pos = (d, a) => d * 2 + (a === 'b' ? 1 : 0);
  const target = pos(daf, amud);
  let p = perakim[0];
  for (const perek of perakim) {
    if (pos(perek.start, perek.startAmud) <= target) p = perek;
    else break;
  }
  return p;
}

// =======================================================
// AMUDIM DATA — stubs for 2a..31a, then override
// =======================================================
const amudim = {};
for (let d = 2; d <= 31; d++) {
  for (const a of ['a', 'b']) {
    if (d === 31 && a === 'b') continue; // המסכת מסתיימת בל״א.
    amudim[`${d}${a}`] = { daf: d, amud: a, scenes: [], rashi: [], tosafot: [] };
  }
}

// ---------- helpers for building scenes ----------
const kv = (head, stage, cap, stageStyle) => `
  <div class="kviz">
    <div class="kviz-head">🎬 ${head}</div>
    <div class="kviz-stage"${stageStyle ? ` style="${stageStyle}"` : ''}>${stage}</div>
    ${cap ? `<div class="kviz-cap">${cap}</div>` : ''}
  </div>`;
const kn = (emoji, label, cls = '', style = '') =>
  `<div class="knode ${cls}"${style ? ` style="${style}"` : ''}><span class="kemoji">${emoji}</span>${label}</div>`;
const ar = (s = '←', style = '') => `<span class="karrow"${style ? ` style="${style}"` : ''}>${s}</span>`;
const say = (who, text, answer = false) =>
  `<div class="bubble${answer ? ' answer' : ''}"><div class="bubble-label">${who}</div><div>${text}</div></div>`;
const story = (...ps) => `<div class="story">${ps.map(p => `<p>${p}</p>`).join('')}</div>`;
const key = (label, text) => `<div class="keyidea"><div class="keyidea-label">🎯 ${label}</div><p>${text}</p></div>`;
const tip = (label, text) => `<div class="tip"><div class="tip-label">💡 ${label}</div>${text}</div>`;
const quiz = (items) => `<div class="quiz">${items.map(([q, a]) =>
  `<details class="quiz-q"><summary>${q}</summary><div class="quiz-a">${a}</div></details>`).join('')}</div>`;
const flow = (steps) => `<div class="sflow">${steps.map(([who, txt, cls]) =>
  `<div class="sf-step ${cls || ''}"><span class="sf-who">${who}</span><span class="sf-txt">${txt}</span></div>`).join('')}</div>`;

const SOURCE_NOTE = `
  <div class="verify-note">📷 הטקסט נקרא מתוך הצילומים של הדף (דפוס וילנא). במקומות שהצילום מטושטש ייתכנו טעויות קריאה קטנות. רש״י ותוספות מובאים כאן <strong>בביאור ובתמצית</strong>, לא כציטוט מלא.</div>
`;

// =======================================================
// DAF 4b
// =======================================================
amudim['4b'].scenes = [
  {
    tag: 'רקע',
    title: 'איפה אנחנו? <span class="accent">הזכרה ושאלה</span>',
    html: `
      ${SOURCE_NOTE}
      ${story(
        'אנחנו בפרק הראשון של תענית. כל הפרק עוסק בתפילה על הגשם, ויש בה <strong>שני חלקים שונים</strong>:'
      )}
      <div class="vs-grid">
        <div class="vs-card a"><div class="emoji">🗣️</div><h5>הזכרה</h5>
          <p>״<strong>משיב הרוח ומוריד הגשם</strong>״ בברכת ״מחיה המתים״. זה <em>שבח</em> לה׳, ״גבורות גשמים״.</p></div>
        <div class="vs-card b"><div class="emoji">🙏</div><h5>שאלה</h5>
          <p>״<strong>ותן טל ומטר</strong>״ בברכת השנים. זו <em>בקשה</em> ממש, ויש אותה רק בתפילת חול.</p></div>
      </div>
      ${story(
        'במשנה (דף ב.) נחלקו <strong>ר׳ אליעזר</strong> ו<strong>ר׳ יהושע</strong> ממתי מזכירים. לר׳ אליעזר מזכירים מיום טוב הראשון של סוכות. לר׳ יהושע מתחילים רק ביום טוב האחרון, ״משעת הנחתו״ של הלולב.',
        'אחר כך המשנה אומרת: <strong>״אין שואלין את הגשמים אלא סמוך לגשמים״</strong>. וכאן מתחיל העמוד שלנו.'
      )}
      ${kv('ציר השנה: מתי מזכירים ומתי שואלים',
        `<div class="year-line">
          <div class="yl-track"></div><div class="yl-fill hz"></div><div class="yl-fill sh"></div>
          <div class="yl-mark" style="right:4%"><span>🌿</span>סוכות</div>
          <div class="yl-mark" style="right:20%"><span>🍂</span>מרחשון</div>
          <div class="yl-mark" style="right:62%"><span>🍷</span>פסח</div>
          <div class="yl-mark" style="right:80%"><span>🌸</span>סוף ניסן</div>
        </div>`,
        '<span style="color:var(--gold-bright)">■</span> הזכרה מתחילה בחג. <span style="color:var(--sky-glow)">■</span> שאלה מתחילה רק במרחשון, סמוך לגשמים.')}
    `
  },
  {
    tag: 'סוגיה 1',
    title: '״רבי יהושע היא, דאמר <span class="accent">משעת הנחתו</span>״',
    html: `
      ${story('הגמרא שואלת: המשנה ״אין שואלין אלא סמוך לגשמים״ — של מי היא?')}
      ${say('הגמרא (כפי שמבאר רש״י)', 'לכאורה זו שיטת <strong>ר׳ יהושע</strong>, שאמר שמזכירים רק ״משעת הנחתו״ של הלולב, כלומר ביום טוב האחרון. גם הוא מאחר, כי לא רוצים להזכיר גשם כשעוד לא צריך אותו.')}
      ${say('רבא', '<strong>״אפילו תימא רבי אליעזר — שאלה לחוד והזכרה לחוד״</strong>. גם ר׳ אליעזר, שמזכיר כבר מתחילת החג, מודה שאת <em>הבקשה</em> לא אומרים עד סמוך לגשמים. הזכרה היא רק שבח, ושאלה היא בקשה ממש.', true)}
      ${kv('רבא מפריד בין שני הדברים',
        kn('🗣️', 'הזכרה<br><span style="opacity:.7">ר״א: מתחילת החג</span>', 'gold', 'animation:kPulse 3s infinite') +
        `<span class="karrow">≠</span>` +
        kn('🙏', 'שאלה<br><span style="opacity:.7">לכולם: סמוך לגשמים</span>', 'good', 'animation:kPulse 3s infinite 1.5s'),
        'אפשר <strong>לשבח</strong> על הגשם מוקדם, ו<strong>לבקש</strong> אותו רק בזמנו.')}
    `
  },
  {
    tag: 'משנה',
    title: 'ר׳ יהודה: <span class="accent">הראשון או האחרון?</span>',
    html: `
      ${story(
        'נמשיך במשנה: <strong>״רבי יהודה אומר: העובר לפני התיבה ביום טוב האחרון של חג — האחרון מזכיר, הראשון אינו מזכיר. ביום טוב הראשון של פסח — הראשון מזכיר, האחרון אינו מזכיר.״</strong>',
        'ביום טוב יש שני שליחי ציבור. <strong>״הראשון״</strong> הוא החזן של שחרית, ו<strong>״האחרון״</strong> הוא החזן של מוסף.'
      )}
      ${kv('שמיני עצרת: מתחילים',
        kn('🌅', 'שחרית<br><span style="opacity:.7">לא מזכיר</span>', '', '') + ar() +
        kn('☀️', 'מוסף<br><span style="opacity:.7">מזכיר!</span>', 'gold', 'animation:kPulse 3s infinite'))}
      ${kv('יום ראשון של פסח: מפסיקים',
        kn('🌅', 'שחרית<br><span style="opacity:.7">עוד מזכיר</span>', 'gold', 'animation:kPulse 3s infinite') + ar() +
        kn('☀️', 'מוסף<br><span style="opacity:.7">כבר לא</span>', ''),
        'לפי ר׳ יהודה ה<strong>הזכרה</strong> נגמרת כבר ב<strong>יום טוב הראשון של פסח</strong>.')}
    `
  },
  {
    tag: 'קושיה',
    title: '״ורמינהו״ — <span class="accent">ר׳ יהודה סותר את עצמו?</span>',
    html: `
      ${story('הגמרא מביאה משנה אחרת (שמופיעה אצלנו בעמוד הבא):')}
      ${say('ורמינהו', '<strong>״עד מתי שואלין את הגשמים? ר׳ יהודה אומר: עד שיעבור הפסח. ר׳ מאיר אומר: עד שיעבור ניסן.״</strong>')}
      ${kv('הסתירה',
        kn('📜', 'משנה א׳<br><span style="opacity:.7">מפסיקים ביו״ט ראשון של פסח</span>', 'bad') +
        `<span class="karrow">⚡</span>` +
        kn('📜', 'משנה ב׳<br><span style="opacity:.7">ממשיכים עד סוף הפסח</span>', 'bad', 'animation:kShake 1.4s infinite'),
        'שתי המשניות בשם <strong>אותו ר׳ יהודה</strong>. אז מתי מפסיקים: ביום הראשון של פסח או בסופו?')}
    `
  },
  {
    tag: 'תירוץ 1',
    title: 'רב חסדא: <span class="accent">״כאן לשאול, כאן להזכיר״</span>',
    html: `
      ${say('רב חסדא', '<strong>״לא קשיא: כאן לשאול, כאן להזכיר. מישאל — שאיל ואזיל; להזכיר — ביום טוב הראשון פסיק.״</strong>', true)}
      ${story(
        'שתי המשניות עוסקות בשני דברים שונים:',
        '• <strong>השאלה</strong> (״ותן טל ומטר״) נמשכת עד <em>סוף</em> הפסח, ואומרים אותה בחול המועד.',
        '• <strong>ההזכרה</strong> (״משיב הרוח״) נפסקת כבר ב<em>יום טוב הראשון</em>.'
      )}
      ${kv('לפי רב חסדא',
        `<div class="end-lines">
          <div class="el-row"><span class="el-name">הזכרה</span><div class="el-bar"><div class="el-fill y" style="background:var(--gold)"></div></div><span class="el-end">יו״ט א׳</span></div>
          <div class="el-row"><span class="el-name">שאלה</span><div class="el-bar"><div class="el-fill m"></div></div><span class="el-end">סוף פסח</span></div>
        </div>`,
        'השאלה ממשיכה <strong>אחרי</strong> שההזכרה כבר נפסקה.')}
    `
  },
  {
    tag: 'דחייה',
    title: 'עולא: <span class="accent">״כחומץ לשנים וכעשן לעינים״</span>',
    html: `
      ${say('עולא', '<strong>״הא דרב חסדא קשיא, כחומץ לשנים וכעשן לעינים!״</strong> התירוץ הזה צורב כמו חומץ על השיניים.')}
      ${story('למה? עולא בונה <strong>קל וחומר</strong>:')}
      ${flow([
        ['שמיני עצרת', 'שם <strong>לא שואלים</strong> (זו תפילת יום טוב, ואין בה ברכת השנים), ובכל זאת <strong>מזכירים</strong>.', ''],
        ['חול המועד פסח', 'כאן <strong>שואלים</strong> (תפילת חול).', ''],
        ['קל וחומר', 'אם מזכירים במקום שלא שואלים, ודאי שצריך להזכיר במקום ששואלים!', 'hl']
      ])}
      ${tip('רש״י מסביר', '״במקום שאינו שואל״ הוא שמיני עצרת, שמתפללים בו תפילת יום טוב, ואין שם ברכת השנים. ״במקום ששואל״ הוא חול המועד של פסח.')}
      ${say('עולא', '<strong>״אלא: תרי תנאי אליבא דר׳ יהודה״</strong>. שני תנאים מסרו בשם ר׳ יהודה שתי שיטות שונות, וזו באמת מחלוקת.', true)}
      ${tip('רש״י', 'לתנא אחד שואלים עד שיעבור הפסח, ו<em>כל שכן</em> מזכירים. לתנא השני השאלה וההזכרה נפסקות יחד.')}
    `
  },

function addPerekContext() {
  for (const ref in amudim) {
    const a = amudim[ref];
    if (a.scenes.length > 0) continue; // skip if has content

    const perek = getPerekFor(a.daf, a.amud);

      title: `דף ${heb(a.daf)} ע״${a.amud === 'a' ? 'א' : 'ב'} — <span class="accent">${perek.name}</span>`,
      html: `

          <h3>תוכן עוד לא נכתב</h3>
          <p>זהו תשתית מוכנה. ניתן להוסיף סצנות אנימציה, רש״י ותוספות לדף הזה.</p>
          <div class="stub-perek">
            <div class="stub-perek-label">הפרק שבו דף זה</div>
            <div class="stub-perek-name">פרק ${perek.num} — ${perek.name}</div>
          </div>
        </div>
      `
    }];
  }
}

function heb(n) {
  const ones = ['', 'א', 'ב', 'ג', 'ד', 'ה', 'ו', 'ז', 'ח', 'ט'];
  const tens = ['', 'י', 'כ', 'ל', 'מ', 'נ', 'ס', 'ע', 'פ', 'צ'];
  const hundreds = ['', 'ק', 'ק״ק'];

  if (n < 10) return ones[n];
  if (n === 15) return 'ט״ו';
  if (n === 16) return 'ט״ז';
  if (n < 100) {
    const t = Math.floor(n / 10);
    const o = n % 10;
    if (o === 0) return tens[t];
    return tens[t] + '״' + ones[o];
  }
  // 100+
  const h = Math.floor(n / 100);
  const rest = n % 100;
  if (rest === 0) return hundreds[h];
  if (rest < 10) return hundreds[h] + '״' + ones[rest];
  if (rest === 15) return hundreds[h] + 'ט״ו';
  if (rest === 16) return hundreds[h] + 'ט״ז';
  const t = Math.floor(rest / 10);
  const o = rest % 10;
  if (o === 0) return hundreds[h] + tens[t];
  return hundreds[h] + tens[t] + ones[o];
}

        <p style="margin-top: 14px;"><strong>הכלי החזק ביותר</strong> שיש לך הוא לסמן (בעיפרון או במחשבה) את <em>מילות המפתח</em>. ברגע שאתה רואה ״מתיב״ — אתה יודע שמשהו הולך להישבר. ברגע שאתה רואה ״לא קשיא״ — מסדרים.</p>
      </div>
      <div class="tip">
        <div class="tip-label">📚 משאבים נוספים</div>
        <p>• <strong>שטיינזלץ</strong> — תרגום ופירוש מלא לכל הש״ס<br>
        • <strong>ספריא.אורג</strong> — הש״ס עם תרגום וקישורים<br>
        • <strong>חברותא</strong> — אין תחליף ללימוד עם בן אדם</p>
      </div>
      <div class="story" style="text-align: center; margin-top: 18px;">
        <p style="font-size: 18px; color: var(--gold-bright); font-weight: 700;">בהצלחה בלימוד! 📖✨</p>
      </div>
    `
  }
];

// =======================================================
// TERMS DICTIONARY for clickable Aramaic words
// =======================================================
const terms = {
  'amar': {
    aram: 'אמר ר׳ X',
    pron: 'amar Rabi X',
    fn: 'statement',
    fnLabel: 'הצהרה',
    mean: 'מילת מפתח שמכניסה אמרה של אמורא או חכם',
    use: '<strong>שימוש:</strong> בכל פעם שתראה ״אמר רב/ר׳ X״ - דע שעכשיו מציגים אמרה של אותו חכם. זה הקול שלו, לא של עורך הגמרא.'
  },
  'amar-lei': {
    aram: 'אמר ליה',
    pron: 'amar lei',
    fn: 'answer',
    fnLabel: 'תגובה',
    mean: '״אמר לו״ - בדרך כלל תשובה לקושיה',
    use: '<strong>שימוש:</strong> ברגע שתראה את זה אחרי קושיה - דע שעכשיו מגיע <em>תירוץ</em>.'
  },
  'metiv': {
    aram: 'מתיב / מקשי',
    pron: 'metiv / makshi',
    fn: 'question',
    fnLabel: 'קושיה',
    mean: '״הקשה״ - מישהו מתריס נגד אמרה קודמת',
    use: '<strong>שימוש:</strong> דגל אדום! משהו מתחיל לקרוס. נסה להבין: <em>מה הקושיה?</em> ב 99% מהמקרים היא ממקור שעולה לסתור.'
  },
  'atu': {
    aram: 'אטו',
    pron: 'atu',
    fn: 'question',
    fnLabel: 'תמיהה',
    mean: '״האם?״ בלשון תמיהה ריטורית',
    use: '<strong>שימוש:</strong> כשאתה רואה ״אטו״ - יש כאן <em>אבסורד מובלע</em>. ״אטו X כך?״ אומר ״לא יכול להיות ש-X״.'
  },
  'shani': {
    aram: 'שאני',
    pron: 'shani',
    fn: 'distinction',
    fnLabel: 'חילוק',
    mean: '״שונה!״ - מציג הבדל בין מקרים',
    use: '<strong>שימוש:</strong> זאת המילה החביבה על תוספות. ״שאני X״ אומר ״הדבר הזה שונה, ולכן הכלל לא חל עליו״.'
  }
};

// =======================================================
// STATE & RENDERING
// =======================================================
const state = {
  tab: 'masechet',
  ref: '4b',
  sceneIdx: 0,
  modal: null
};

function getAllRefs() {
  return Object.keys(amudim).sort((a, b) => {
    const da = parseInt(a);
    const db = parseInt(b);
    if (da !== db) return da - db;
    return a.endsWith('a') ? -1 : 1;
  });
}

const allRefs = getAllRefs();

function getCurrentIdx() { return allRefs.indexOf(state.ref); }

function goToRef(ref) {
  if (!amudim[ref]) return;
  state.ref = ref;
  state.sceneIdx = 0;
  renderAll();
  window.scrollTo(0, 0);
}

function renderHeader() {
  const amud = amudim[state.ref];
  const perek = getPerekFor(amud.daf, amud.amud);
  document.getElementById('dafTitle').textContent =
    `דף ${heb(amud.daf)} ע״${amud.amud === 'a' ? 'א' : 'ב'}`;
  document.getElementById('perekName').textContent =
    `פרק ${perek.num} — ${perek.name}`;

  const idx = getCurrentIdx();
  document.getElementById('prevDafBtn').disabled = idx === 0;
  document.getElementById('nextDafBtn').disabled = idx === allRefs.length - 1;
}

function renderActionBar() {
  const amud = amudim[state.ref];
  document.getElementById('rashiCount').textContent = amud.rashi.length;
  document.getElementById('tosCount').textContent = amud.tosafot.length;
  document.getElementById('rashiBtn').classList.toggle('disabled', amud.rashi.length === 0);
  document.getElementById('tosBtn').classList.toggle('disabled', amud.tosafot.length === 0);
}

// ===== זיכרון מיקום: מסכת, דף, סצנה ולשונית =====
const SAVE_KEY = 'gemara:taanit';
function savePlace() {
  try {
    localStorage.setItem('gemara:last', 'taanit');
    localStorage.setItem(SAVE_KEY, JSON.stringify({ ref: state.ref, sceneIdx: state.sceneIdx, tab: state.tab }));
  } catch (e) {}
}
function restorePlace() {
  try {
    const p = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
    if (!p || !amudim[p.ref]) return;
    state.ref = p.ref;
    state.tab = p.tab === 'tutorial' ? 'tutorial' : 'masechet';
    const n = state.tab === 'masechet' ? amudim[p.ref].scenes.length : tutorialScenes.length;
    state.sceneIdx = Math.min(Math.max(0, p.sceneIdx | 0), n - 1);
    document.body.classList.toggle('tutorial-mode', state.tab === 'tutorial');
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === state.tab));
  } catch (e) {}
}

function renderScenes() {
  savePlace();
  const stage = document.getElementById('stage');
  const scenes = state.tab === 'masechet' ? amudim[state.ref].scenes : tutorialScenes;

  stage.innerHTML = '';
  scenes.forEach((scene, i) => {
    const div = document.createElement('section');
    div.className = 'scene' + (i === state.sceneIdx ? ' active' : '');
    div.innerHTML = `
      <div class="scene-tag ${scene.tagClass || ''}">${scene.tag}</div>
      <h2 class="scene-title">${scene.title}</h2>
      ${scene.src ? srcBlock(scene.src) : ''}
      ${scene.html}
    `;
    stage.appendChild(div);
  });

  renderProgress();
}

function renderProgress() {
  const scenes = state.tab === 'masechet' ? amudim[state.ref].scenes : tutorialScenes;
  const progressEl = document.getElementById('progress');
  const counterEl = document.getElementById('counter');

  progressEl.innerHTML = '';
  for (let i = 0; i < scenes.length; i++) {
    const dot = document.createElement('div');
    dot.className = 'dot' + (i === state.sceneIdx ? ' active' : '');
    dot.addEventListener('click', () => {
      state.sceneIdx = i;
      renderScenes();
    });
    progressEl.appendChild(dot);
  }

  counterEl.textContent = scenes.length > 1
    ? `${state.sceneIdx + 1} / ${scenes.length}`
    : '';

  document.getElementById('prevSceneBtn').disabled = state.sceneIdx === 0;
  document.getElementById('nextSceneBtn').disabled = state.sceneIdx === scenes.length - 1;
}

function renderAll() {
  if (state.tab === 'masechet') {
    renderHeader();
    renderActionBar();
  }
  renderScenes();
}

function switchTab(tab) {
  if (state.tab === tab) return;
  state.tab = tab;
  state.sceneIdx = 0;
  document.body.classList.toggle('tutorial-mode', tab === 'tutorial');
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', t.dataset.tab === tab);
  });
  renderAll();
  window.scrollTo(0, 0);
}

function changeScene(delta) {
  const scenes = state.tab === 'masechet' ? amudim[state.ref].scenes : tutorialScenes;
  const newIdx = state.sceneIdx + delta;
  if (newIdx < 0 || newIdx >= scenes.length) return;
  state.sceneIdx = newIdx;
  renderScenes();
}

// =======================================================
// MODAL
// =======================================================
function openModal(type) {
  const amud = amudim[state.ref];
  const entries = type === 'rashi' ? amud.rashi : amud.tosafot;
  if (entries.length === 0) return;

  state.modal = type;
  const modal = document.getElementById(type === 'rashi' ? 'rashiModal' : 'tosModal');
  const content = document.getElementById(type === 'rashi' ? 'rashiContent' : 'tosContent');

  content.innerHTML = '';
  entries.forEach(e => {
    const div = document.createElement('div');
    div.className = 'meforesh-entry';
    div.innerHTML = `
      <div class="meforesh-dh">${e.dh}</div>
      <div class="meforesh-content">${e.content}</div>
    `;
    content.appendChild(div);
  });

  document.getElementById('modalOverlay').classList.add('open');
  modal.classList.add('open');
}

function openTranslation() {
  const amud = amudim[state.ref];
  const trans = amud.translation || [];
  const content = document.getElementById('transContent');

  if (trans.length === 0) {
    content.innerHTML = `
      <div class="modal-empty">
        <div class="e-icon">📭</div>
        <p style="color: var(--parchment-dim); font-size: 14px;">תרגום עדיין לא נוסף לדף זה.<br>התשתית מוכנה — ניתן להוסיף תרגום בקובץ.</p>
      </div>
    `;
  } else {
    let html = amud.photo ? `<button class="photo-btn" onclick="openPhoto('${state.ref}')">📷 הצג את צילום הדף המלא</button>` : '';
    trans.forEach(entry => {
      if (entry.type === 'section') {
        html += `<div class="trans-section-header">${entry.title}</div>`;
      } else if (entry.type === 'quote') {
        html += `
          <div class="trans-entry">
            <div class="trans-aram">${entry.aramaic}</div>
            <div class="trans-heb">${entry.translation}</div>
            ${entry.viz || ''}
          </div>
        `;
      } else if (entry.type === 'summary') {
        html += `<div class="trans-summary">${entry.text}${entry.viz || ''}</div>`;
      } else if (entry.type === 'note') {
        html += `<div class="trans-note">${entry.text}</div>`;
      }
    });
    content.innerHTML = html;
  }

  state.modal = 'trans';
  document.getElementById('modalOverlay').classList.add('open');
  document.getElementById('transModal').classList.add('open');
}

function closeModal() {
  state.modal = null;
  document.getElementById('modalOverlay').classList.remove('open');
  document.getElementById('rashiModal').classList.remove('open');
  document.getElementById('tosModal').classList.remove('open');
  document.getElementById('termModal').classList.remove('open');
  document.getElementById('transModal').classList.remove('open');
  document.getElementById('pickerModal').classList.remove('open');
}

// =======================================================
// DAF PICKER
// =======================================================
function openPicker() {
  const content = document.getElementById('pickerContent');
  content.innerHTML = '';

  perakim.forEach(perek => {
    const section = document.createElement('div');
    section.className = 'perek-section';

    const header = document.createElement('div');
    header.className = 'perek-header';
    header.textContent = `פרק ${perek.num} — ${perek.name}`;
    section.appendChild(header);

    const grid = document.createElement('div');
    grid.className = 'daf-grid';

    // Find range of dapim in this perek
    const perekIdx = perakim.indexOf(perek);
    const nextPerek = perakim[perekIdx + 1];
    const endDaf = nextPerek ? nextPerek.start : 32;
    const endAmud = nextPerek ? nextPerek.startAmud : 'b';

    // Iterate through dapim
    for (let d = perek.start; d < endDaf || (d === endDaf && nextPerek && nextPerek.startAmud === 'b'); d++) {
      const startA = (d === perek.start) ? perek.startAmud : 'a';
      const amudOpts = startA === 'b' ? ['b'] : ['a', 'b'];
      for (const a of amudOpts) {
        if (d === endDaf && nextPerek && a === nextPerek.startAmud) break;
        if (d === 120 && a === 'b') {} // include 120b
        const ref = `${d}${a}`;
        if (!amudim[ref]) continue;
        const btn = document.createElement('button');
        btn.className = 'daf-btn';
        if (ref === state.ref) btn.classList.add('current');
        if (amudim[ref].scenes.length > 0 && amudim[ref].scenes[0].tag !== `פרק ${getPerekFor(d, a).num}`) {
          btn.classList.add('has-content');
        }
        // Show daf number with side
        btn.textContent = `${heb(d)}${a === 'a' ? '.' : ':'}`;
        btn.addEventListener('click', () => {
          goToRef(ref);
          closeModal();
        });
        grid.appendChild(btn);
      }
    }

    section.appendChild(grid);
    content.appendChild(section);
  });

  state.modal = 'picker';
  document.getElementById('modalOverlay').classList.add('open');
  document.getElementById('pickerModal').classList.add('open');
}

// =======================================================
// EVENT BINDINGS
// =======================================================
document.getElementById('prevDafBtn').addEventListener('click', () => {
  const idx = getCurrentIdx();
  if (idx > 0) goToRef(allRefs[idx - 1]);
});
document.getElementById('nextDafBtn').addEventListener('click', () => {
  const idx = getCurrentIdx();
  if (idx < allRefs.length - 1) goToRef(allRefs[idx + 1]);
});
document.getElementById('dafDisplay').addEventListener('click', openPicker);

// Tab switching
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => switchTab(tab.dataset.tab));
});

// Term modal for clickable Aramaic words in tutorial
document.addEventListener('click', (e) => {
  const term = e.target.closest('.term');
  if (term && term.dataset.term) {
    openTerm(term.dataset.term);
  }
});

function openTerm(key) {
  const t = terms[key];
  if (!t) return;
  const fnColors = {
    statement: { bg: 'rgba(232,183,109,0.2)', color: 'var(--gold-bright)' },
    question: { bg: 'rgba(193,74,90,0.2)', color: 'var(--crimson-glow)' },
    answer: { bg: 'rgba(136,178,122,0.2)', color: 'var(--sage-glow)' },
    source: { bg: 'rgba(127,179,213,0.2)', color: 'var(--sky-glow)' },
    distinction: { bg: 'rgba(176,143,196,0.2)', color: '#b08fc4' },
    conclusion: { bg: 'rgba(232,154,109,0.2)', color: 'var(--warm)' }
  };
  const c = fnColors[t.fn];

  document.getElementById('termContent').innerHTML = `
    <div class="modal-aram-big">${t.aram}</div>
    <div class="modal-pron">${t.pron}</div>
    <div class="modal-fn-badge" style="background: ${c.bg}; color: ${c.color};">${t.fnLabel}</div>
    <div class="modal-mean-text">${t.mean}</div>
    <div class="modal-use">${t.use}</div>
  `;

  state.modal = 'term';
  document.getElementById('modalOverlay').classList.add('open');
  document.getElementById('termModal').classList.add('open');
}

document.getElementById('prevSceneBtn').addEventListener('click', () => changeScene(-1));
document.getElementById('nextSceneBtn').addEventListener('click', () => changeScene(1));

document.getElementById('rashiBtn').addEventListener('click', () => openModal('rashi'));
document.getElementById('tosBtn').addEventListener('click', () => openModal('tos'));
document.getElementById('transBtn').addEventListener('click', () => openTranslation());

document.getElementById('modalOverlay').addEventListener('click', closeModal);
document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', closeModal));

document.addEventListener('keydown', (e) => {
  if (state.modal) {
    if (e.key === 'Escape') { if (state.modal === 'photo') closePhoto(); else closeModal(); }
    return;
  }
  if (e.key === 'ArrowLeft') changeScene(1);
  if (e.key === 'ArrowRight') changeScene(-1);
});

// Touch swipe for scenes
let touchStartX = 0, touchStartY = 0, touchStartT = 0;
document.addEventListener('touchstart', (e) => {
  if (e.touches.length !== 1) return;
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
  touchStartT = Date.now();
}, { passive: true });

document.addEventListener('touchend', (e) => {
  if (state.modal) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  const dt = Date.now() - touchStartT;
  if (Math.abs(dx) > 80 && Math.abs(dx) > Math.abs(dy) * 2 && dt < 600) {
    if (dx > 0) changeScene(-1);
    else changeScene(1);
  }
}, { passive: true });

// URL hash for deep linking
function readHash() {
  const h = window.location.hash.slice(1);
  if (h === 'tutorial') {
    switchTab('tutorial');
    return;
  }
  if (h && amudim[h]) {
    switchTab('masechet');
    goToRef(h);
  }
}
window.addEventListener('hashchange', readHash);
restorePlace();
readHash();

// Initial render
renderAll();
</script>
